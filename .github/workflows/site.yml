name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: pnpm dlx wrangler@4.162.0
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build cpl
        run: cargo build --release --bin cpl
      - name: Build
        run: pnpm --filter cp-lang-web build
      - name: Check the secrets are set
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::set the CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::set the CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
      - name: Deploy
        working-directory: web/worker
        run: $WRANGLER deploy --message "$GITHUB_SHA"
      - name: Smoke
        run: |
          for path in / /docs/ /play/ /install.sh; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-all-errors "https://cp-lang.org$path")
            echo "$path $code"; test "$code" = 200
          done
