name: site

# Deploys the newest main commit whose `site build` and `site browser tests`
# jobs passed, whenever a ci run on main ends, even if unrelated jobs are red
# or the run was superseded (handbook/guidelines/ci-checklist.md ci/R25). A
# manual dispatch deploys its ref.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "23,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# A started deploy always finishes; a newer trigger replaces the waiting one,
# and it selects the newest passing commit itself.
concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  select:
    # A superseded (cancelled) ci run ran no job, so it can't make a commit
    # deployable; skipping it keeps the selection inside the API rate limit.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion != 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      since: ${{ steps.pick.outputs.since }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then sha=$GITHUB_SHA; else sha=$(scripts/site-deployable.sh); fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
  deploy:
    needs: select
    if: needs.select.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: pnpm dlx wrangler@4.162.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.sha }}
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build cpl
        run: cargo build --release --bin cpl
      - name: Build
        run: pnpm --filter cp-lang-web build
      - name: Check the secrets are set
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::set the CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::set the CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
      - name: Deploy
        working-directory: web/worker
        env:
          DEPLOY_SHA: ${{ needs.select.outputs.sha }}
        run: $WRANGLER deploy --message "$DEPLOY_SHA"
      - name: Smoke
        run: |
          for path in / /docs/ /play/ /install.sh; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-all-errors "https://cp-lang.org$path")
            echo "$path $code"; test "$code" = 200
          done
  fresh:
    # The alert for a stale site (ci/R25): on the schedule only, after the
    # deploy, so it never holds one up. Red when a passing commit has waited
    # more than 30 minutes and this run did not deploy it.
    needs: [select, deploy]
    if: always() && github.event_name == 'schedule' && needs.select.outputs.sha != '' && needs.deploy.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: live site is current
        env:
          SHA: ${{ needs.select.outputs.sha }}
          SINCE: ${{ needs.select.outputs.since }}
        run: |
          age=$(( ($(date +%s) - $(date -d "$SINCE" +%s)) / 60 ))
          echo "$SHA passed its site jobs $age min ago and is not live"
          if [ "$age" -gt 30 ]; then echo "::error::cp-lang.org is $age min behind $SHA (ci/R25)"; exit 1; fi
