name: site

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Cloudflare Pages branch; main is the production deployment, anything else a preview
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: site-${{ inputs.branch }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: pnpm dlx wrangler@4.162.0
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter cp-lang-web build
      - name: Check the secrets are set
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::set the CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::set the CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
      - name: Deploy to Cloudflare Pages
        env:
          BRANCH: ${{ inputs.branch }}
        run: $WRANGLER pages deploy web/out --project-name=cp-lang --branch="$BRANCH" --commit-hash="$GITHUB_SHA" --commit-dirty=true
      - name: Deploy the Worker
        if: hashFiles('web/worker/wrangler.toml', 'web/worker/wrangler.json', 'web/worker/wrangler.jsonc') != ''
        working-directory: web/worker
        run: $WRANGLER deploy
