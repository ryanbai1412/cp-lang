name: release

# Edge: after each green main CI run edge is behind, plus nightly.
# Stable: pushing a `v<workspace version>` tag.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*", "edge-now-*"] # edge-now-*: edge from the newest green commit, or edge-now-<sha> from that main commit
  schedule:
    - cron: "17 7 * * *" # nightly edge
    - cron: "41 * * * *" # hourly edge from the newest shippable main commit (decisions 408, 425)
  workflow_dispatch:
    inputs:
      channel:
        description: stable releases v<workspace version>; edge replaces the rolling edge prerelease and makes today's edge-YYYY-MM-DD if missing
        type: choice
        options:
          - edge
          - stable
        default: edge
      publish:
        description: Publish the GitHub releases; off builds and uploads the assets as workflow artifacts only
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

# A started release always finishes; a newer trigger replaces the waiting one.
# A ci run that didn't pass releases nothing, so its trigger gets a group of its
# own instead of displacing a waiting release.
concurrency:
  group: release-${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && github.run_id || (startsWith(github.ref, 'refs/tags/v') && 'stable' || inputs.channel || 'edge') }}
  cancel-in-progress: false

jobs:
  plan:
    # A superseded (cancelled) ci run ends ~100 times an hour; planning on each
    # one spent the repo's API rate limit, and a red run every ~12 min is timer
    # enough for the hourly fallback (ci/R26).
    if: github.event_name != 'workflow_run' || ((github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      go: ${{ steps.green.outputs.go }}
      channel: ${{ steps.plan.outputs.channel }}
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.plan.outputs.commit }}
      date: ${{ steps.plan.outputs.date }}
      toolchain: ${{ steps.plan.outputs.toolchain }}
      tags: ${{ steps.plan.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/release
      # Releases build only a main commit CI passed: the run that triggered
      # this one, the tagged commit, the newest shippable one (hourly), or
      # else the newest green one.
      - id: green
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ startsWith(github.ref, 'refs/tags/v') && 'stable-tag' || github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          . scripts/retry.sh
          go=true
          case "$EVENT" in
            workflow_run)
              sha=$RUN_SHA
              if [ "$RUN_CONCLUSION" != success ]; then
                # Red CI: GitHub drops most hourly crons on this
                # repo, so such a run ships the newest shippable commit instead
                # (decisions 408, 425), at most once an hour; of runs going at once only the
                # oldest selects, so two can't each wait for the other.
                # The release object keeps its first publish time; latest.json's
                # upload time is when edge last moved.
                last=$(retry gh release view edge -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name == "latest.json") | .updatedAt')
                age=$(( $(date +%s) - $(date -d "${last:-1970-01-01T00:00:00Z}" +%s) ))
                busy=$(gh run list -R "$GITHUB_REPOSITORY" --workflow release.yml --status in_progress \
                  --json databaseId --jq "[.[] | select(.databaseId < $GITHUB_RUN_ID)] | length")
                if [ "$busy" != 0 ]; then
                  echo "$busy older release run(s) are going; skipping"; go=false
                else
                  # Edge moved under an hour ago: this run becomes the hourly
                  # timer, so a commit that turns shippable after a publish
                  # still ships within the hour even if no later run ends.
                  if [ "$age" -lt 3600 ]; then
                    echo "edge moved ${age}s ago; waiting $((3600 - age))s, then selecting"
                    sleep $((3600 - age))
                  fi
                  sha=$(scripts/release/shippable.sh)
                  [ -n "$sha" ] || { echo "no shippable main commit yet; skipping"; sha=$RUN_SHA; go=false; }
                fi
              fi
              # Publish whenever edge is behind this green commit; the
              # concurrency group keeps one release in flight, and the newest
              # waiting trigger replaces any older one.
              # Edge's commit is latest.json's: the tag lags when GITHUB_TOKEN
              # can't move it (decision 386).
              edge=$(fetch_optional "https://github.com/$GITHUB_REPOSITORY/releases/download/edge/latest.json")
              edge=$(jq -r '.commit // empty' <<<"${edge:-null}")
              if [ -n "$edge" ]; then
                rel=$(retry gh api "repos/$GITHUB_REPOSITORY/compare/$sha...$edge" --jq .status)
                if [ "$rel" = identical ] || [ "$rel" = ahead ]; then
                  echo "edge ($edge) already includes $sha; skipping"
                  go=false
                fi
              fi
              ;;
            stable-tag) sha=$GITHUB_SHA ;;
            *)
              # edge-now-<sha>, pushed on a main tip, builds that main commit
              # even if a failing job kept its CI red; the tag's
              # message becomes a release note naming the failure.
              if [[ "$GITHUB_REF_NAME" =~ ^edge-now-([0-9a-f]{7,40})$ ]]; then
                sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/${BASH_REMATCH[1]}" --jq .sha)
                rel=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...main" --jq .status)
                [ "$rel" = ahead ] || [ "$rel" = identical ] || { echo "::error::$sha is not on main"; exit 1; }
                echo "sha=$sha" >>"$GITHUB_OUTPUT"; echo "go=true" >>"$GITHUB_OUTPUT"; exit 0
              fi
              if [ "$EVENT" = schedule ]; then
                # Hourly: edge ships the newest commit whose shipping jobs
                # passed (scripts/release/shippable.sh), if edge lacks it.
                sha=$(scripts/release/shippable.sh)
                edge=$(fetch_optional "https://github.com/$GITHUB_REPOSITORY/releases/download/edge/latest.json")
                edge=$(jq -r '.commit // empty' <<<"${edge:-null}")
                if [ -n "$sha" ] && [ -n "$edge" ]; then
                  rel=$(retry gh api "repos/$GITHUB_REPOSITORY/compare/$sha...$edge" --jq .status)
                  if [ "$rel" = identical ] || [ "$rel" = ahead ]; then
                    echo "edge ($edge) already includes $sha; skipping"; go=false
                  fi
                fi
              else
                sha=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push \
                  --status success -L 1 --json headSha --jq '.[0].headSha // empty')
              fi
              ;;
          esac
          test -n "$sha" || { echo "::error::no main commit has passed CI"; exit 1; }
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          echo "go=$go" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.green.outputs.sha }}
      - id: plan
        if: steps.green.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || inputs.channel || 'edge' }}
        run: |
          scripts/release/plan.sh "$CHANNEL"
          if [ "$CHANNEL" = stable ] && [ "$GITHUB_EVENT_NAME" = push ] && ! grep -qx "tags=$GITHUB_REF_NAME" "$GITHUB_OUTPUT"; then
            echo "::error::tag $GITHUB_REF_NAME is not v<workspace version> from Cargo.toml"; exit 1
          fi

  build:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - uses: ./.github/actions/setup-rust
        with:
          key: ${{ matrix.target }}
      - uses: astral-sh/setup-uv@v6
      - name: Install cargo-zigbuild
        if: contains(matrix.target, 'linux-musl')
        run: uv tool install cargo-zigbuild==0.24.1
      - name: Build and pack
        env:
          CPL_CHANNEL: ${{ needs.plan.outputs.channel }}
          CPL_COMMIT: ${{ needs.plan.outputs.commit }}
        run: scripts/release/build.sh "${{ matrix.target }}" dist
      - name: Smoke test
        if: matrix.target != 'aarch64-unknown-linux-musl' && matrix.target != 'x86_64-apple-darwin'
        run: |
          mkdir smoke
          case "${{ matrix.target }}" in
            *windows*) unzip -q "dist/cpl-${{ matrix.target }}.zip" -d smoke ;;
            *) tar -xzf "dist/cpl-${{ matrix.target }}.tar.gz" -C smoke ;;
          esac
          smoke/bin/cpl --version | tee version.txt
          sha=$(cut -c1-8 <<<"${{ needs.plan.outputs.commit }}")
          case "${{ needs.plan.outputs.channel }}" in
            stable) grep -E "^cpl [0-9.]+\+$sha" version.txt ;;
            *) grep -F -- "-${{ needs.plan.outputs.channel }}+$sha" version.txt ;;
          esac
          printf 'print("ok")\n' >smoke/hello.cp
          test "$(smoke/bin/cpl run smoke/hello.cp)" = ok
      - uses: actions/upload-artifact@v4
        with:
          name: cpl-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  editors:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: VS Code extension
        working-directory: editors/vscode
        run: |
          npm ci --no-audit --no-fund
          npm run package
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: JetBrains plugin
        working-directory: editors/jetbrains
        # Gradle is uncached (decision 383): it resolves through the Maven
        # mirror and backs off on a 429.
        run: |
          for wait in 0 30 90 180; do
            sleep "$wait"
            ./gradlew --no-daemon --init-script ../../scripts/gradle-mirror.init.gradle buildPlugin && exit 0
          done
          exit 1
      - name: Collect
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
        # Versioned names to keep, unversioned ones for the per-channel URL
        # (releases/download/<edge|vX>/cp-lang.vsix) the site and docs link to.
        run: |
          mkdir -p dist
          cp editors/vscode/cp-lang.vsix dist/cp-lang.vsix
          zips=(editors/jetbrains/build/distributions/*.zip)
          test "${#zips[@]}" -eq 1
          cp "${zips[0]}" dist/cp-lang-jetbrains.zip
          v=${VERSION//+/.}
          cp dist/cp-lang.vsix "dist/cp-lang-$v.vsix"
          cp dist/cp-lang-jetbrains.zip "dist/cp-lang-jetbrains-$v.zip"
          uv run --quiet python scripts/release/editors.py dist
          # A green commit older than the script gets it from this workflow's commit.
          if [ ! -f scripts/release/jetbrains_repo.py ]; then
            git fetch -q --depth 1 origin "$GITHUB_SHA"
            git show "$GITHUB_SHA:scripts/release/jetbrains_repo.py" > scripts/release/jetbrains_repo.py
          fi
          uv run --quiet python scripts/release/jetbrains_repo.py dist "$CHANNEL"
      - uses: actions/upload-artifact@v4
        with:
          name: editors
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [plan, build, editors]
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # The publish scripts come from this workflow's commit (main's tip for a
      # workflow_run), not the built one, so an older build can't publish with
      # an older, delete-first publish.sh.
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          VERSION: ${{ needs.plan.outputs.version }}
          COMMIT: ${{ needs.plan.outputs.commit }}
          DATE: ${{ needs.plan.outputs.date }}
          TOOLCHAIN: ${{ needs.plan.outputs.toolchain }}
          TAGS: ${{ needs.plan.outputs.tags }}
        run: |
          scripts/release/publish.sh dist "$CHANNEL" "$VERSION" "$COMMIT" "$DATE" "$TOOLCHAIN" "$TAGS"
          if [[ "$GITHUB_REF_NAME" == edge-now-* ]]; then
            obj=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq 'select(.object.type == "tag") | .object.sha')
            if [ -n "$obj" ]; then
              note=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$obj" --jq .message)
              gh release edit edge --notes "$(gh release view edge --json body --jq .body)"$'\n\n'"Known issues: $note"
            fi
          fi

  # Every published archive gets a Sigstore build-provenance attestation, so
  # `gh attestation verify <archive> -R ryanbai1412/cp-lang` proves it came
  # from this workflow at that commit (ci/R33). Its own job: a signing outage
  # never holds back a release or its install smoke.
  sign:
    needs: [plan, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

  # The one-line installers on clean runners of all three OSes, against what
  # publish just released: `cpl` installs, runs a program (CRLF too) and builds C++.
  install-smoke:
    needs: [plan, publish]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          sparse-checkout: web/public
      - name: sh install.sh (curl -fsSL https://cp-lang.org/install.sh | sh)
        if: runner.os != 'Windows'
        run: sh web/public/install.sh --channel ${{ needs.plan.outputs.channel }} && echo "$HOME/.cpl/bin" >>"$GITHUB_PATH"
      - name: install.ps1 (irm https://cp-lang.org/install.ps1 | iex)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ([scriptblock]::Create((Get-Content -Raw web/public/install.ps1))) -Channel ${{ needs.plan.outputs.channel }}
          "$HOME\.cpl\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      # The plain one-liner, no channel flag: stable once one exists, else edge
      # with a notice (GitHub's releases/latest skips prereleases).
      - name: default channel installs (no flags)
        if: runner.os != 'Windows'
        env:
          CPL_HOME: ${{ runner.temp }}/cpl-default
          COMMIT: ${{ needs.plan.outputs.commit }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          sh web/public/install.sh
          "$CPL_HOME/bin/cpl" --version | tee default.txt
          if ! curl -fsIL -o /dev/null "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json"; then
            test "$CHANNEL" != edge || grep -q "${COMMIT:0:8}" default.txt
          fi
      - name: default channel installs (no flags, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CPL_HOME: ${{ runner.temp }}\cpl-default
          COMMIT: ${{ needs.plan.outputs.commit }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          & ([scriptblock]::Create((Get-Content -Raw web/public/install.ps1))) -NoModifyPath
          $v = & "$env:CPL_HOME\bin\cpl.exe" --version
          $v
          $stable = $true
          try { Invoke-WebRequest -Method Head "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/latest.json" | Out-Null } catch { $stable = $false }
          if (-not $stable -and $env:CHANNEL -eq 'edge' -and $v -notmatch $env:COMMIT.Substring(0, 8)) { throw "default install is not edge $env:COMMIT: $v" }
      - name: cpl runs and builds
        shell: bash
        env:
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          cpl --version | tee version.txt
          grep -q "${COMMIT:0:8}" version.txt
          printf 'print(1 + 2)\n' >hello.cp
          test "$(cpl run hello.cp | tr -d '\r')" = 3
          printf 'print(2)\r\nprint(4 * 4)\r\n' >crlf.cp
          test "$(cpl run crlf.cp | tr -d '\r' | tr '\n' ' ')" = '2 16 '
          cpl build hello.cp -o - | grep -q 'int main'
