name: release

# Edge: after a green main CI run, at most once an hour, plus nightly.
# Stable: pushing a `v<workspace version>` tag.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*", "edge-now-*"] # edge-now-*: edge from the newest green commit, on demand
  schedule:
    - cron: "17 7 * * *" # nightly edge
  workflow_dispatch:
    inputs:
      channel:
        description: stable releases v<workspace version>; edge replaces the rolling edge prerelease and makes today's edge-YYYY-MM-DD if missing
        type: choice
        options:
          - edge
          - stable
        default: edge
      publish:
        description: Publish the GitHub releases; off builds and uploads the assets as workflow artifacts only
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

# A started release always finishes; a newer trigger replaces the waiting one.
concurrency:
  group: release-${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || inputs.channel || 'edge' }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.green.outputs.go }}
      channel: ${{ steps.plan.outputs.channel }}
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.plan.outputs.commit }}
      date: ${{ steps.plan.outputs.date }}
      toolchain: ${{ steps.plan.outputs.toolchain }}
      tags: ${{ steps.plan.outputs.tags }}
    steps:
      # Releases build only a main commit CI passed: the run that triggered
      # this one, the tagged commit, or else the newest green one.
      - id: green
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ startsWith(github.ref, 'refs/tags/v') && 'stable-tag' || github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          go=true
          case "$EVENT" in
            workflow_run)
              sha=$RUN_SHA
              last=$(gh release view edge -R "$GITHUB_REPOSITORY" --json publishedAt --jq .publishedAt 2>/dev/null || true)
              if [ -n "$last" ] && [ $(( $(date +%s) - $(date -d "$last" +%s) )) -lt 3600 ]; then
                echo "edge was published at $last, under an hour ago; skipping"
                go=false
              fi
              ;;
            stable-tag) sha=$GITHUB_SHA ;;
            *)
              sha=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push \
                --status success -L 1 --json headSha --jq '.[0].headSha // empty')
              ;;
          esac
          test -n "$sha" || { echo "::error::no main commit has passed CI"; exit 1; }
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          echo "go=$go" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.green.outputs.sha }}
      - id: plan
        if: steps.green.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || inputs.channel || 'edge' }}
        run: |
          scripts/release/plan.sh "$CHANNEL"
          if [ "$CHANNEL" = stable ] && [ "$GITHUB_EVENT_NAME" = push ] && ! grep -qx "tags=$GITHUB_REF_NAME" "$GITHUB_OUTPUT"; then
            echo "::error::tag $GITHUB_REF_NAME is not v<workspace version> from Cargo.toml"; exit 1
          fi

  build:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cargo-zigbuild
        if: contains(matrix.target, 'linux-musl')
        run: python3 -m pip install cargo-zigbuild==0.24.1
      - name: Build and pack
        env:
          CPL_CHANNEL: ${{ needs.plan.outputs.channel }}
          CPL_COMMIT: ${{ needs.plan.outputs.commit }}
        run: scripts/release/build.sh "${{ matrix.target }}" dist
      - name: Smoke test
        if: matrix.target != 'aarch64-unknown-linux-musl' && matrix.target != 'x86_64-apple-darwin'
        run: |
          mkdir smoke
          case "${{ matrix.target }}" in
            *windows*) unzip -q "dist/cpl-${{ matrix.target }}.zip" -d smoke ;;
            *) tar -xzf "dist/cpl-${{ matrix.target }}.tar.gz" -C smoke ;;
          esac
          smoke/bin/cpl --version | tee version.txt
          grep -F "(${{ needs.plan.outputs.channel }}, $(cut -c1-8 <<<"${{ needs.plan.outputs.commit }}"))" version.txt
          printf 'print("ok")\n' >smoke/hello.cp
          test "$(smoke/bin/cpl run smoke/hello.cp)" = ok
      - uses: actions/upload-artifact@v4
        with:
          name: cpl-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  editors:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: VS Code extension
        working-directory: editors/vscode
        run: |
          npm ci --no-audit --no-fund
          npm run package
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: JetBrains plugin
        working-directory: editors/jetbrains
        run: ./gradlew --no-daemon buildPlugin
      - name: Collect
        run: |
          mkdir -p dist
          cp editors/vscode/cp-lang.vsix dist/cp-lang.vsix
          zips=(editors/jetbrains/build/distributions/*.zip)
          test "${#zips[@]}" -eq 1
          cp "${zips[0]}" dist/cp-lang-jetbrains.zip
          python3 scripts/release/editors.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: editors
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [plan, build, editors]
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          VERSION: ${{ needs.plan.outputs.version }}
          COMMIT: ${{ needs.plan.outputs.commit }}
          DATE: ${{ needs.plan.outputs.date }}
          TOOLCHAIN: ${{ needs.plan.outputs.toolchain }}
          TAGS: ${{ needs.plan.outputs.tags }}
        run: scripts/release/publish.sh dist "$CHANNEL" "$VERSION" "$COMMIT" "$DATE" "$TOOLCHAIN" "$TAGS"

  # The one-line installers on clean runners of all three OSes, against what
  # publish just released: `cpl` installs, runs a program (CRLF too) and builds C++.
  install-smoke:
    needs: [plan, publish]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          sparse-checkout: web/public
      - name: sh install.sh (curl -fsSL https://cp-lang.org/install.sh | sh)
        if: runner.os != 'Windows'
        run: sh web/public/install.sh ${{ needs.plan.outputs.channel == 'edge' && '--edge' || '' }} && echo "$HOME/.cpl/bin" >>"$GITHUB_PATH"
      - name: install.ps1 (irm https://cp-lang.org/install.ps1 | iex)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ([scriptblock]::Create((Get-Content -Raw web/public/install.ps1))) ${{ needs.plan.outputs.channel == 'edge' && '-Edge' || '' }}
          "$HOME\.cpl\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: cpl runs and builds
        shell: bash
        env:
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          cpl --version | tee version.txt
          grep -q "${COMMIT:0:8}" version.txt
          printf 'print(1 + 2)\n' >hello.cp
          test "$(cpl run hello.cp | tr -d '\r')" = 3
          printf 'print(2)\r\nprint(4 * 4)\r\n' >crlf.cp
          test "$(cpl run crlf.cp | tr -d '\r' | tr '\n' ' ')" = '2 16 '
          cpl build hello.cp -o - | grep -q 'int main'
