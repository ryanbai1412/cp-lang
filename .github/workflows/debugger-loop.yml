name: debugger-loop

# The Milestone 1 wrong-answer loop on all three OSes: cpl stress finds and
# saves a small failing case, cpl test reruns it, the fix turns both green
# (crates/cpl-cli/tests/debugger.rs), and the same loop from headless Neovim
# (editors/neovim/test/stress_loop.lua). Small, so it finishes in minutes
# where the full workspace run in os.yml is often cancelled by newer pushes.
on:
  push:
    branches: [main, lane/debugger]
    paths:
      - crates/cpl-stress/**
      - crates/cpl-judge/**
      - crates/cpl-lsp/**
      - crates/cpl-cli/**
      - editors/neovim/**
      - editors/vscode/**
      - editors/jetbrains/**
      - .github/workflows/debugger-loop.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debugger-loop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  loop:
    name: loop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: debugger-loop
      - uses: ./.github/actions/install-tools
        with:
          tools: cargo-nextest@0.9.152
      - name: GCC as g++
        if: runner.os == 'macOS'
        run: |
          gxx=$(printf '%s\n' "$(brew --prefix)"/bin/g++-[0-9]* | sort -V | tail -1)
          mkdir -p ~/gcc-bin && ln -sf "$gxx" ~/gcc-bin/g++ && echo ~/gcc-bin >>"$GITHUB_PATH"
      - name: Compiler versions
        run: (g++ --version || echo "no g++") | head -1 && rustc --version
      - name: Stress loop tests
        run: just debugger-loop
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.6
      - name: Neovim stress loop and time travel
        run: |
          cargo build -p cpl-cli
          just neovim-stress-loop "$RUNNER_TEMP"
      - name: Vim stress loop
        if: runner.os != 'Windows'
        run: just vim-stress-loop

  # The same loop through the VS Code commands (cp.stress, cp.runAllSamples), in the
  # extension-host suite against the real `cpl lsp`; ci.yml's vscode job runs it too.
  vscode:
    name: vscode (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: neovim
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build cpl
        run: cargo build -p cpl-cli
      - name: Extension integration tests
        shell: bash
        working-directory: editors/vscode
        run: just vscode-integration

  # The run configurations' stress then test, on each OS's own JDK and paths.
  jetbrains:
    name: jetbrains (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: neovim
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build cpl
        run: cargo build -p cpl-cli
      - name: Plugin smoke tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then CPL=$(cygpath -w "$GITHUB_WORKSPACE/target/debug/cpl.exe"); export CPL; fi
          just jetbrains-fetch && just jetbrains-gradle test --tests dev.cplang.ide.CpPluginSmokeTest
