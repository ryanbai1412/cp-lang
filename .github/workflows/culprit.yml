name: culprit
# When a main CI run fails, name each red job's range (the commits since that
# job last passed on main, with their lanes), bisect each failing nextest test
# over the commits since the last green main run (or, while no run is green,
# since every red job last passed), name the culprit commit and its lane, and
# push a revert that makes the tests pass to culprit/revert-<sha>. The
# infra sheriff lands that revert or a fix forward. See scripts/culprit.py.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: read
  statuses: write
jobs:
  find:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'push'
    # On the job, not the workflow: a pending workflow-level run was replaced by
    # the next cancelled CI run's (skipped) trigger, dropping a real red.
    concurrency:
      group: culprit
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # A red that lasts hours spans 1000+ commits; past 30 min the sheriff's
    # own root-cause finding has long beaten the bisect.
    timeout-minutes: 30
    env:
      TARGET_KEY: target-ci-v2
      BAD: ${{ github.event.workflow_run.head_sha }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Failing tests and the last green main commit
        id: range
        run: |
          good=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push \
              --status success --limit 1 --json headSha --jq '.[0].headSha')
          echo "good=$good" >>"$GITHUB_OUTPUT"
          . scripts/retry.sh
          # Job by job: `gh run view --log-failed` gives up on a run with many red
          # jobs ("too many API requests needed to fetch logs"), which left run
          # 45428862352's 41 red jobs unbisected.
          : >failed.log
          for job in $(retry gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
              --jq '.jobs[] | select(.conclusion == "failure") | .id'); do
              # Not `gh api`: it refuses a body with terminal escapes, and every
              # job log has them, so the finder read 0 FAIL lines.
              retry curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                  "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/jobs/$job/logs" >>failed.log ||
                  echo "no log for job $job"
          done
          n=$(grep -cE '\b(FAIL|TIMEOUT|SIG[A-Z]+) +\[' failed.log || [ $? = 1 ])
          echo "fails=$n" >>"$GITHUB_OUTPUT"
          echo "good $good, bad $BAD, $n FAIL lines"
      - uses: ./.github/actions/setup-rust
        if: steps.range.outputs.fails != '0'
        with:
          target: dev
          save-if: false
      - uses: ./.github/actions/install-tools
        if: steps.range.outputs.fails != '0'
        with:
          tools: cargo-nextest@0.9.152
      - name: Name each red job's range and bisect
        # Below the job's 30: the summary and statuses still post what it found.
        timeout-minutes: 25
        run: |
          git config user.name "cpl culprit"
          git config user.email "culprit@users.noreply.github.com"
          mv failed.log "$RUNNER_TEMP/failed.log"
          good=${{ steps.range.outputs.good }}
          uv run --quiet python scripts/culprit.py --in-place --push-reverts ${good:+--good "$good"} --run "$RUN_ID" \
              --bad "$BAD" --from-log "$RUNNER_TEMP/failed.log" --json "$RUNNER_TEMP/culprit.json" \
              | tee "$RUNNER_TEMP/culprit.txt"
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          [ -s "$RUNNER_TEMP/culprit.json" ] || exit 0
          { echo '```'; uv run --quiet python scripts/culprit.py --summary "$RUNNER_TEMP/culprit.json"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      - name: Mark each culprit commit
        if: ${{ !cancelled() }}
        run: |
          [ -s "$RUNNER_TEMP/culprit.json" ] || exit 0
          uv run --quiet python scripts/commit_status.py --run "$RUN_ID" --culprits "$RUNNER_TEMP/culprit.json" \
              --url "${{ github.event.workflow_run.html_url }}"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: culprit
          path: ${{ runner.temp }}/culprit.*
