name: ci-slow

# Slow budgets and reports, kept out of ci.yml so a run there isn't held
# open (and main's one-waiting-run queue blocked) by slow jobs.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  # Restores the dev target/ that ci.yml saves.
  TARGET_KEY: target-ci-v2

concurrency:
  group: ci-slow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Main's own debt: red until every gated counter is 0. ci.yml's ratchet
  # inherits main's counts so a tip fails only on debt it adds.
  debt-zero:
    name: every debt counter at 0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Debt counters at 0
        run: uv run --quiet python scripts/debt-ratchet.py --zero

  # Timing budgets report here and never turn main red (decision 225).
  timing:
    name: wall-clock budgets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          target: dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Wall-clock budgets
        run: scripts/check.sh --timing

  # Coverage of each crate by its own tests and by all (handbook/process/quality.md#how-suites-are-measured).
  coverage:
    name: coverage matrix
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: ./.github/actions/setup-rust
        with:
          add: component add llvm-tools-preview
          shared-key: coverage
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - name: Coverage matrix
        run: uv run --quiet python scripts/coverage-matrix.py -o target/coverage | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-matrix
          path: target/coverage/

  # Mutation score: one-line compiler mutants against the conformance suite
  # (handbook/guidelines/conformance-checklist.md, conformance/R9).
  mutants:
    name: mutation score
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: mutants
      - name: Mutation score
        run: uv run --quiet python scripts/spec-gate.py mutants --n 12 --seed ${{ github.run_number }} --work target/mutants --out target/mutants.md && tee -a "$GITHUB_STEP_SUMMARY" < target/mutants.md
      - uses: actions/upload-artifact@v4
        with:
          name: mutation-score
          path: target/mutants.md

  # The editor's latency budgets on each OS, in the optimized build people
  # run. Its own job, so its release build doesn't lengthen the cli job.
  lsp-latency:
    name: lsp latency (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: lsp-latency
      - name: LSP latency (release)
        run: cargo test --release -p cpl-lsp --test latency -- --nocapture
      - name: Cold start of every command (release)
        run: cargo test --release -p cpl-cli --test cold_start -- --nocapture
