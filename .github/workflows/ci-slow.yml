name: ci-slow

# Slow budgets and reports, kept out of ci.yml so a run there isn't held
# open (and main's one-waiting-run queue blocked) by slow jobs.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  # Restores the dev target/ that ci.yml saves.
  TARGET_KEY: target-ci-v2

concurrency:
  group: ci-slow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Main's own debt: red until every gated counter is 0. ci.yml's ratchet
  # inherits main's counts so a tip fails only on debt it adds.
  debt-zero:
    name: every debt counter at 0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: ./.github/actions/install-tools
        with:
          tools: just@1.59.0
      - name: Debt counters at 0
        run: just debt-ratchet --zero

  # Timing budgets report here and never turn main red (decision 225).
  timing:
    name: wall-clock budgets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: ./.github/actions/setup-rust
        with:
          target: dev
      - uses: ./.github/actions/install-tools
        with:
          tools: cargo-nextest@0.9.152
      - name: Wall-clock budgets
        run: just check-timing

  # The --full suites: fuzzers, metamorphic, flakes, speed, every judge's
  # flags, case-bugs (scripts/ci.py STEPS["full"]); no other job runs them.
  full:
    name: the --full suites
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: ./.github/actions/setup-rust
        with:
          target: dev
      - name: The --full suites
        env:
          CPL_GATE_PART: full
        run: just check-full

  # Every dream.cp still agrees with its accepted C++ on this tip
  # (problem-packages/R10): a std or compiler change can break a dream whose
  # file didn't change, and the corpus gate's static modes can't see that.
  # Reports here until the dreams are green, then moves to ci.yml.
  dreams:
    name: every dream agrees with its C++ (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: ./.github/actions/setup-rust
        with:
          target: release
      - name: Build cpl
        run: cargo build --profile ci --bin cpl
      - name: Cache hour
        id: hour
        run: echo "hour=$(date -u +%Y%m%d%H)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: target/corpus-tests
          key: corpus-tests-${{ steps.hour.outputs.hour }}
          restore-keys: corpus-tests-
      - name: Dreams agree with the accepted C++
        run: |
          mapfile -t ids < <(printf '%s\n' corpus/problems/*/dream.cp | cut -d/ -f3 |
            awk -v s=${{ matrix.shard }} '(++n - 1) % 2 == s - 1')
          just corpus-tests-make --cpl target/ci/cpl "${ids[@]}" >/dev/null
          just corpus-verify --only dream --cpl target/ci/cpl -j "$(nproc)" "${ids[@]}"

  # Coverage of each crate by its own tests and by all (handbook/process/quality.md#how-suites-are-measured).
  coverage:
    name: coverage matrix
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: ./.github/actions/setup-rust
        with:
          add: component add llvm-tools-preview
          shared-key: coverage
      - uses: ./.github/actions/install-tools
        with:
          tools: cargo-nextest@0.9.152 cargo-llvm-cov@0.9.2
      - name: Coverage matrix
        run: just coverage-matrix -o target/coverage | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-matrix
          path: target/coverage/

  # Mutation score: one-line compiler mutants against the conformance suite
  # (handbook/guidelines/conformance-checklist.md, conformance/R9).
  mutants:
    name: mutation score
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: mutants
      - name: Mutation score
        run: just spec-gate mutants --n 12 --seed ${{ github.run_number }} --work target/mutants --out target/mutants.md && tee -a "$GITHUB_STEP_SUMMARY" < target/mutants.md
      - uses: actions/upload-artifact@v4
        with:
          name: mutation-score
          path: target/mutants.md

  # The debugger suites catch real debugger bugs: every viable mutant of
  # the DAP adapter must fail tests/dap.rs (handbook/domains/debugger.md).
  dap-mutants:
    name: dap mutation score
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: mutants
      - uses: ./.github/actions/install-tools
        with:
          tools: cargo-mutants@27.1.0
      - name: DAP mutation score
        run: just mutation-score -p cpl-cli -f crates/cpl-cli/src/dap.rs --test dap --min 1.0 -o target/dap-mutants | tee -a "$GITHUB_STEP_SUMMARY"

  # No undefined behaviour in emitted std code: every std conformance case
  # and std doc example, as C++ under ASan, UBSan and _GLIBCXX_DEBUG, runs
  # without a report (handbook/domains/stdlib.md).
  std-sanitize:
    name: std under sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          target: release
      - name: Std conformance and doc examples under ASan and UBSan
        run: just std-sanitize

  # The editor's latency budgets on each OS, in the optimized build people
  # run. Its own job, so its release build doesn't lengthen the cli job.
  lsp-latency:
    name: lsp latency (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: lsp-latency
      - name: LSP latency (release)
        run: just lsp-latency
      - name: Cold start of every command (release)
        run: just cold-start
