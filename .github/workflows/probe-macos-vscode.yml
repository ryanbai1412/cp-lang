name: probe macos vscode fresh home
on:
  push:
    branches: ['probe/**']
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [fresh, keychains]
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: neovim
          save-if: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: cargo build -p cpl-cli
      - name: Patch runTest
        working-directory: editors/vscode
        run: |
          perl -0pi -e "s/if \(process.platform === 'darwin'\) \{/if (false) {/" test/integration/runTest.ts
          if [ "${{ matrix.variant }}" = keychains ]; then
            perl -0pi -e "s|(fs.chmodSync\(installed, 0o755\);)|\$1\n        fs.mkdirSync(path.join(home, 'Library'), { recursive: true });\n        fs.symlinkSync(path.join(os.homedir(), 'Library', 'Keychains'), path.join(home, 'Library', 'Keychains'));|" test/integration/runTest.ts
          fi
          grep -n "if (false)\|Keychains" test/integration/runTest.ts
      - name: Run and watch
        shell: bash
        working-directory: editors/vscode
        run: |
          npm ci --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/probe"
          (npm run test:integration > "$RUNNER_TEMP/probe/out.log" 2>&1; echo "exit $?" >> "$RUNNER_TEMP/probe/out.log") &
          pid=$!
          for t in 60 120 180 240; do
            sleep 60
            kill -0 $pid 2>/dev/null || break
            screencapture -x "$RUNNER_TEMP/probe/shot-$t.png" || true
            ps -axo pid,ppid,etime,command | grep -iE "code|electron|cpl|security|keychain" | grep -v grep > "$RUNNER_TEMP/probe/ps-$t.txt" || true
          done
          if kill -0 $pid 2>/dev/null; then
            for p in $(pgrep -f "Electron|Code Helper" | head -4); do sample $p 3 -file "$RUNNER_TEMP/probe/sample-$p.txt" >/dev/null 2>&1 || true; done
            log show --last 5m --predicate 'process CONTAINS "Electron" OR process CONTAINS "Code"' --style compact > "$RUNNER_TEMP/probe/os.log" 2>/dev/null || true
            pkill -f "Electron" || true
          fi
          wait $pid || true
          find "$RUNNER_TEMP"/cp-vscode-* -name "*.log" -path "*logs*" -exec cp {} "$RUNNER_TEMP/probe/" \; 2>/dev/null || true
          find /var/folders "$TMPDIR" -path "*cp-vscode-*" -name "*.log" 2>/dev/null | head -40 | while read f; do cp "$f" "$RUNNER_TEMP/probe/$(echo "$f" | tr / _ | tail -c 120)"; done || true
          tail -40 "$RUNNER_TEMP/probe/out.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.variant }}
          path: ${{ runner.temp }}/probe

  self-update:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install edge into a fresh home, then self update
        run: |
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
          sh web/public/install.sh
          cpl="$HOME/.cpl/bin/cpl"
          "$cpl" --version
          "$cpl" self update
          "$cpl" self update edge
          "$cpl" --version
