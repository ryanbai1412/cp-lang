name: revert on red

# The backstop for scripts/land.sh's narrowed gate: when CI on a main tip
# fails right after a green tip, open a pull request that reverts the commits
# between them, so the fix-or-revert call is one click. Never pushes to main.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  revert:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Open a revert of the commits since the last green tip
        env:
          GH_TOKEN: ${{ github.token }}
          BAD: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: scripts/revert-on-red.sh
