name: unstick
# Force-cancels a main CI run GitHub left in "Complete job" after all its
# work ended, which a plain cancel does not end (scripts/ci_unstick.py).
# Every push to main wakes it, since the cron alone runs late. A started
# check finishes; pushes during it collapse into one waiting check.
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  statuses: write
concurrency:
  group: unstick
  cancel-in-progress: false
jobs:
  unstick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: astral-sh/setup-uv@v6
      - name: Force-cancel a hung main run
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --quiet python scripts/ci_unstick.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Delete superseded caches
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --quiet python scripts/ci_cache_prune.py | tee -a "$GITHUB_STEP_SUMMARY"
