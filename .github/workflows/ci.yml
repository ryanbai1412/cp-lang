name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every Rust job restores the newest target/ its group saved on main (dev:
# tests, conform, timing; clippy: checks; release: site), and
# scripts/ci-mtime.sh re-stamps only the files changed since, so cargo
# rebuilds only the crates and test binaries whose inputs changed.
env:
  CARGO_INCREMENTAL: "0"
  TARGET_KEY: target-${{ github.workflow }}-v1

# On main a started run always finishes, and at most one more waits: a newer
# push replaces the waiting run, so CI checks the newest tip next instead of
# queueing every commit; the infra sheriff bisects a red run's range. A newer
# push to a pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # --fast split into parallel jobs (CPL_GATE_PART in scripts/check.sh): the
  # checks, the conformance ratchet in three suite shards, and the workspace
  # tests in six nextest partitions.
  gate:
    name: gate (${{ matrix.part }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [checks, "conform:conformance+spec-blocks", "conform:diff", "conform:corpus+docs", "tests:hash:1/6", "tests:hash:2/6", "tests:hash:3/6", "tests:hash:4/6", "tests:hash:5/6", "tests:hash:6/6"]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Restore target/ (${{ matrix.part == 'checks' && 'clippy' || 'dev' }})
        uses: actions/cache/restore@v4
        with:
          path: target
          key: ${{ env.TARGET_KEY }}-${{ matrix.part == 'checks' && 'clippy' || 'dev' }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.TARGET_KEY }}-${{ matrix.part == 'checks' && 'clippy' || 'dev' }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            ${{ env.TARGET_KEY }}-${{ matrix.part == 'checks' && 'clippy' || 'dev' }}-
      - name: Reuse unchanged build outputs
        run: scripts/ci-mtime.sh
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The gate runs the skill check and scripts/affected.py through uv.
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Compiler versions
        run: g++ --version | head -1 && rustc --version
      # scripts/cxx-cache.py keys binaries on source, flags, compiler and
      # system headers; a cold cache costs the conform part about 6 min of g++.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/cpl/cxx
          key: cxx-${{ runner.os }}-${{ matrix.part }}-${{ github.run_id }}
          restore-keys: |
            cxx-${{ runner.os }}-${{ matrix.part }}-
            cxx-${{ runner.os }}-
      - name: Fast gate
        env:
          CPL_GATE_PART: ${{ matrix.part }}
          CPL_DERIVED_HEALED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '' }}
        run: scripts/check.sh --fast
      - name: Save target/ (${{ matrix.part == 'checks' && 'clippy' || 'dev' }})
        id: stamp
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (matrix.part == 'checks' || matrix.part == 'tests:hash:6/6') }}
        # A job that failed before building leaves target/ near empty; saving it would replace the warm cache.
        # Cargo 1.100 keeps no target/<profile>/deps, so look for build/.
        run: |
          [ -n "$(ls target/*/build 2>/dev/null | head -1)" ] || { echo "target/ has no build; not saving"; exit 0; }
          git rev-parse HEAD > target/.ci-sha && rm -rf target/check-cache target/tmp target/judge-probes
          echo built=true >>"$GITHUB_OUTPUT"
      - uses: actions/cache/save@v4
        if: ${{ steps.stamp.outputs.built == 'true' && (matrix.part == 'checks' || matrix.part == 'tests:hash:6/6') }}
        with:
          path: target
          key: ${{ env.TARGET_KEY }}-${{ matrix.part == 'checks' && 'clippy' || 'dev' }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}

  # The Milestone 1 editor: `cpl setup neovim`, then diagnostics, completion,
  # `gd` and format on write in headless Neovim (editors/neovim/test/smoke.lua).
  # Windows is informational until it has passed once.
  neovim:
    name: neovim (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: neovim
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.11.5
      - name: Build cpl
        run: cargo build -p cpl-cli
      - name: Neovim smoke
        shell: bash
        run: nvim --headless --clean -l editors/neovim/test/smoke.lua "$PWD/target/debug/cpl" "$PWD"
      - name: Neovim 0.12 smoke (no deprecated API)
        if: matrix.os == 'ubuntu-latest'
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.6
      - if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: nvim --version | head -1 && nvim --headless --clean -l editors/neovim/test/smoke.lua "$PWD/target/debug/cpl" "$PWD"
      - name: Vim smoke
        if: matrix.os == 'ubuntu-latest'
        run: bash editors/neovim/test/smoke_vim.sh "$PWD/target/debug/cpl"

  # VS Code: the unit tests, then the extension host against the real `cpl lsp`
  # (diagnostics, definition, completion, formatting); editors/vscode/test/integration.
  vscode:
    name: vscode (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: neovim
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build cpl
        run: cargo build -p cpl-cli
      - name: Extension tests
        shell: bash
        working-directory: editors/vscode
        run: |
          npm ci --no-audit --no-fund
          npm test
          if command -v xvfb-run >/dev/null; then xvfb-run -a npm run test:integration; else npm run test:integration; fi

  # The contest CLI on macOS and Windows (Linux runs it in the gate): paths,
  # the clipboard command, CRLF input, `cpl setup`, the contest flow.
  cli:
    name: cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: neovim
      # bash, so the first failing command fails the step: Windows' default
      # PowerShell reports only the last command's status.
      - name: CLI tests
        shell: bash
        run: |
          cargo test -p cpl-cli --lib --test golden --test cli
          cargo test -p cpl-contest

  # The editor's latency budgets on each OS, in the optimized build people
  # run. Its own job, so its release build doesn't lengthen the cli job.
  # Not blocking until a few runs show the hosted runners meet them.
  lsp-latency:
    name: lsp latency (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lsp-latency
      - name: LSP latency (release)
        run: cargo test --release -p cpl-lsp --test latency -- --nocapture

  # JetBrains: the plugin builds, and its tests run in a headless IDE against
  # the real `cpl` (file type, highlighting, the LSP server, run configurations).
  jetbrains:
    name: jetbrains (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    # Milestone 1 requires JetBrains, so it blocks main. Gradle is not cached:
    # with three IDEs its home is 8+ GB of the repo's 10 GB and evicted the
    # Rust target/ caches; cold runs resolve through the Maven mirror and back
    # off on a 429. The plugin's Gradle build and tests run only when the
    # plugin, its build inputs or `cpl lsp` changed since main's last green
    # run; every OS still runs the handshake against its own cpl.
    steps:
      - uses: actions/checkout@v4
      - name: Does this change touch the plugin?
        id: plugin
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          build=true
          case $EVENT in
            pull_request) base=$PR_BASE ;;
            push) base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha' 2>/dev/null || true) ;;
            *) base= ;;
          esac
          if [ -n "$base" ] && files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$base...$GITHUB_SHA" --jq '.files[].filename' 2>/dev/null) \
            && [ "$(printf '%s\n' "$files" | wc -l)" -lt 300 ] \
            && ! printf '%s\n' "$files" | grep -qE '^(editors/jetbrains/|crates/cpl-lsp/|scripts/gradle-mirror|\.github/workflows/ci\.yml)'; then
            build=false
          fi
          echo "plugin build since ${base:-(none)}: $build"
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: neovim
      - uses: actions/setup-java@v4
        if: steps.plugin.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - name: Build cpl
        run: cargo build -p cpl-cli
      - name: Plugin build and tests
        if: steps.plugin.outputs.build == 'true'
        working-directory: editors/jetbrains
        shell: bash
        run: |
          for wait in 0 30 90 180; do
            sleep "$wait"
            ./gradlew --no-daemon --init-script ../../scripts/gradle-mirror.init.gradle buildPlugin test && exit 0
          done
          exit 1
      - name: Free IntelliJ IDEA gets a diagnostic and a completion through LSP4IJ
        if: runner.os == 'Linux' && steps.plugin.outputs.build == 'true'
        working-directory: editors/jetbrains
        shell: bash
        run: |
          for wait in 0 30 90 180; do
            sleep "$wait"
            ./gradlew --no-daemon --init-script ../../scripts/gradle-mirror.init.gradle test -PfreeIde --tests dev.cplang.ide.CpLsp4ijTest && exit 0
          done
          exit 1
      - name: Plugin verifies against IntelliJ IDEA Community and Ultimate
        if: runner.os == 'Linux' && steps.plugin.outputs.build == 'true'
        working-directory: editors/jetbrains
        shell: bash
        run: ./gradlew --no-daemon --init-script ../../scripts/gradle-mirror.init.gradle verifyPlugin
      - name: The server handshake the plugin starts
        run: python3 editors/lsp-smoke.py jetbrains target/debug/cpl lsp

  # The other editor setups (Emacs, Helix, Zed) and the tree-sitter grammar they
  # share, each against the real `cpl lsp` with the request matrix tier 1 runs.
  editors:
    name: editors (emacs, helix, zed, tree-sitter)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install && rustup target add wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: neovim
      - name: Build cpl
        run: cargo build -p cpl-cli
      - name: Install Emacs, Helix and the tree-sitter CLI
        run: |
          sudo apt-get install -y -q emacs-nox >/dev/null
          curl -sSfL https://github.com/helix-editor/helix/releases/download/25.07.1/helix-25.07.1-x86_64-linux.tar.xz | tar xJ -C "$RUNNER_TEMP"
          echo "HX=$RUNNER_TEMP/helix-25.07.1-x86_64-linux/hx" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/ts" --no-audit --no-fund tree-sitter-cli@0.25.10 >/dev/null
          echo "TREE_SITTER=$RUNNER_TEMP/ts/node_modules/.bin/tree-sitter" >> "$GITHUB_ENV"
      - name: Emacs smoke
        run: |
          CPL="$PWD/target/debug/cpl" emacs --batch -Q -l editors/emacs/smoke.el
          python3 editors/lsp-smoke.py emacs "$PWD/target/debug/cpl" lsp
      - name: Helix smoke
        run: editors/helix/smoke.sh "$PWD/target/debug/cpl"
      - name: Zed smoke
        run: editors/zed/smoke.sh "$PWD/target/debug/cpl"
      - name: Tree-sitter grammar
        run: editors/tree-sitter-cp/smoke.sh

  # A main push with stale generated files (skill pages, COVERAGE.md, fixed
  # prelude gaps) or a machine-fixable clippy lint gets them regenerated and committed here, under the pushed
  # commit's Domain trailer, then CI is dispatched on the new tip: a push by
  # the Actions token starts no run by itself.
  regen:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      # skill-gen checks every skill example with cpl.
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: neovim
          save-if: false
      - name: Build cpl
        run: cargo build -q -p cpl-cli
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Regenerate and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changed=$(scripts/regen.sh 2> >(tee regen.err >&2))
          # Machine-applicable clippy fixes land here too, so a lint slipped
          # past a `--no-verify` push heals without a lane's time. Best effort:
          # a clippy that can't run leaves the gate to report it.
          CARGO_TARGET_DIR=target/clippy-fix cargo clippy -q --fix --allow-dirty --workspace --all-targets || true
          # Format every crate clippy touched or a `--no-verify` push left
          # unformatted, crate by crate (lanes never run `cargo fmt --all`).
          crates=$( { git diff --name-only -- crates; cargo fmt --all --check -- -l 2>/dev/null | sed "s|^$PWD/||"; } | cut -d/ -f2 | sort -u)
          for c in $crates; do cargo fmt -p "$c" || true; done
          changed="$changed$(git diff --name-only -- crates)"
          # The gate only warns on stale generated files on main, so a
          # generator that fails must turn this job red.
          failed() { ! grep -q 'regen: failed' regen.err || { echo "::error::a generator failed; see above"; exit 1; }; }
          [ -n "$changed" ] || { echo "generated files are current"; failed; exit 0; }
          echo "$changed"
          domain=$(git log -1 --format='%(trailers:key=Domain,valueonly,separator=)' HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- skills spec/conformance pnpm-lock.yaml crates
          git commit -q -m "factory: regenerate generated files" -m "Domain: ${domain:-infra}"
          for try in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && break
            sleep 5
          done
          gh workflow run ci.yml --ref main
          failed

  # Alerts when the rolling edge release can't be installed from; it reports
  # an outage and never turns main red.
  edge:
    name: edge installable (not blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: edge/latest.json and its archives download
        env:
          REPO: ${{ github.repository }}
        run: |
          base="https://github.com/$REPO/releases/download/edge"
          curl -fsSL --retry 3 "$base/latest.json" -o latest.json
          curl -fsSL --retry 3 "$base/SHA256SUMS" -o SHA256SUMS
          for a in $(awk '{print $2}' SHA256SUMS); do curl -fsIL --retry 3 -o /dev/null "$base/$a" || { echo "::error::edge is missing $a"; exit 1; }; done
          echo "edge: $(jq -r .toolchain latest.json), $(wc -l <SHA256SUMS) archives"

  # Timing budgets report here and never turn main red (decision 225).
  timing:
    name: wall-clock budgets (not blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Restore target/ (dev)
        uses: actions/cache/restore@v4
        with:
          path: target
          key: ${{ env.TARGET_KEY }}-dev-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.TARGET_KEY }}-dev-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            ${{ env.TARGET_KEY }}-dev-
      - name: Reuse unchanged build outputs
        run: scripts/ci-mtime.sh
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Wall-clock budgets
        run: scripts/check.sh --timing

  # Milestone 1 acceptance: rejudge every committed acceptance-run solution
  # (research/acceptance/solutions/) with the release cpl and the
  # Codeforces profile; any non-AC blocks. Split over 3 runners, parallel on
  # each one's 4 cores, restoring the release target/ the site job saves.
  acceptance:
    name: acceptance solutions stay AC (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Restore target/ (release)
        uses: actions/cache/restore@v4
        with:
          path: target
          key: ${{ env.TARGET_KEY }}-release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.TARGET_KEY }}-release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            ${{ env.TARGET_KEY }}-release-
      - name: Reuse unchanged build outputs
        run: scripts/ci-mtime.sh
      - name: Build cpl
        run: cargo build --profile ci --bin cpl
      - name: Rejudge the acceptance solutions
        run: python3 research/acceptance/regress.py target/ci/cpl -j "$(nproc)" --shard ${{ matrix.shard }}/3

  site:
    name: site build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Restore target/ (release)
        uses: actions/cache/restore@v4
        with:
          path: target
          key: ${{ env.TARGET_KEY }}-release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.TARGET_KEY }}-release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            ${{ env.TARGET_KEY }}-release-
      - name: Reuse unchanged build outputs
        run: scripts/ci-mtime.sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/cache@v4
        with:
          path: web/.next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: next-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build cpl
        run: cargo build --profile ci --bin cpl
      # The build generates content/generated/ (from cpl), which typecheck reads.
      - name: Build
        env:
          CPL: ${{ github.workspace }}/target/ci/cpl
        run: pnpm --filter cp-lang-web build
      - name: Typecheck
        run: pnpm --filter cp-lang-web typecheck
      - name: Unit tests
        run: pnpm --filter cp-lang-web test
      - name: Installers are served
        run: test -s web/out/install.sh && test -s web/out/install.ps1
      - name: Save target/ (release)
        id: stamp
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        # A job that failed before building leaves target/ near empty; saving it would replace the warm cache.
        # Cargo 1.100 keeps no target/<profile>/deps, so look for build/.
        run: |
          [ -n "$(ls target/*/build 2>/dev/null | head -1)" ] || { echo "target/ has no build; not saving"; exit 0; }
          git rev-parse HEAD > target/.ci-sha && rm -rf target/check-cache target/tmp target/judge-probes
          echo built=true >>"$GITHUB_OUTPUT"
      - uses: actions/cache/save@v4
        if: ${{ steps.stamp.outputs.built == 'true' }}
        with:
          path: target
          key: ${{ env.TARGET_KEY }}-release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}
