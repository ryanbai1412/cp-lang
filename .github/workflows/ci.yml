name: ci
on:
  push:
    branches: ["devin/*-win-checker-debug"]

permissions:
  contents: read

jobs:
  win-checker-debug:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: neovim
      - name: Pythons
        shell: bash
        run: |
          which -a python py python3 || true
          py -3 --version || true
          python --version || true
      - name: The checker test
        timeout-minutes: 15
        shell: bash
        run: cargo test -p cpl-contest a_problems_checker_py -- --nocapture --test-threads=1
