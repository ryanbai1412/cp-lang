name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# On main a started run always finishes, and at most one more waits: a newer
# push replaces the waiting run, so CI checks the newest tip next instead of
# queueing every commit (revert-on-red bisects the range since the last green
# tip). A newer push to a pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gate:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The gate runs the skill check and scripts/affected.py through uv.
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Compiler versions
        run: g++ --version | head -1 && rustc --version
      - name: Fast gate
        run: scripts/check.sh --fast

  # Timing budgets report here and never turn main red (decision 225).
  timing:
    name: wall-clock budgets (not blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Wall-clock budgets
        run: scripts/check.sh --timing

  site:
    name: site build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build cpl
        run: cargo build --release --bin cpl
      # The build generates content/generated/ (from cpl), which typecheck reads.
      - name: Build
        run: pnpm --filter cp-lang-web build
      - name: Typecheck
        run: pnpm --filter cp-lang-web typecheck
      - name: Unit tests
        run: pnpm --filter cp-lang-web test
      - name: Installers are served
        run: test -s web/out/install.sh && test -s web/out/install.ps1
