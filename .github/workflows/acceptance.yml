name: acceptance
# Milestone 1 acceptance run, CLI half (research/acceptance/PROTOCOL.md): install CP Lang
# the way cp-lang.org says on Linux, macOS and Windows, then follow the getting-started
# guide. Each OS uploads ci-<os>.json, which idioms folds into the run's JSON.
on:
  schedule:
    - cron: "40 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/acceptance.yml", "research/acceptance/ci-steps.sh", "editors/lsp-smoke.py"]
permissions:
  contents: read
jobs:
  install-cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/acceptance
            editors/lsp-smoke.py
          sparse-checkout-cone-mode: false
      - name: Install from the site
        if: runner.os != 'Windows'
        run: curl -fsSL https://cp-lang.org/install.sh | sh -s -- --edge
      - name: Install from the site (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& ([scriptblock]::Create((irm https://cp-lang.org/install.ps1))) -Edge'
      - name: Put the installer's bin folder on PATH for later steps
        shell: bash
        run: echo "$HOME/.cpl/bin" >> "$GITHUB_PATH"
      - name: Follow getting-started
        shell: bash
        run: research/acceptance/ci-steps.sh "${{ runner.os }}" | tee "ci-${{ runner.os }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ runner.os }}
          path: ci-${{ runner.os }}.json
