name: install-tools
description: >
  The one way CI installs a tool: each pinned `name@version` is restored from
  actions/cache, keyed on the OS, arch and versions, so a hit makes no network
  call. Only a miss downloads each tool's prebuilt release through
  scripts/install-tools.sh (retry.sh), and saves it at once, so a job that
  fails later still leaves the cache for the next run. debt-ratchet's
  uncached_installs counts any install outside this action.
inputs:
  tools:
    description: "Space-separated name@version, each with a release recipe in scripts/install-tools.sh"
    required: true
runs:
  using: composite
  steps:
    - id: cache
      uses: actions/cache/restore@v4
      with:
        path: ~/.cpl-tools
        key: cpl-tools-${{ runner.os }}-${{ runner.arch }}-${{ inputs.tools }}
    - name: Install ${{ inputs.tools }} (cache miss)
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
      run: |
        # shellcheck disable=SC2086 # TOOLS is a space-separated list
        "$GITHUB_ACTION_PATH/../../../scripts/install-tools.sh" ~/.cpl-tools $TOOLS
        # A miss downloads releases; over 60 s means a tool fell back to a build
        # or its host is slow. Timing budgets warn, never fail (decision 225).
        if [ "$SECONDS" -gt 60 ]; then
          echo "::warning::install-tools: cold install of $TOOLS took ${SECONDS}s, over its 60 s budget"
        fi
    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.cpl-tools
        key: ${{ steps.cache.outputs.cache-primary-key }}
    - name: Put the tools on PATH
      shell: bash
      run: |
        dir=$HOME/.cpl-tools/bin
        if [ "$RUNNER_OS" = Windows ]; then dir=$(cygpath -w "$dir"); fi
        echo "$dir" >> "$GITHUB_PATH"
