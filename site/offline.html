<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>CP Lang · Offline documentation</title>
  <style>
    html,body{margin:0;height:100%;background:#fff}
    iframe{border:0;display:block;width:100%;height:100dvh}
    @media(prefers-color-scheme:dark){html,body{background:#09090b}}
  </style>
</head>
<body>
<iframe id="workspace" title="CP Lang documentation, playground, and trace debugger"></iframe>
<noscript>Enable JavaScript to open this offline edition. No network access is required.</noscript>
<script id="offline-data" type="application/json">{{payload}}</script>
<script>
(async () => {
  "use strict";
  const data = JSON.parse(document.getElementById("offline-data").textContent);
  const frame = document.getElementById("workspace");
  // Keep the compressed WASM, compiled module and worker once in this window.
  const compiler = document.createElement("script");
  compiler.textContent = data.compiler;
  document.head.append(compiler);
  // The pages, assets and search index arrive as gzip+base64 blobs (site/bundle.py).
  async function unpackBlob(b64) {
    const packed = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const unpacked = new Blob([packed]).stream().pipeThrough(new DecompressionStream("gzip"));
    return JSON.parse(await new Response(unpacked).text());
  }
  Object.assign(data, await unpackBlob(data.docs));
  const galleryNames = new Set(["ports.html", "exemplars.html"]);
  let galleryShares = [];
  let galleryLoaded = !data.gallery;
  async function ensureGallery() {
    if (galleryLoaded) return;
    const gallery = await unpackBlob(data.gallery);
    Object.assign(data.pages, gallery.pages || {});
    galleryShares = gallery.shares || [];
    galleryLoaded = true;
  }
  function hasPage(name) {
    return Object.hasOwn(data.pages, name) || galleryNames.has(name);
  }
  const parser = new DOMParser();
  const index = JSON.parse(data.search);
  for (const entry of index) {
    const article = parser.parseFromString(data.pages[entry.url] || "", "text/html").querySelector("article");
    article?.querySelectorAll("details.exercise-sandbox, noscript").forEach(e => e.remove());
    entry.text = (article?.textContent || "").replace(/\s+/g, " ");
  }
  data.search = JSON.stringify(index);
  const encoder = new TextEncoder();
  function shareHash(text) {
    let bin = "";
    for (const byte of encoder.encode(text)) bin += String.fromCharCode(byte);
    return "#share=" + btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  let activePage;
  function script(source) {
    // Escape closing tags even if future example strings contain HTML.
    return "<script>" + source.replace(/<\/script/gi, "<\\/script") + "<" + "/script>";
  }
  function route() {
    const parts = location.hash.slice(1).split("#");
    const name = hasPage(parts[0]) ? parts[0] : "index.html";
    return {name, anchor:parts.slice(1).join("#")};
  }
  function scrollToAnchor() {
    const doc = frame.contentDocument, {anchor} = route();
    let id;
    try { id = decodeURIComponent(anchor); } catch (_) { return; }
    if (id) doc.getElementById(id)?.scrollIntoView();
    else frame.contentWindow.scrollTo(0, 0);
  }
  frame.addEventListener("load", () => {
    const doc = frame.contentDocument;
    document.title = doc.title + " · Offline";
    doc.addEventListener("click", event => {
      const link = event.target.closest("a[href]");
      if (!link || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey || link.download) return;
      const href = link.getAttribute("href");
      if (/^https?:/.test(href)) {
        link.target = "_blank"; link.rel = "noopener";
        return;
      }
      const [path, anchor] = href.split("#");
      const name = path ? path.split("/").pop() : activePage;
      if (!hasPage(name)) return;
      event.preventDefault();
      doc.querySelector("dialog[open]")?.close();
      const next = name + (anchor ? "#" + anchor : "");
      if (location.hash.slice(1) === next) scrollToAnchor();
      else location.hash = next;
    });
    scrollToAnchor();
    frame.contentWindow.focus();
  });
  async function render() {
    const {name} = route();
    if (name === activePage) { scrollToAnchor(); return; }
    if (galleryNames.has(name)) await ensureGallery();
    activePage = name;
    let page = data.pages[name]
      .replace(/#share-ref=(\d+)/g, (_, i) => shareHash(data.shares[i]))
      .replace(/#gallery-share-ref=(\d+)/g, (_, i) => shareHash(galleryShares[i]));
    if (data.sidebar) {
      const side = data.sidebar.replace('href="' + name + '"', 'href="' + name + '" aria-current="page"');
      page = page.replace("<!--sidebar-->", () => side);
    }
    if (data.search_dialog) {
      page = page.replace("<!--search-dialog-->", () => data.search_dialog);
    }
    if (data.course_data) {
      page = page.replace("<!--course-data-->", () => '<script id="course-data" type="application/json">' + data.course_data + "<" + "/script>");
    }
    page = page.replace('<link rel="stylesheet" href="assets/style.css">', () => "<style>" + data.css + "</style>");
    page = page.replace('<script src="assets/theme.js"><' + '/script>', () => script(data.theme));
    page = page.replace('<script src="assets/app.js" defer><' + '/script>', "");
    page = page.replace('<script src="assets/course.js" defer><' + '/script>', "");
    page = page.replace('<script src="assets/compiler.js" defer><' + '/script>', "");
    page = page.replace('<script src="assets/compiler.js"><' + '/script>', "");
    page = page.replace('<script src="assets/playground.js" defer><' + '/script>', "");
    if (name !== "trace.html") {
      const index = '<script id="search-index" type="application/json">' + data.search.replace(/</g, "\\u003c") + "<" + "/script>";
      page = page.replace("</body>", () => index + script("window.CpCompiler = parent.CpCompiler;")
        + script(data.app) + script(data.playground) + script(data.course) + "</body>");
    }
    frame.srcdoc = page;
  }
  window.addEventListener("hashchange", render);
  render();
})();
</script>
</body>
</html>
