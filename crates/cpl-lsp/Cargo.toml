[package]
name = "cpl-lsp"
description = "Language server."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
cpl-next-syntax.workspace = true
cpl-config.workspace = true
cpl-facade.workspace = true
cpl-diag.workspace = true
cpl-doc.workspace = true
cpl-fmt.workspace = true
cpl-json.workspace = true
cpl-judge.workspace = true
cpl-lint.workspace = true
cpl-syntax.workspace = true

# The samples and cases lenses run are files; a browser has none.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpl-wait.workspace = true
cpl-contest.workspace = true
# The home folder, for the cache std's files are opened from.
cpl-env.workspace = true

[dev-dependencies]
cpl-corpus.workspace = true
# The latency test measures with the allocator the `cpl` binary ships with.
mimalloc = { workspace = true }
