[package]
name = "cpl-facade"
description = "The one interface tools use to check and run a program, over an immutable snapshot."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
cpl-check.workspace = true
cpl-codegen = { workspace = true, optional = true }
cpl-diag.workspace = true
cpl-interp.workspace = true
cpl-ir.workspace = true

[features]
# The C++ back end: `emit_cpp` and what `cpl explain` reports of it. The
# browser's first load is built without it (scripts/build-wasm.sh).
cpp = ["dep:cpl-codegen"]
# Carry only std's prelude and mod; the host gives the rest.
lazy-std = ["cpl-check/lazy-std"]
