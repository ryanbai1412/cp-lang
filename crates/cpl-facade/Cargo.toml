[package]
name = "cpl-facade"
description = "The one interface tools use to check and run a program, over an immutable snapshot."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
cpl-check.workspace = true
cpl-codegen.workspace = true
cpl-diag.workspace = true
cpl-interp.workspace = true
cpl-ir.workspace = true

[features]
# Carry only std's prelude and mod; the host gives the rest.
lazy-std = ["cpl-check/lazy-std"]
