[package]
name = "cpl-cli"
description = "The cpl command-line tool."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "cpl"
path = "src/main.rs"

[dependencies]
cpl-env.workspace = true
cpl-contest.workspace = true
cpl-diag.workspace = true
cpl-facade = { workspace = true, features = ["cpp"] }
cpl-doc.workspace = true
cpl-fmt.workspace = true
cpl-judge.workspace = true
cpl-json.workspace = true
cpl-wait.workspace = true
cpl-lint.workspace = true
cpl-lsp.workspace = true
cpl-stress.workspace = true
cpl-syntax.workspace = true

# The allocator the `cpl` binary ships with (decisions.md: mimalloc).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = { workspace = true }

[dev-dependencies]
cpl-next-syntax.workspace = true
cpl-conform.workspace = true
cpl-corpus.workspace = true

[build-dependencies]
cpl-env.workspace = true
