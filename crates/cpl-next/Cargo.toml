[package]
name = "cpl-next"
description = "The new pipeline, grown beside today's until it replaces it. Reachable from tests only."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
cpl-next-syntax.workspace = true
cpl-diag.workspace = true
cpl-contract.workspace = true
cpl-next-ir.workspace = true
cpl-next-db.workspace = true
cpl-next-decls.workspace = true
cpl-next-check.workspace = true
cpl-next-own.workspace = true
cpl-next-lower.workspace = true
cpl-next-link.workspace = true
cpl-next-cpp.workspace = true
cpl-next-interp.workspace = true
cpl-next-engine.workspace = true

[dev-dependencies]
cpl-json.workspace = true
cpl-env.workspace = true
cpl-judge.workspace = true
cpl-conform.workspace = true
cpl-wait.workspace = true

# The allocator the `cpl` binary ships with (decisions.md: mimalloc).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = { workspace = true }
