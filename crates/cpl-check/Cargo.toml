[package]
name = "cpl-check"
description = "The incremental front end of the cp language: name resolution, types, domains, and hover."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# A browser build that carries `prelude` and `mod` and is given the other
# std modules (`provide_std`); build.rs reads it.
lazy-std = []

[dependencies]
cpl-rt.workspace = true
cpl-config.workspace = true
cpl-env.workspace = true
cpl-diag.workspace = true
cpl-judge.workspace = true
cpl-syntax.workspace = true

# The prover stays out of the playground build (about 105 KB gzipped).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpl-prover.workspace = true
