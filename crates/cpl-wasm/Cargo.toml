[package]
name = "cpl-wasm"
description = "The compiler as a WebAssembly module: check, run, build and hover for the docs site and the playground, with no server."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
# `cdylib` is the `.wasm` file; `rlib` lets the same code be tested natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
cpl-check.workspace = true
cpl-codegen = { workspace = true, optional = true }
cpl-diag.workspace = true
cpl-interp.workspace = true
cpl-ir.workspace = true
cpl-json.workspace = true
cpl-judge.workspace = true
cpl-lint.workspace = true
cpl-lsp.workspace = true
cpl-stress = { workspace = true, optional = true }

[features]
# `build`, `explain` and `stress`: the C++ back end and the stress runner.
# scripts/build-wasm.sh builds cpl.wasm without it (what every editor on the
# site loads first) and cpl-build.wasm with it (loaded on first use).
default = ["build"]
build = ["dep:cpl-codegen", "dep:cpl-stress"]
# Carry only std's prelude and mod; the page gives the rest (`provideStd`).
lazy-std = ["cpl-check/lazy-std"]

[dev-dependencies]
cpl-cli = { path = "../cpl-cli" }
