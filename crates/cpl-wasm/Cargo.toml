[package]
name = "cpl-wasm"
description = "The compiler as a WebAssembly module: check, run, build and hover for the docs site and the playground, with no server."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# `cdylib` is the `.wasm` file; `rlib` lets the same code be tested natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
cpl-check.workspace = true
cpl-codegen.workspace = true
cpl-diag.workspace = true
cpl-interp.workspace = true
cpl-ir.workspace = true
cpl-judge.workspace = true
cpl-lsp.workspace = true
cpl-stress.workspace = true

[dev-dependencies]
cpl-cli = { path = "../cpl-cli" }
