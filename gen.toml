# Every committed generated file: what writes it, from what, and where it is
# checked. `just gen` rewrites them; `scripts/gen.py --check` (commit tier)
# fails on drift in the `pre-commit` ones, `--ci` adds the `ci` ones.
# `scripts/repo-layout.py` fails on a file headed "Generated by ..." that no
# entry here owns. `check = "diff"` means: rerun `write`, compare, restore.
# tier: pre-commit (fast, every commit), ci (slow or needs a tool), manual
# (a measurement over history; rewritten only by its own command).
# Measurements updated by an explicit `--update` are not generated files:
# scripts/debt-ratchet.json, research/scoreboard.json,
# research/reviews/baseline.json, std/doc-baseline.json.

[[gen]]
name = "layout"
files = ["REPO.md"]
inputs = ["handbook/design/repo.md", "gen.toml"]
write = ["scripts/repo-layout.py", "--write"]
check = ["scripts/repo-layout.py", "--check"]
tier = "pre-commit"

[[gen]]
name = "status"
files = ["plan/STATUS.md"]
inputs = ["plan/domains/*/metrics.toml", "plan/QUESTIONS.md"]
write = ["scripts/status.py"]
check = ["scripts/status.py", "--check"]
tier = "pre-commit"

[[gen]]
name = "skill"
files = ["skills/cp-lang/stdlib/*.md"]
inputs = ["std/*.cp"]
write = ["scripts/skill-gen.py"]
check = ["scripts/skill-gen.py", "--drift"]
tier = "pre-commit"

[[gen]]
name = "coverage"
files = ["spec/conformance/COVERAGE.md", "spec/conformance/rule-gaps.txt"]
inputs = ["spec/core/*.md", "spec/lib/*.md", "std/*.cp", "spec/conformance/**/*.cp", "spec/lints.md"]
write = ["scripts/conformance-coverage.py"]
check = ["scripts/conformance-coverage.py", "--check"]
tier = "pre-commit"

[[gen]]
name = "lints"
files = ["spec/lints.md"]
inputs = ["spec/lints/*/lint.toml", "spec/checker-lints/*/lint.toml"]
write = ["scripts/gen-lint-table.py"]
check = ["scripts/gen-lint-table.py", "--check"]
tier = "pre-commit"

[[gen]]
name = "matrix"
files = ["spec/conformance/matrix/**/*.cp"]
inputs = ["spec/conformance/matrix.toml"]
write = ["scripts/conformance-matrix.py"]
check = ["scripts/conformance-matrix.py", "--check"]
tier = "pre-commit"

[[gen]]
name = "traits"
files = ["spec/conformance/traits/**/*.cp", "spec/conformance/trait-gaps.txt"]
inputs = ["spec/conformance/traits.toml", "std/*.cp"]
write = ["scripts/conformance-traits.py"]
check = ["scripts/conformance-traits.py", "--check"]
tier = "pre-commit"

[[gen]]
name = "sigs"
files = ["spec/conformance/sig-gaps.txt"]
inputs = ["spec/core/*.md", "spec/lib/*.md", "std/*.cp"]
write = ["scripts/conformance-sigs.py"]
check = ["scripts/conformance-sigs.py", "--check"]
tier = "pre-commit"

[[gen]]
name = "prelude"
files = ["spec/conformance/prelude-gaps.txt"]
inputs = ["spec/lib/*.md", "std/prelude.cp"]
write = ["scripts/conformance-prelude.py", "--update"]
check = ["scripts/conformance-prelude.py", "--check"]
tier = "pre-commit"

[[gen]]
name = "corpus-index"
# Only the generated fields of each meta.json; tags, dream, notes are hand-written.
files = ["corpus/index.json"]
inputs = ["corpus/problems/*/", "corpus/submissions/"]
write = ["scripts/corpus.py", "build"]
check = ["scripts/corpus.py", "check"]
tier = "pre-commit"

[[gen]]
name = "releases"
files = ["web/content/docs/releases.mdx"]
inputs = ["CHANGELOG.md"]
write = ["node", "web/scripts/releases.mjs"]
cwd = "web"
check = "diff"
tier = "pre-commit"

[[gen]]
name = "practice"
files = ["web/content/learn/practice/index.mdx", "web/content/learn/practice/meta.json"]
inputs = ["web/content/learn/practice/*.mdx"]
write = ["node", "web/scripts/practice.mjs"]
cwd = "web"
check = "diff"
tier = "pre-commit"

[[gen]]
name = "ports"
files = ["research/PORTS.md"]
inputs = ["corpus/problems/*/spec.cp", "research/reviews/"]
write = ["scripts/ports-page.py"]
check = "diff"
tier = "ci"

[[gen]]
name = "tree-sitter"
files = ["editors/tree-sitter-cp/src/parser.c"]
inputs = ["editors/tree-sitter-cp/grammar.js"]
write = ["tree-sitter", "generate"]
cwd = "editors/tree-sitter-cp"
check = "diff"
tier = "ci"

[[gen]]
name = "bugcatch"
files = ["plan/domains/spec/bugcatch.md"]
inputs = ["git history of crates/*/src"]
write = ["scripts/conformance-bugcatch.py"]
check = "none"
tier = "manual"

[[gen]]
name = "blockers"
files = ["plan/product/BLOCKERS.md"]
inputs = ["research/acceptance/runs/*.json"]
write = ["research/acceptance/blockers.py"]
check = ["research/acceptance/blockers.py", "--check"]
tier = "pre-commit"
