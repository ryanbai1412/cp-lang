on.\u003c/p>\n\u003cfigure class=\"code-block\">\u003cfigcaption>\u003cspan>cp.toml · planned library configuration\u003c/span>\u003cbutton class=\"copy-button\" type=\"button\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/figcaption>\u003cpre tabindex=\"0\">\u003ccode>[libs]\nlib = { path = &quot;../contest-lib&quot; }\u003c/code>\u003c/pre>\u003c/figure>\n\u003cfigure class=\"code-block\">\u003cfigcaption>\u003cspan>CP Lang · design fragment\u003c/span>\u003cbutton class=\"copy-button\" type=\"button\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/figcaption>\u003cpre tabindex=\"0\">\u003ccode>\u003cspan class=\"tok-keyword\">use\u003c/span> lib.graph.flow as flow\n\u003cspan class=\"tok-keyword\">use\u003c/span> lib.treap.{\u003cspan class=\"tok-type\">Treap\u003c/span>}\u003c/code>\u003c/pre>\u003c/figure>\n\u003cp>Export declarations with \u003ccode>pub\u003c/code>, and document them with \u003ccode>///\u003c/code> comments. Library modules contain declarations, not surprise input reads or mutable top-level state. The intended bundler follows imports, specializes generics, and includes only reachable code in the one-file C++17 submission.\u003c/p>\n\u003cp>Local libraries change during contests. The planned content-addressed store records exactly the sources used by a build, with explicit pinning and upgrades so old solutions remain reproducible. The \u003ccode>cpl test\u003c/code> and \u003ccode>cpl doc\u003c/code> workflows should work equally for your library and for \u003ccode>std\u003c/code>; neither is implemented in the current Rust CLI.\u003c/p>\n\u003ch2 id=\"go-to-the-source\">Go to the source\u003ca class=\"heading-link\" href=\"#go-to-the-source\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cp>Read the \u003ca href=\"https://github.com/ryanbai1412/cp-lang/blob/main/plan/20-stdlib.md\">standard-library plan\u003c/a> for scope, \u003ca href=\"https://github.com/ryanbai1412/cp-lang/blob/main/plan/13-abstraction.md\">abstractions\u003c/a> for traits and operation values, and the \u003ca href=\"https://github.com/ryanbai1412/cp-lang/tree/main/proto/ports\">prototype ports\u003c/a> for full solutions. When older plan text disagrees with a later approved design, the approved \u003ccode>Index\u003c/code>, \u003ccode>lends\u003c/code>, ASCII strings, \u003ccode>Bitset&lt;D&gt;\u003c/code>, and \u003ccode>.l\u003c/code>/\u003ccode>.r\u003c/code> model is what this guide teaches.\u003c/p>\n\u003c/article>\n      \u003cnav class=\"pager\" aria-label=\"Adjacent chapters\">\u003ca class=\"pager-previous\" href=\"testing.html\">\u003cspan>Previous ←\u003c/span>Memoization & stress tests\u003c/a>\u003c/nav>\n      \u003cfooter class=\"page-footer\">\u003cspan>CP Lang · A language for competitive programming.\u003c/span>\u003ca href=\"https://github.com/ryanbai1412/cp-lang/blob/main/site/content/stdlib.md\">Edit this page ↗\u003c/a>\u003c/footer>\n    \u003c/main>\n    \u003caside class=\"right-rail\" aria-label=\"On this page\">\u003cdiv class=\"toc\">\u003cp>On this page\u003c/p>\u003ca href=\"#sequences-and-collections\">Sequences and collections\u003c/a>\u003ca href=\"#range-data-structures\">Range data structures\u003c/a>\u003ca href=\"#graphs-and-trees\">Graphs and trees\u003c/a>\u003ca href=\"#strings-and-mathematics\">Strings and mathematics\u003c/a>\u003ca href=\"#write-a-local-library\">Write a local library\u003c/a>\u003ca href=\"#go-to-the-source\">Go to the source\u003c/a>\u003ca class=\"source-link\" href=\"https://github.com/ryanbai1412/cp-lang/tree/main/plan\">Language design ↗\u003c/a>\u003c/div>\u003c/aside>\n  \u003c/div>\n  \u003cdialog class=\"search-dialog\" aria-labelledby=\"search-title\">\n    \u003cform method=\"dialog\" class=\"search-header\">\u003clabel id=\"search-title\" for=\"search-input\">Search the guide\u003c/label>\u003cbutton type=\"submit\" aria-label=\"Close search\">Esc\u003c/button>\u003c/form>\n    \u003cinput id=\"search-input\" type=\"search\" autocomplete=\"off\" placeholder=\"Try “boundaries” or “lends mut”…\" aria-controls=\"search-results\">\n    \u003cp id=\"search-status\" role=\"status\">Type to find a chapter or a concept.\u003c/p>\n    \u003cdiv id=\"search-results\">\u003c/div>\n    \u003cdiv class=\"search-footer\">\u003cspan>↑ ↓ navigate\u003c/span>\u003cspan>Enter to open\u003c/span>\u003c/div>\n  \u003c/dialog>\n\u003c/body>\n\u003c/html>\n","strings.html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"description\" content=\"Byte arrays with typed character positions. Learn CP Lang with concrete examples for competitive programmers.\">\n  \u003cmeta name=\"color-scheme\" content=\"light dark\">\n  \u003ctitle>ASCII strings — CP Lang\u003c/title>\n  \n  \u003clink rel=\"stylesheet\" href=\"assets/style.css\">\n  \u003cscript src=\"assets/theme.js\">\u003c/script>\n  \u003cscript src=\"assets/app.js\" defer>\u003c/script>\n\n\u003c/head>\n\u003cbody class=\"chapter\">\n  \u003ca href=\"#main\" class=\"skip-link\">Skip to content\u003c/a>\n  \u003cheader class=\"topbar\">\n    \u003ca class=\"brand\" href=\"index.html\" aria-label=\"CP Lang home\">\u003cspan class=\"brand-mark\" aria-hidden=\"true\">cp\u003c/span>\u003cspan>CP Lang\u003c/span>\u003c/a>\n    \u003cnav class=\"product-nav\" aria-label=\"Products\">\u003ca href=\"index.html\" aria-current=\"page\">Docs\u003c/a>\u003ca href=\"playground.html\" >Playground\u003c/a>\u003ca href=\"trace.html\">Trace\u003c/a>\u003c/nav>\n    \u003cdiv class=\"top-actions\">\n      \u003cbutton class=\"search-trigger\" type=\"button\" aria-label=\"Search the guide\" aria-haspopup=\"dialog\">\u003cspan class=\"search-icon\" aria-hidden=\"true\">\u003c/span>\u003cspan>Search documentation\u003c/span>\u003ckbd>/\u003c/kbd>\u003c/button>\n      \u003ca class=\"github-link\" href=\"https://github.com/ryanbai1412/cp-lang\">GitHub \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\n      \u003cbutton class=\"theme-toggle icon-button\" aria-label=\"Switch to dark theme\" type=\"button\">◐\u003c/button>\n      \u003cbutton class=\"menu-toggle icon-button\" aria-label=\"Open navigation\" aria-expanded=\"false\" aria-controls=\"sidebar\" type=\"button\">☰\u003c/button>\n    \u003c/div>\n  \u003c/header>\n  \u003cdiv class=\"layout\">\n    \u003caside class=\"sidebar\" id=\"sidebar\">\n      \u003ca class=\"edition\" href=\"getting-started.html#what-works-today\">\u003cspan class=\"status-dot\">\u003c/span> Development edition \u003cspan>0.0\u003c/span>\u003c/a>\n      \u003cnav aria-label=\"Guide chapters\">\u003cdiv class=\"nav-group\">\u003ch2>Start here\u003c/h2>\u003ca href=\"index.html\">\u003cspan class=\"nav-number\">00\u003c/span>Overview\u003c/a>\u003ca href=\"getting-started.html\">\u003cspan class=\"nav-number\">01\u003c/span>Getting started\u003c/a>\u003ca href=\"tour.html\">\u003cspan class=\"nav-number\">02\u003c/span>A quick language tour\u003c/a>\u003c/div>\u003cdiv class=\"nav-group\">\u003ch2>The language\u003c/h2>\u003ca href=\"indices.html\">\u003cspan class=\"nav-number\">03\u003c/span>Index spaces &amp; bounds\u003c/a>\u003ca href=\"borrowing.html\">\u003cspan class=\"nav-number\">04\u003c/span>Ownership &amp; borrowing\u003c/a>\u003ca href=\"strings.html\" aria-current=\"page\">\u003cspan class=\"nav-number\">05\u003c/span>ASCII strings\u003c/a>\u003c/div>\u003cdiv class=\"nav-group\">\u003ch2>In practice\u003c/h2>\u003ca href=\"testing.html\">\u003cspan class=\"nav-number\">06\u003c/span>Memoization &amp; stress tests\u003c/a>\u003ca href=\"stdlib.html\">\u003cspan class=\"nav-number\">07\u003c/span>The standard library\u003c/a>\u003c/div>\u003c/nav>\n      \u003cdiv class=\"sidebar-footer\">CP Lang · Development\u003ca href=\"https://github.com/ryanbai1412/cp-lang/blob/main/decisions.md\">Design decisions ↗\u003c/a>\u003c/div>\n    \u003c/aside>\n    \u003cmain id=\"main\" tabindex=\"-1\">\n      \u003cdiv class=\"breadcrumb\">\u003cspan>The language\u003c/span>\u003cspan aria-hidden=\"true\">/\u003c/span>\u003cspan>ASCII strings\u003c/span>\u003c/div>\n      \u003cdiv class=\"page-meta\">\u003cspan>THE CP LANG GUIDE\u003c/span>\u003cspan>05 \u003cspan aria-hidden=\"true\">/\u003c/span> 5 min read\u003c/span>\u003c/div>\n      \u003cdiv class=\"chapter-title\">\u003ch1>ASCII strings\u003c/h1>\u003cp>Byte arrays with typed character positions.\u003c/p>\u003c/div>\n      \u003carticle>\u003cp>\u003ccode>Char\u003c/code> is one ASCII byte. \u003ccode>Str\u003c/code> is a flat array of those bytes. There is no UTF-8 decoding, variable-width character indexing, Unicode normalization, or separate code-point iterator hiding underneath a subscript.\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>Deliberate scope.\u003c/strong> Non-ASCII text is outside the \u003ccode>Char\u003c/code>/\u003ccode>Str\u003c/code> contract. A character or string literal must be ASCII, and input for those types must satisfy that constraint. Arbitrary binary data belongs in an explicit byte container, not in a string that silently changes encoding.\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"the-familiar-array-model\">The familiar array model\u003ca class=\"heading-link\" href=\"#the-familiar-array-model\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cp>When the input gives a length, use a domain-indexed character array. This example counts occurrences of a character in a single ASCII token.\u003c/p>\n\u003cfigure class=\"code-block\">\u003cfigcaption>\u003cspan>ascii.cp · prototype tested\u003c/span>\u003cbutton class=\"copy-button\" type=\"button\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/figcaption>\u003cpre tabindex=\"0\">\u003ccode>\u003cspan class=\"tok-keyword\">let\u003c/span> n: \u003cspan class=\"tok-number\">1\u003c/span>..=\u003cspan class=\"tok-number\">100\u003c/span> = read()\n\u003cspan class=\"tok-keyword\">domain\u003c/span> \u003cspan class=\"tok-type\">S\u003c/span> = \u003cspan class=\"tok-number\">1\u003c/span>..=n\n\u003cspan class=\"tok-keyword\">let\u003c/span> word: [\u003cspan class=\"tok-type\">S\u003c/span>]\u003cspan class=\"tok-type\">Char\u003c/span> = read()\nprint(count(word[i] == \u003cspan class=\"tok-string\">&#x27;a&#x27;\u003c/span> \u003cspan class=\"tok-keyword\">for\u003c/span> i \u003cspan class=\"tok-keyword\">in\u003c/span> \u003cspan class=\"tok-type\">S\u003c/span>))\u003c/code>\u003c/pre>\u003c/figure>\n\u003cp>For input \u003ccode>5 abaca\u003c/code>, the result is \u003ccode>3\u003c/code>. Each access selects exactly one byte. The stored character array is contiguous and supports O(1) indexing; there is no walk to the nth UTF-8 code point.\u003c/p>\n\u003ch2 id=\"a-string-carries-its-own-index-space\">A string carries its own index space\u003ca class=\"heading-link\" href=\"#a-string-carries-its-own-index-space\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cp>In the approved unified design, \u003ccode>Str\u003c/code> is an alias for \u003ccode>[domain]Char\u003c/code>: an owned array packaged with a fresh index type. Opening the package as \u003ccode>s\u003c/code> exposes that type as \u003ccode>s.Idx\u003c/code>. Two independent strings have different position types, even when they have the same length.\u003c/p>\n\u003cp>The ASCII restriction is implemented in the prototype. The \u003ccode>[domain]Char\u003c/code> package and \u003ccode>s.Idx\u003c/code> interface are still design-only.\u003c/p>\n\u003cfigure class=\"code-block\">\u003cfigcaption>\u003cspan>CP Lang · design\u003c/span>\u003cbutton class=\"copy-button\" type=\"button\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/figcaption>\u003cpre tabindex=\"0\">\u003ccode>\u003cspan class=\"tok-keyword\">let\u003c/span> s: \u003cspan class=\"tok-type\">Str\u003c/span> = read()\n\u003cspan class=\"tok-keyword\">let\u003c/span> t: \u003cspan class=\"tok-type\">Str\u003c/span> = read()\n\n\u003cspan class=\"tok-keyword\">for\u003c/span> i \u003cspan class=\"tok-keyword\">in\u003c/span> s.\u003cspan class=\"tok-type\">Idx\u003c/span>:\n    print(s[i])\u003c/code>\u003c/pre>\u003c/figure>\n\u003cp>\u003ccode>t[s.Idx.first!]\u003c/code> is not a shortcut for the first character of \u003ccode>t\u003c/code>; it mixes two index spaces. The \u003ccode>!\u003c/code> would also require that \u003ccode>s\u003c/code> is nonempty. Use positions belonging to the string you actually want.\u003c/p>\n\u003ch2 id=\"slices-and-boundaries-are-shared-tools\">Slices and boundaries are shared tools\u003ca class=\"heading-link\" href=\"#slices-and-boundaries-are-shared-tools\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cp>\u003ccode>s[l..=r]\u003c/code> lends a character slice just as \u003ccode>a[l..=r]\u003c/code> lends an integer slice. It does not allocate a substring. \u003ccode>.copy()\u003c/code> explicitly makes independent storage. Whole-slice operations and iteration can prove membership; an arbitrary parent position needs a window check.\u003c/p>\n\u003cp>For a two-string DP, put the empty prefix on a boundary rather than inventing an extra numeric row and column:\u003c/p>\n\u003cfigure class=\"code-block\">\u003cfigcaption>\u003cspan>CP Lang · design fragment\u003c/span>\u003cbutton class=\"copy-button\" type=\"button\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/figcaption>\u003cpre tabindex=\"0\">\u003ccode>\u003cspan class=\"tok-keyword\">var\u003c/span> dp: [s.\u003cspan class=\"tok-type\">Idx\u003c/span>.bounds, t.\u003cspan class=\"tok-type\">Idx\u003c/span>.bounds]\u003cspan class=\"tok-type\">Int\u003c/span> = \u003cspan class=\"tok-number\">0\u003c/span>\n\u003cspan class=\"tok-keyword\">for\u003c/span> i \u003cspan class=\"tok-keyword\">in\u003c/span> s.\u003cspan class=\"tok-type\">Idx\u003c/span>:\n    \u003cspan class=\"tok-keyword\">for\u003c/span> j \u003cspan class=\"tok-keyword\">in\u003c/span> t.\u003cspan class=\"tok-type\">Idx\u003c/span>:\n        dp[i.r, j.r] = \u003cspan class=\"tok-keyword\">if\u003c/span> s[i] == t[j]: dp[i.l, j.l] + \u003cspan class=\"tok-number\">1\u003c/span>\n                       \u003cspan class=\"tok-keyword\">else\u003c/span>: max(dp[i.l, j.r], dp[i.r, j.l])\u003c/code>\u003c/pre>\u003c/figure>\n\u003cp>This is the LCS recurrence expressed over the two strings' own indices. Swapping an \u003ccode>s\u003c/code> boundary with a \u003ccode>t\u003c/code> boundary is a type error. \u003ccode>.l\u003c/code> and \u003ccode>.r\u003c/code> have the same meaning here as they do in \u003ca href=\"indices.html#prefix-sums-without-shifts\">integer prefix sums\u003c/a>.\u003c/p>\n\u003ch2 id=\"owning-collections-of-strings\">Owning collections of strings\u003ca class=\"heading-link\" href=\"#owning-collections-of-strings\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cp>\u003ccode>List&lt;Str&gt;\u003c/code> can hold strings of different lengths because each element owns its own package. A string opened while iterating is lent for that iteration. Keep \u003ccode>.copy()\u003c/code> if the result needs independent ownership, rather than storing a borrowed window.\u003c/p>\n\u003cp>String equality, ordering, and hashing compare contents; sharing an index type is not required to compare two strings. Build growing text with \u003ccode>List&lt;Char&gt;\u003c/code>, then freeze/package it as a \u003ccode>Str\u003c/code>. The library is responsible for these operations, not a second string-only type system.\u003c/p>\n\u003ch2 id=\"string-algorithms-not-string-magic\">String algorithms, not string magic\u003ca class=\"heading-link\" href=\"#string-algorithms-not-string-magic\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cp>The standard-library plan includes prefix functions, Z-functions, hashing, and suffix arrays. They should accept the same bounded character arrays as ordinary sequence code. The \u003ca href=\"https://github.com/ryanbai1412/cp-lang/blob/main/proto/ports/ccc20s3.cp\">Searching for Strings port\u003c/a> is a concrete prototype example: character domains for letter counts, a moving window, and substring hashes.\u003c/p>\n\u003c/article>\n      \u003cnav class=\"pager\" aria-label=\"Adjacent chapters\">\u003ca class=\"pager-previous\" href=\"borrowing.html\">\u003cspan>Previous ←\u003c/span>Ownership & borrowing\u003c/a>\u003ca class=\"pager-next\" href=\"testing.html\">\u003cspan>Next →\u003c/span>Memoization & stress tests\u003c/a>\u003c/nav>\n      \u003cfooter class=\"page-footer\">\u003cspan>CP Lang · A language for competitive programming.\u003c/span>\u003ca href=\"https://github.com/ryanbai1412/cp-lang/blob/main/site/content/strings.md\">Edit this page ↗\u003c/a>\u003c/footer>\n    \u003c/main>\n    \u003caside class=\"right-rail\" aria-label=\"On this page\">\u003cdiv class=\"toc\">\u003cp>On this page\u003c/p>\u003ca href=\"#the-familiar-array-model\">The familiar array model\u003c/a>\u003ca href=\"#a-string-carries-its-own-index-space\">A string carries its own index space\u003c/a>\u003ca href=\"#slices-and-boundaries-are-shared-tools\">Slices and boundaries are shared tools\u003c/a>\u003ca href=\"#owning-collections-of-strings\">Owning collections of strings\u003c/a>\u003ca href=\"#string-algorithms-not-string-magic\">String algorithms, not string magic\u003c/a>\u003ca class=\"source-link\" href=\"https://github.com/ryanbai1412/cp-lang/tree/main/plan\">Language design ↗\u003c/a>\u003c/div>\u003c/aside>\n  \u003c/div>\n  \u003cdialog class=\"search-dialog\" aria-labelledby=\"search-title\">\n    \u003cform method=\"dialog\" class=\"search-header\">\u003clabel id=\"search-title\" for=\"search-input\">Search the guide\u003c/label>\u003cbutton type=\"submit\" aria-label=\"Close search\">Esc\u003c/button>\u003c/form>\n    \u003cinput id=\"search-input\" type=\"search\" autocomplete=\"off\" placeholder=\"Try “boundaries” or “lends mut”…\" aria-controls=\"search-results\">\n    \u003cp id=\"search-status\" role=\"status\">Type to find a chapter or a concept.\u003c/p>\n    \u003cdiv id=\"search-results\">\u003c/div>\n    \u003cdiv class=\"search-footer\">\u003cspan>↑ ↓ navigate\u003c/span>\u003cspan>Enter to open\u003c/span>\u003c/div>\n  \u003c/dialog>\n\u003c/body>\n\u003c/html>\n","testing.html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"description\" content=\"Cache recurrences and compare fast and reference solutions. Learn CP Lang with concrete examples for competitive programmers.\">\n  \u003cmeta name=\"color-scheme\" content=\"light dark\">\n  \u003ctitle>Memoization &amp; stress tests — CP Lang\u003c/title>\n  \n  \u003clink rel=\"stylesheet\" href=\"assets/style.css\">\n  \u003cscript src=\"assets/theme.js\">\u003c/script>\n  \u003cscript src=\"assets/app.js\" defer>\u003c/script>\n\n\u003c/head>\n\u003cbody class=\"chapter\">\n  \u003ca href=\"#main\" class=\"skip-link\">Skip to content\u003c/a>\n  \u003cheader class=\"topbar\">\n    \u003ca class=\"brand\" href=\"index.html\" aria-label=\"CP Lang home\">\u003cspan class=\"brand-mark\" aria-hidden=\"true\">cp\u003c/span>\u003cspan>CP Lang\u003c/span>\u003c/a>\n    \u003cnav class=\"product-nav\" aria-label=\"Products\">\u003ca href=\"index.html\" aria-current=\"page\">Docs\u003c/a>\u003ca href=\"playground.html\" >Playground\u003c/a>\u003ca href=\"trace.html\">Trace\u003c/a>\u003c/nav>\n    \u003cdiv class=\"top-actions\">\n      \u003cbutton class=\"search-trigger\" type=\"button\" aria-label=\"Search the guide\" aria-haspopup=\"dialog\">\u003cspan class=\"search-icon\" aria-hidden=\"true\">\u003c/span>\u003cspan>Search documentation\u003c/span>\u003ckbd>/\u003c/kbd>\u003c/button>\n      \u003ca class=\"github-link\" href=\"https://github.com/ryanbai1412/cp-lang\">GitHub \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\n      \u003cbutton class=\"theme-toggle icon-button\" aria-label=\"Switch to dark theme\" type=\"button\">◐\u003c/button>\n      \u003cbutton class=\"menu-toggle icon-button\" aria-label=\"Open navigation\" aria-expanded=\"false\" aria-controls=\"sidebar\" type=\"button\">☰\u003c/button>\n    \u003c/div>\n  \u003c/header>\n  \u003cdiv class=\"layout\">\n    \u003caside class=\"sidebar\" id=\"sidebar\">\n      \u003ca class=\"edition\" href=\"getting-started.html#what-works-today\">\u003cspan class=\"status-dot\">\u003c/span> Development edition \u003cspan>0.0\u003c/span>\u003c/a>\n      \u003cnav aria-label=\"Guide chapters\">\u003cdiv class=\"nav-group\">\u003ch2>Start here\u003c/h2>\u003ca href=\"index.html\">\u003cspan class=\"nav-number\">00\u003c/span>Overview\u003c/a>\u003ca href=\"getting-started.html\">\u003cspan class=\"nav-number\">01\u003c/span>Getting started\u003c/a>\u003ca href=\"tour.html\">\u003cspan class=\"nav-number\">02\u003c/span>A quick language tour\u003c/a>\u003c/div>\u003cdiv class=\"nav-group\">\u003ch2>The language\u003c/h2>\u003ca href=\"indices.html\">\u003cspan class=\"nav-number\">03\u003c/span>Index spaces &amp; bounds\u003c/a>\u003ca href=\"borrowing.html\">\u003cspan class=\"nav-number\">04\u003c/span>Ownership &amp; borrowing\u003c/a>\u003ca href=\"strings.html\">\u003cspan class=\"nav-number\">05\u003c/span>ASCII strings\u003c/a>\u003c/div>\u003cdiv class=\"nav-group\">\u003ch2>In practice\u003c/h2>\u003ca href=\"testing.html\" aria-current=\"page\">\u003cspan class=\"nav-number\">06\u003c/span>Memoization &amp; stress tests\u003c/a>\u003ca href=\"stdlib.html\">\u003cspan class=\"nav-number\">07\u003c/span>The standard library\u003c/a>\u003c/div>\u003c/nav>\n      \u003cdiv class=\"sidebar-footer\">CP Lang · Development\u003ca href=\"https://github.com/ryanbai1412/cp-lang/blob/main/decisions.md\">Design decisions ↗\u003c/a>\u003c/div>\n    \u003c/aside>\n    \u003cmain id=\"main\" tabindex=\"-1\">\n      \u003cdiv class=\"breadcrumb\">\u003cspan>In practice\u003c/span>\u003cspan aria-hidden=\"true\">/\u003c/span>\u003cspan>Memoization &amp; stress tests\u003c/span>\u003c/div>\n      \u003cdiv class=\"page-meta\">\u003cspan>THE CP LANG GUIDE\u003c/span>\u003cspan>06 \u003cspan aria-hidden=\"true\">/\u003c/span> 8 min read\u003c/span>\u003c/div>\n      \u003cdiv class=\"chapter-title\">\u003ch1>Memoization &amp; stress tests\u003c/h1>\u003cp>Cache recurrences and compare fast and reference solutions.\u003c/p>\u003c/div>\n      \u003carticle>\u003cp>Keep the fast solution, a simple trusted alternative, and the input constraints close together. A randomized mismatch is useful only if you can turn it into a small input and understand which part disagreed.\u003c/p>\n\u003ch2 id=\"memoize-the-recurrence\">Memoize the recurrence\u003ca class=\"heading-link\" href=\"#memoize-the-recurrence\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cp>\u003ccode>@memo\u003c/code> caches a function by its arguments. Here the domain bounds the state space; the recurrence asks for the previous state only when it exists.\u003c/p>\n\u003cfigure class=\"code-block\">\u003cfigcaption>\u003cspan>memo.cp · prototype tested\u003c/span>\u003cbutton class=\"copy-button\" type=\"button\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/figcaption>\u003cpre tabindex=\"0\">\u003ccode>\u003cspan class=\"tok-keyword\">let\u003c/span> n: \u003cspan class=\"tok-number\">1\u003c/span>..=\u003cspan class=\"tok-number\">20\u003c/span> = read()\n\u003cspan class=\"tok-keyword\">domain\u003c/span> \u003cspan class=\"tok-type\">I\u003c/span> = \u003cspan class=\"tok-number\">0\u003c/span>..n\n\n\u003cspan class=\"tok-decorator\">@memo\u003c/span>\n\u003cspan class=\"tok-keyword\">fn\u003c/span> f(i: \u003cspan class=\"tok-type\">I\u003c/span>) -&gt; \u003cspan class=\"tok-type\">Int\u003c/span>:\n    \u003cspan class=\"tok-keyword\">if\u003c/span> \u003cspan class=\"tok-keyword\">let\u003c/span> p = i.prev:\n        \u003cspan class=\"tok-keyword\">return\u003c/span> f(p) * \u003cspan class=\"tok-number\">3\u003c/span> + i.idx\n    \u003cspan class=\"tok-number\">1\u003c/span>\n\nprint(f(\u003cspan class=\"tok-type\">I\u003c/span>.last))\u003c/code>\u003c/pre>\u003c/figure>\n\u003cp>With input \u003ccode>4\u003c/code>, the states are \u003ccode>1\u003c/code>, \u003ccode>4\u003c/code>, \u003ccode>14\u003c/code>, \u003ccode>45\u003c/code>, so the program prints \u003ccode>45\u003c/code>. The prototype's \u003ccode>i.idx\u003c/code> is a zero-based ordinal helper, not a conversion from an unrelated integer domain.\u003c/p>\n\u003cp>The cache is not magic algorithm selection. Sparse scalar keys can use a hash-backed cache; finite indexed keys permit dense tables. The prototype also supports \u003ccode>@memo(into: dp)\u003c/code> to name the table and \u003ccode>@memo(order: ascending)\u003c/code> for an explicit ascending evaluation order. Choose an order only when it matches the recurrence's dependencies. Do not read “memoized” as “safe for cycles” or “safe for arbitrarily deep recursion”.\u003c/p>\n\u003cp>For a real tree DP, read \u003ca href=\"https://github.com/ryanbai1412/cp-lang/blob/main/proto/ports/ioi05p6.cp\">IOI 2005 Rivers\u003c/a>. It memoizes depth and the cost of serving a subtree from a selected mill.\u003c/p>\n\u003ch2 id=\"turn-input-into-a-specification\">Turn input into a specification\u003ca class=\"heading-link\" href=\"#turn-input-into-a-specification\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cp>The input \u003cstrong>spec\u003c/strong> is the type-and-constraint description of valid cases. In the current prototype that description is written as typed \u003ccode>read()\u003c/code> declarations, not a separate \u003ccode>spec\u003c/code> keyword or block.\u003c/p>\n\u003cfigure class=\"code-block\">\u003cfigcaption>\u003cspan>Input specification · prototype syntax\u003c/span>\u003cbutton class=\"copy-button\" type=\"button\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/figcaption>\u003cpre tabindex=\"0\">\u003ccode>\u003cspan class=\"tok-keyword\">let\u003c/span> n: \u003cspan class=\"tok-number\">1\u003c/span>..=\u003cspan class=\"tok-number\">2e5\u003c/span> = read()\n\u003cspan class=\"tok-keyword\">domain\u003c/span> \u003cspan class=\"tok-type\">V\u003c/span> = \u003cspan class=\"tok-number\">1\u003c/span>..=n\n\u003cspan class=\"tok-keyword\">let\u003c/span> a: [\u003cspan class=\"tok-type\">V\u003c/span>]\u003cspan class=\"tok-number\">0\u003c/span>..=\u003cspan class=\"tok-number\">1e9\u003c/span> = read()\u003c/code>\u003c/pre>\u003c/figure>\n\u003cp>These declarations say how to read input, how much storage to allocate, and what values a generator is allowed to produce. A \u003ccode>where\u003c/code> condition adds a relation between values. For structured inputs that are expensive to generate by rejection, the prototype accepts a custom \u003ccode>gen:\u003c/code> helper; \u003ca href=\"https://github.com/ryanbai1412/cp-lang/blob/main/proto/ports/ioi05p6.cp\">Rivers\u003c/a> generates a tree directly and checks its drainage invariant.\u003c/p>\n\u003cp>The approved tooling direction extends this to typed generators and structure-aware shrinkers: a failing tree should shrink by removing leaves, not by deleting arbitrary bytes until it stops being a tree. The full automatic shrinking workflow is still planned, not a feature of the Rust CLI today.\u003c/p>\n\u003ch2 id=\"keep-a-brute-for-one-part\">Keep a brute for one part\u003ca class=\"heading-link\" href=\"#keep-a-brute-for-one-part\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cp>The prototype attaches \u003ccode>@brute(fast_name)\u003c/code> to the slow function. This direction matters: name the function being checked, not the brute itself.\u003c/p>\n\u003cfigure class=\"code-block\">\u003cfigcaption>\u003cspan>CP Lang · prototype syntax fragment\u003c/span>\u003cbutton class=\"copy-button\" type=\"button\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/figcaption>\u003cpre tabindex=\"0\">\u003ccode>\u003cspan class=\"tok-keyword\">fn\u003c/span> fast(a: [\u003cspan class=\"tok-type\">V\u003c/span>]\u003cspan class=\"tok-type\">Int\u003c/span>) -&gt; \u003cspan class=\"tok-type\">Int\u003c/span>:\n    sum(a)\n\n\u003cspan class=\"tok-decorator\">@brute\u003c/span>(fast)\n\u003cspan class=\"tok-keyword\">fn\u003c/span> slow(a: [\u003cspan class=\"tok-type\">V\u003c/span>]\u003cspan class=\"tok-type\">Int\u003c/span>) -&gt; \u003cspan class=\"tok-type\">Int\u003c/span>:\n    \u003cspan class=\"tok-keyword\">var\u003c/span> result = \u003cspan class=\"tok-number\">0\u003c/span>\n    \u003cspan class=\"tok-keyword\">for\u003c/span> v \u003cspan class=\"tok-keyword\">in\u003c/span> \u003cspan class=\"tok-type\">V\u003c/span>:\n        result += a[v]\n    result\u003c/code>\u003c/pre>\u003c/figure>\n\u003cp>This tiny pair assumes the input and domain from the preceding specification. Real brutes are deliberately slower and simpler. A brute for one stage is often more informative than a second implementation of the whole program: it narrows the disagreement to that stage.\u003c/p>\n\u003ch2 id=\"stress-a-real-port-today\">Stress a real port today\u003ca class=\"heading-link\" href=\"#stress-a-real-port-today\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cp>Run the prototype against an original C++ solution. The following recipe copies a port out of the tracked directory because prototype build commands stamp the source and write generated files next to it.\u003c/p>\n\u003cfigure class=\"code-block\">\u003cfigcaption>\u003cspan>Terminal\u003c/span>\u003cbutton class=\"copy-button\" type=\"button\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/figcaption>\u003cpre tabindex=\"0\">\u003ccode>mkdir -p scratch/docs-stress\ncp proto/ports/dmopc21c2p1.cp scratch/docs-stress/solution.cp\npython3 proto/cp.py stress scratch/docs-stress/solution.cp \\\n  proto/ports/dmopc21c2p1_orig.cpp 100 8\u003c/code>\u003c/pre>\u003c/figure>\n\u003cp>The last two arguments are the number of seeds and the small size bound. The tool compiles the solution, generator, and reference with \u003ccode>g++\u003c/code>, compares tokenized outputs, and prints the seed and input on a mismatch. This is a real local native run, not a simulated example. It does not by itself prove correctness over the full input range.\u003c/p>\n\u003cp>\u003ccode>python3 proto/cp.py fntest file.cp 20 8\u003c/code> checks the file's \u003ccode>@brute(fast)\u003c/code> and invariant functions on generated calls. \u003ccode>locate\u003c/code> can search small generated inputs and swap a part for its brute to help identify the source of a disagreement. Those prototype tools are separate from the planned polished \u003ccode>cpl stress\u003c/code> command.\u003c/p>\n\u003ch2 id=\"the-finished-workflow\">The finished workflow\u003ca class=\"heading-link\" href=\"#the-finished-workflow\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cp>An input spec describes \u003cstrong>legal inputs\u003c/strong>. The approved design also calls for co-located \u003ccode>spec\u003c/code> checks that describe \u003cstrong>correct behavior\u003c/strong>: keep a small trusted implementation beside the fast one, compare intermediate states, and show the first divergence in the trace debugger. That integrated state-diffing experience is planned; today's prototype \u003ccode>@brute\u003c/code> tools are the working starting point, not a claim that the finished \u003ccode>spec\u003c/code> workflow already ships.\u003c/p>\n\u003cp>The intended \u003ccode>cpl stress d.cp\u003c/code> uses the input spec, checks fast and brute implementations, shrinks a failure while preserving validity, and saves a regression input beside the problem. Tests, brutes, and specification-only machinery must not inflate the submitted C++. The same testing model is intended for standard-library modules and local libraries, not just single solutions.\u003c/p>\n\u003c/article>\n      \u003cnav class=\"pager\" aria-label=\"Adjacent chapters\">\u003ca class=\"pager-previous\" href=\"strings.html\">\u003cspan>Previous ←\u003c/span>ASCII strings\u003c/a>\u003ca class=\"pager-next\" href=\"stdlib.html\">\u003cspan>Next →\u003c/span>The standard library\u003c/a>\u003c/nav>\n      \u003cfooter class=\"page-footer\">\u003cspan>CP Lang · A language for competitive programming.\u003c/span>\u003ca href=\"https://github.com/ryanbai1412/cp-lang/blob/main/site/content/testing.md\">Edit this page ↗\u003c/a>\u003c/footer>\n    \u003c/main>\n    \u003caside class=\"right-rail\" aria-label=\"On this page\">\u003cdiv class=\"toc\">\u003cp>On this page\u003c/p>\u003ca href=\"#memoize-the-recurrence\">Memoize the recurrence\u003c/a>\u003ca href=\"#turn-input-into-a-specification\">Turn input into a specification\u003c/a>\u003ca href=\"#keep-a-brute-for-one-part\">Keep a brute for one part\u003c/a>\u003ca href=\"#stress-a-real-port-today\">Stress a real port today\u003c/a>\u003ca href=\"#the-finished-workflow\">The finished workflow\u003c/a>\u003ca class=\"source-link\" href=\"https://github.com/ryanbai1412/cp-lang/tree/main/plan\">Language design ↗\u003c/a>\u003c/div>\u003c/aside>\n  \u003c/div>\n  \u003cdialog class=\"search-dialog\" aria-labelledby=\"search-title\">\n    \u003cform method=\"dialog\" class=\"search-header\">\u003clabel id=\"search-title\" for=\"search-input\">Search the guide\u003c/label>\u003cbutton type=\"submit\" aria-label=\"Close search\">Esc\u003c/button>\u003c/form>\n    \u003cinput id=\"search-input\" type=\"search\" autocomplete=\"off\" placeholder=\"Try “boundaries” or “lends mut”…\" aria-controls=\"search-results\">\n    \u003cp id=\"search-status\" role=\"status\">Type to find a chapter or a concept.\u003c/p>\n    \u003cdiv id=\"search-results\">\u003c/div>\n    \u003cdiv class=\"search-footer\">\u003cspan>↑ ↓ navigate\u003c/span>\u003cspan>Enter to open\u003c/span>\u003c/div>\n  \u003c/dialog>\n\u003c/body>\n\u003c/html>\n","tour.html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"description\" content=\"Values, functions, loops, and program structure. Learn CP Lang with concrete examples for competitive programmers.\">\n  \u003cmeta name=\"color-scheme\" content=\"light dark\">\n  \u003ctitle>A quick language tour — CP Lang\u003c/title>\n  \n  \u003clink rel=\"stylesheet\" href=\"assets/style.css\">\n  \u003cscript src=\"assets/theme.js\">\u003c/script>\n  \u003cscript src=\"assets/app.js\" defer>\u003c/script>\n\n\u003c/head>\n\u003cbody class=\"chapter\">\n  \u003ca href=\"#main\" class=\"skip-link\">Skip to content\u003c/a>\n  \u003cheader class=\"topbar\">\n    \u003ca class=\"brand\" href=\"index.html\" aria-label=\"CP Lang home\">\u003cspan class=\"brand-mark\" aria-hidden=\"true\">cp\u003c/span>\u003cspan>CP Lang\u003c/span>\u003c/a>\n    \u003cnav class=\"product-nav\" aria-label=\"Products\">\u003ca href=\"index.html\" aria-current=\"page\">Docs\u003c/a>\u003ca href=\"playground.html\" >Playground\u003c/a>\u003ca href=\"trace.html\">Trace\u003c/a>\u003c/nav>\n    \u003cdiv class=\"top-actions\">\n      \u003cbutton class=\"search-trigger\" type=\"button\" aria-label=\"Search the guide\" aria-haspopup=\"dialog\">\u003cspan class=\"search-icon\" aria-hidden=\"true\">\u003c/span>\u003cspan>Search documentation\u003c/span>\u003ckbd>/\u003c/kbd>\u003c/button>\n      \u003ca class=\"github-link\" href=\"https://github.com/ryanbai1412/cp-lang\">GitHub \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\n      \u003cbutton class=\"theme-toggle icon-button\" aria-label=\"Switch to dark theme\" type=\"button\">◐\u003c/button>\n      \u003cbutton class=\"menu-toggle icon-button\" aria-label=\"Open navigation\" aria-expanded=\"false\" aria-controls=\"sidebar\" type=\"button\">☰\u003c/button>\n    \u003c/div>\n  \u003c/header>\n  \u003cdiv class=\"layout\">\n    \u003caside class=\"sidebar\" id=\"sidebar\">\n      \u003ca class=\"edition\" href=\"getting-started.html#what-works-today\">\u003cspan class=\"status-dot\">\u003c/span> Development edition \u003cspan>0.0\u003c/span>\u003c/a>\n      \u003cnav aria-label=\"Guide chapters\">\u003cdiv class=\"nav-group\">\u003ch2>Start here\u003c/h2>\u003ca href=\"index.html\">\u003cspan class=\"nav-number\">00\u003c/span>Overview\u003c/a>\u003ca href=\"getting-started.html\">\u003cspan class=\"nav-number\">01\u003c/span>Getting started\u003c/a>\u003ca href=\"tour.html\" aria-current=\"page\">\u003cspan class=\"nav-number\">02\u003c/span>A quick language tour\u003c/a>\u003c/div>\u003cdiv class=\"nav-group\">\u003ch2>The language\u003c/h2>\u003ca href=\"indices.html\">\u003cspan class=\"nav-number\">03\u003c/span>Index spaces &amp; bounds\u003c/a>\u003ca href=\"borrowing.html\">\u003cspan class=\"nav-number\">04\u003c/span>Ownership &amp; borrowing\u003c/a>\u003ca href=\"strings.html\">\u003cspan class=\"nav-number\">05\u003c/span>ASCII strings\u003c/a>\u003c/div>\u003cdiv class=\"nav-group\">\u003ch2>In practice\u003c/h2>\u003ca href=\"testing.html\">\u003cspan class=\"nav-number\">06\u003c/span>Memoization &amp; stress tests\u003c/a>\u003ca href=\"stdlib.html\">\u003cspan class=\"nav-number\">07\u003c/span>The standard library\u003c/a>\u003c/div>\u003c/nav>\n      \u003cdiv class=\"sidebar-footer\">CP Lang · Development\u003ca href=\"https://github.com/ryanbai1412/cp-lang/blob/main/decisions.md\">Design decisions ↗\u003c/a>\u003c/div>\n    \u003c/aside>\n    \u003cmain id=\"main\" tabindex=\"-1\">\n      \u003cdiv class=\"breadcrumb\">\u003cspan>Start here\u003c/span>\u003cspan aria-hidden=\"true\">/\u003c/span>\u003cspan>A quick language tour\u003c/span>\u003c/div>\n      \u003cdiv class=\"page-meta\">\u003cspan>THE CP LANG GUIDE\u003c/span>\u003cspan>02 \u003cspan aria-hidden=\"true\">/\u003c/span> 8 min read\u003c/span>\u003c/div>\n      \u003cdiv class=\"chapter-title\">\u003ch1>A quick language tour\u003c/h1>\u003cp>Values, functions, loops, and program structure.\u003c/p>\u003c/div>\n      \u003carticle>\u003cp>You already know how to solve the problem. This chapter is about expressing the solution: indentation instead of braces, values instead of sentinels, and a file that reads like the main flow of your algorithm.\u003c/p>\n\u003ch2 id=\"values-and-mutation\">Values and mutation\u003ca class=\"heading-link\" href=\"#values-and-mutation\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cp>Use \u003ccode>let\u003c/code> by default, and \u003ccode>var\u003c/code> for a binding that changes. \u003ccode>Int\u003c/code> is the default 64-bit integer. A range type states a constraint, rather than asking you to remember which width is enough.\u003c/p>\n\u003cfigure class=\"code-block\">\u003cfigcaption>\u003cspan>accumulation.cp · prototype tested\u003c/span>\u003cbutton class=\"copy-button\" type=\"button\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/figcaption>\u003cpre tabindex=\"0\">\u003ccode>\u003cspan class=\"tok-keyword\">let\u003c/span> n: \u003cspan class=\"tok-number\">1\u003c/span>..=\u003cspan class=\"tok-number\">100\u003c/span> = read()\n\u003cspan class=\"tok-keyword\">domain\u003c/span> \u003cspan class=\"tok-type\">V\u003c/span> = \u003cspan class=\"tok-number\">1\u003c/span>..=n\n\u003cspan class=\"tok-keyword\">let\u003c/span> a: [\u003cspan class=\"tok-type\">V\u003c/span>]\u003cspan class=\"tok-number\">0\u003c/span>..=\u003cspan class=\"tok-number\">1000\u003c/span> = read()\n\u003cspan class=\"tok-keyword\">var\u003c/span> total = \u003cspan class=\"tok-number\">0\u003c/span>\n\u003cspan class=\"tok-keyword\">for\u003c/span> v \u003cspan class=\"tok-keyword\">in\u003c/span> \u003cspan class=\"tok-type\">V\u003c/span>:\n    total += a[v]\nprint(total)\u003c/code>\u003c/pre>\u003c/figure>\n\u003cp>Range-typed storage is intended to use the smallest fitting width, while arithmetic uses \u003ccode>Int\u003c/code>. \u003ccode>Int\u003c/code> reserves the most-negative 64-bit bit pattern for \u003ccode>none\u003c/code>, so \u003ccode>?Int\u003c/code> fits in the same eight bytes. Use the explicit fixed-width types for bit-level work.\u003c/p>\n\u003ch2 id=\"missing-is-a-value\">Missing is a value\u003ca class=\"heading-link\" href=\"#missing-is-a-value\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cp>\u003ccode>?T\u003c/code> means “a \u003ccode>T\u003c/code>, or \u003ccode>none\u003c/code>”. \u003ccode>??\u003c/code> supplies a fallback; \u003ccode>if let\u003c/code> uses the value only when it exists. A missing predecessor is not \u003ccode>-1\u003c/code>, and an unreachable distance is not a suspiciously large integer.\u003c/p>\n\u003cfigure class=\"code-block\">\u003cfigcaption>\u003cspan>optional.cp · prototype tested\u003c/span>\u003cbutton class=\"copy-button\" type=\"button\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/figcaption>\u003cpre tabindex=\"0\">\u003ccode>\u003cspan class=\"tok-keyword\">domain\u003c/span> \u003cspan class=\"tok-type\">V\u003c/span> = \u003cspan class=\"tok-number\">1\u003c/span>..=\u003cspan class=\"tok-number\">3\u003c/span>\n\u003cspan class=\"tok-keyword\">let\u003c/span> a: [\u003cspan class=\"tok-type\">V\u003c/span>]\u003cspan class=\"tok-type\">Int\u003c/span> = [\u003cspan class=\"tok-type\">V\u003c/span>] v =&gt; v.idx * \u003cspan class=\"tok-number\">10\u003c/span>\n\u003cspan class=\"tok-keyword\">for\u003c/span> v \u003cspan class=\"tok-keyword\">in\u003c/span> \u003cspan class=\"tok-type\">V\u003c/span>:\n    \u003cspan class=\"tok-keyword\">if\u003c/span> \u003cspan class=\"tok-keyword\">let\u003c/span> p = v.prev:\n        print(a[v] - a[p])\n    \u003cspan class=\"tok-keyword\">else\u003c/span>:\n        print(\u003cspan class=\"tok-number\">0\u003c/span>)\u003c/code>\u003c/pre>\u003c/figure>\n\u003cp>\u003ccode>v.prev\u003c/code> returns \u003ccode>none\u003c/code> at the first position. You cannot silently step outside the domain. The same pattern handles \u003ccode>v.next\u003c/code>, an empty minimum, and a lookup that finds nothing.\u003c/p>\n\u003ch2 id=\"functions-and-explicit-changes\">Functions and explicit changes\u003ca class=\"heading-link\" href=\"#functions-and-explicit-changes\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cp>A parameter borrows by default. A function that changes its argument marks it \u003ccode>mut\u003c/code>, and its caller agrees by writing \u003ccode>mut\u003c/code> too. There is no implicit deep copy of an array.\u003c/p>\n\u003cfigure class=\"code-block\">\u003cfigcaption>\u003cspan>CP Lang · design\u003c/span>\u003cbutton class=\"copy-button\" type=\"button\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/figcaption>\u003cpre tabindex=\"0\">\u003ccode>\u003cspan class=\"tok-keyword\">fn\u003c/span> add_to(\u003cspan class=\"tok-keyword\">mut\u003c/span> a: [\u003cspan class=\"tok-type\">V\u003c/span>]\u003cspan class=\"tok-type\">Int\u003c/span>, v: \u003cspan class=\"tok-type\">V\u003c/span>, delta: \u003cspan class=\"tok-type\">Int\u003c/span>):\n    a[v] += delta\n\nadd_to(\u003cspan class=\"tok-keyword\">mut\u003c/span> a, \u003cspan class=\"tok-type\">V\u003c/span>.first, \u003cspan class=\"tok-number\">3\u003c/span>)\n\u003cspan class=\"tok-keyword\">let\u003c/span> snapshot = a.copy()\u003c/code>\u003c/pre>\u003c/figure>\n\u003cp>An ordinary helper can see immutable values in the surrounding program. A nested \u003ccode>mut fn\u003c/code> can mutate captured variables but cannot escape as a stored function value. Read \u003ca href=\"borrowing.html\">ownership &amp; borrowing\u003c/a> before writing helpers that keep views into containers.\u003c/p>\n\u003ch2 id=\"records-and-choices\">Records and choices\u003ca class=\"heading-link\" href=\"#records-and-choices\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cp>Name the pieces of an edge instead of remembering what \u003ccode>first.second\u003c/code> means. Use an enum when the input describes one of several shapes, and \u003ccode>match\u003c/code> to handle each shape.\u003c/p>\n\u003cfigure class=\"code-block\">\u003cfigcaption>\u003cspan>CP Lang · design\u003c/span>\u003cbutton class=\"copy-button\" type=\"button\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/figcaption>\u003cpre tabindex=\"0\">\u003ccode>\u003cspan class=\"tok-keyword\">let\u003c/span> edges: [\u003cspan class=\"tok-type\">E\u003c/span>](u: \u003cspan class=\"tok-type\">V\u003c/span>, v: \u003cspan class=\"tok-type\">V\u003c/span>, w: \u003cspan class=\"tok-number\">1\u003c/span>..=\u003cspan class=\"tok-number\">1e9\u003c/span>) = read()\n\n\u003cspan class=\"tok-keyword\">enum\u003c/span> \u003cspan class=\"tok-type\">Move\u003c/span>:\n    \u003cspan class=\"tok-type\">Add\u003c/span>(v: \u003cspan class=\"tok-type\">V\u003c/span>, delta: \u003cspan class=\"tok-type\">Int\u003c/span>)\n    \u003cspan class=\"tok-type\">Ask\u003c/span>(l: \u003cspan class=\"tok-type\">V\u003c/span>, r: \u003cspan class=\"tok-type\">V\u003c/span>)\n\n\u003cspan class=\"tok-keyword\">match\u003c/span> move:\n    \u003cspan class=\"tok-type\">Add\u003c/span>(v, delta) =&gt; add_to(\u003cspan class=\"tok-keyword\">mut\u003c/span> a, v, delta)\n    \u003cspan class=\"tok-type\">Ask\u003c/span>(l, r) =&gt; print(range_sum(l, r))\u003c/code>\u003c/pre>\u003c/figure>\n\u003cp>This is a fragment: it assumes domains \u003ccode>V\u003c/code> and \u003ccode>E\u003c/code>, an array \u003ccode>a\u003c/code>, and the two helpers are already defined. The \u003ca href=\"https://github.com/ryanbai1412/cp-lang/blob/main/proto/ports/ccc21s2.cp\">Modern Art corpus port\u003c/a> uses this pattern for row and column strokes.\u003c/p>\n\u003ch2 id=\"a-few-c-habits-to-leave-behind\">A few C++ habits to leave behind\u003ca class=\"heading-link\" href=\"#a-few-c-habits-to-leave-behind\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cp>Write \u003ccode>and\u003c/code>, \u003ccode>or\u003c/code>, and \u003ccode>not\u003c/code> for logical operators. \u003ccode>..\u003c/code> excludes the end; \u003ccode>..=\u003c/code> includes it. A position plus an integer is deliberately ambiguous: choose \u003ccode>.next\u003c/code>, \u003ccode>.offset(k)\u003c/code>, or \u003ccode>.cyc(k)\u003c/code> depending on the edge behavior you want.\u003c/p>\n\u003cp>In the approved design, integer division is \u003ccode>/\u003c/code> and remainder is \u003ccode>%\u003c/code>, with Euclidean semantics. The remainder is always non-negative and smaller than the absolute divisor: \u003ccode>-7 / 3\u003c/code> is \u003ccode>-3\u003c/code>, \u003ccode>-7 % 3\u003c/code> is \u003ccode>2\u003c/code>, and \u003ccode>7 / -3\u003c/code> is \u003ccode>-2\u003c/code> with remainder \u003ccode>1\u003c/code>. Division by zero is an error. When operands are proven non-negative, the backend can use native C++ operations. \u003ccode>//\u003c/code> starts a line comment, not a division expression.\u003c/p>\n\u003ch2 id=\"program-structure\">Program structure\u003ca class=\"heading-link\" href=\"#program-structure\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cp>Use top-level code for the solution's flow and functions for parts you want to test alone. A top-level \u003ccode>return\u003c/code> ends the program, or the current case under \u003ccode>@multitest\u003c/code>. The decorator is library-level contest behavior, not a special kind of program body.\u003c/p>\n\u003cfigure class=\"code-block\">\u003cfigcaption>\u003cspan>CP Lang · design\u003c/span>\u003cbutton class=\"copy-button\" type=\"button\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/figcaption>\u003cpre tabindex=\"0\">\u003ccode>\u003cspan class=\"tok-decorator\">@multitest\u003c/span>(sum: n &lt;= \u003cspan class=\"tok-number\">2e5\u003c/span>)\n\u003cspan class=\"tok-keyword\">let\u003c/span> n: \u003cspan class=\"tok-number\">1\u003c/span>..=\u003cspan class=\"tok-number\">2e5\u003c/span> = read()\n\u003cspan class=\"tok-keyword\">domain\u003c/span> \u003cspan class=\"tok-type\">V\u003c/span> = \u003cspan class=\"tok-number\">1\u003c/span>..=n\n\u003cspan class=\"tok-keyword\">let\u003c/span> a: [\u003cspan class=\"tok-type\">V\u003c/span>]\u003cspan class=\"tok-type\">Int\u003c/span> = read()\nprint(sum(a))\u003c/code>\u003c/pre>\u003c/figure>\n\u003cp>Each case gets fresh ordinary state. Expensive immutable precomputation can use \u003ccode>static let\u003c/code>. Library modules contain declarations rather than hidden top-level actions; importing a helper should not secretly read input or change state.\u003c/p>\n\u003c/article>\n      \u003cnav class=\"pager\" aria-label=\"Adjacent chapters\">\u003ca class=\"pager-previous\" href=\"getting-started.html\">\u003cspan>Previous ←\u003c/span>Getting started\u003c/a>\u003ca class=\"pager-next\" href=\"indices.html\">\u003cspan>Next →\u003c/span>Index spaces & bounds\u003c/a>\u003c/nav>\n      \u003cfooter class=\"page-footer\">\u003cspan>CP Lang · A language for competitive programming.\u003c/span>\u003ca href=\"https://github.com/ryanbai1412/cp-lang/blob/main/site/content/tour.md\">Edit this page ↗\u003c/a>\u003c/footer>\n    \u003c/main>\n    \u003caside class=\"right-rail\" aria-label=\"On this page\">\u003cdiv class=\"toc\">\u003cp>On this page\u003c/p>\u003ca href=\"#values-and-mutation\">Values and mutation\u003c/a>\u003ca href=\"#missing-is-a-value\">Missing is a value\u003c/a>\u003ca href=\"#functions-and-explicit-changes\">Functions and explicit changes\u003c/a>\u003ca href=\"#records-and-choices\">Records and choices\u003c/a>\u003ca href=\"#a-few-c-habits-to-leave-behind\">A few C++ habits to leave behind\u003c/a>\u003ca href=\"#program-structure\">Program structure\u003c/a>\u003ca class=\"source-link\" href=\"https://github.com/ryanbai1412/cp-lang/tree/main/plan\">Language design ↗\u003c/a>\u003c/div>\u003c/aside>\n  \u003c/div>\n  \u003cdialog class=\"search-dialog\" aria-labelledby=\"search-title\">\n    \u003cform method=\"dialog\" class=\"search-header\">\u003clabel id=\"search-title\" for=\"search-input\">Search the guide\u003c/label>\u003cbutton type=\"submit\" aria-label=\"Close search\">Esc\u003c/button>\u003c/form>\n    \u003cinput id=\"search-input\" type=\"search\" autocomplete=\"off\" placeholder=\"Try “boundaries” or “lends mut”…\" aria-controls=\"search-results\">\n    \u003cp id=\"search-status\" role=\"status\">Type to find a chapter or a concept.\u003c/p>\n    \u003cdiv id=\"search-results\">\u003c/div>\n    \u003cdiv class=\"search-footer\">\u003cspan>↑ ↓ navigate\u003c/span>\u003cspan>Enter to open\u003c/span>\u003c/div>\n  \u003c/dialog>\n\u003c/body>\n\u003c/html>\n","trace.html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cmeta name=\"color-scheme\" content=\"light\">\n\u003ctitle>CP Lang · Trace explorer\u003c/title>\n\u003cscript id=\"trace-theme-init\">\ntry{document.documentElement.dataset.theme=localStorage.getItem(\"cp-theme\")||(matchMedia(\"(prefers-color-scheme:dark)\").matches?\"dark\":\"light\");}catch(_){document.documentElement.dataset.theme=\"light\";}\n\u003c/script>\n\u003cstyle>\n/* shadcn/ui zinc surfaces; red is reserved for mismatches and errors. */\n:root{--paper:#ffffff;--surface:#ffffff;--ink:#18181b;--muted:#71717a;--line:#e4e4e7;--rail:#fafafa;--rail-muted:#71717a;--accent:#2563eb;--tint:#eff6ff;--lime:#18181b;--bad:#dc2626;--bad-bg:#fef2f2;--good-bg:#eff6ff;--subtle:#f4f4f5;--mono:\"JetBrains Mono\",\"SFMono-Regular\",Consolas,\"Liberation Mono\",monospace;--sans:Inter,-apple-system,BlinkMacSystemFont,\"Segoe UI\",sans-serif;color-scheme:light;}\n:root[data-theme=dark]{--paper:#09090b;--surface:#111113;--ink:#fafafa;--muted:#a1a1aa;--line:#27272a;--rail:#111113;--rail-muted:#a1a1aa;--accent:#60a5fa;--tint:#17233b;--lime:#fafafa;--bad:#f87171;--bad-bg:#2c1418;--good-bg:#17233b;--subtle:#18181b;color-scheme:dark;}\n*{box-sizing:border-box;}\nbody{margin:0;background:var(--paper);color:var(--ink);font:13px/1.5 var(--sans);}\nbutton,select,input{font:inherit;}\nbutton,select{cursor:pointer;}\nbutton{color:inherit;}\nbutton:disabled{opacity:.35;cursor:default;}\nbutton:focus-visible,select:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:4px;}\nbutton{border:0;background:none;}\nsvg{display:block;}\nh1,h2,h3,p{margin:0;}\nbutton:hover:not(:disabled){background:var(--tint);}\n.mono,code,kbd{font-family:var(--mono);font-variant-numeric:tabular-nums;}\n.eyebrow{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;}\n.muted{color:var(--muted);}\n.hidden,[hidden]{display:none!important;}\n.app{display:grid;grid-template-columns:218px minmax(0,1fr);min-height:100vh;}\n.sidebar{background:var(--rail);color:var(--ink);display:flex;flex-direction:column;padding:31px 20px 24px;position:sticky;top:0;height:100vh;gap:32px;}\n.brand{display:flex;align-items:center;gap:11px;font-size:18px;letter-spacing:-.04em;font-weight:700;padding:0 8px;}\n.brand-mark{width:29px;height:29px;color:var(--lime);}\n.brand small{display:block;color:var(--rail-muted);font-size:9px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;margin-top:1px;}\n.sidebar .eyebrow{color:var(--rail-muted);padding:0 12px;margin-bottom:15px;}\n.sample-list{display:flex;flex-direction:column;gap:7px;}\n.sample{color:var(--rail-muted);display:flex;text-align:left;width:100%;gap:12px;align-items:center;padding:12px;border-radius:5px;font-size:11px;line-height:1.4;}\n.sample:hover:not(:disabled){background:var(--subtle);color:#fff;}\n.sample[aria-current=true]{background:var(--lime);color:var(--ink);}\n.sample-icon{width:20px;height:20px;flex-sh
