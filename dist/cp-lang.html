<script id="offline-data" type="application/json">{"pages":{"borrowing.html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"description\" content=\"Temporary access, without lifetime annotations. Learn CP Lang with concrete examples for competitive programmers.\">\n  \u003cmeta name=\"color-scheme\" content=\"light dark\">\n  \u003ctitle>Ownership &amp; borrowing — CP Lang\u003c/title>\n  \n  \u003clink rel=\"stylesheet\" href=\"assets/style.css\">\n  \u003cscript src=\"assets/theme.js\">\u003c/script>\n  \u003cscript src=\"assets/app.js\" defer>\u003c/script>\n\n\u003c/head>\n\u003cbody class=\"chapter\">\n  \u003ca href=\"#main\" class=\"skip-link\">Skip to content\u003c/a>\n  \u003cheader class=\"topbar\">\n    \u003ca class=\"brand\" href=\"index.html\" aria-label=\"CP Lang home\">\u003cspan class=\"brand-mark\" aria-hidden=\"true\">cp\u003c/span>\u003cspan>CP Lang\u003c/span>\u003c/a>\n    \u003cnav class=\"product-nav\" aria-label=\"Products\">\u003ca href=\"index.html\" aria-current=\"page\">Docs\u003c/a>\u003ca href=\"playground.html\" >Playground\u003c/a>\u003ca href=\"trace.html\">Trace\u003c/a>\u003c/nav>\n    \u003cdiv class=\"top-actions\">\n      \u003cbutton class=\"search-trigger\" type=\"button\" aria-label=\"Search the guide\" aria-haspopup=\"dialog\">\u003cspan class=\"search-icon\" aria-hidden=\"true\">\u003c/span>\u003cspan>Search documentation\u003c/span>\u003ckbd>/\u003c/kbd>\u003c/button>\n      \u003ca class=\"github-link\" href=\"https://github.com/ryanbai1412/cp-lang\">GitHub \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\n      \u003cbutton class=\"theme-toggle icon-button\" aria-label=\"Switch to dark theme\" type=\"button\">◐\u003c/button>\n      \u003cbutton class=\"menu-toggle icon-button\" aria-label=\"Open navigation\" aria-expanded=\"false\" aria-controls=\"sidebar\" type=\"button\">☰\u003c/button>\n    \u003c/div>\n  \u003c/header>\n  \u003cdiv class=\"layout\">\n    \u003caside class=\"sidebar\" id=\"sidebar\">\n      \u003ca class=\"edition\" href=\"getting-started.html#what-works-today\">\u003cspan class=\"status-dot\">\u003c/span> Development edition \u003cspan>0.0\u003c/span>\u003c/a>\n      \u003cnav aria-label=\"Guide chapters\">\u003cdiv class=\"nav-group\">\u003ch2>Start here\u003c/h2>\u003ca href=\"index.html\">\u003cspan class=\"nav-number\">00\u003c/span>Overview\u003c/a>\u003ca href=\"getting-started.html\">\u003cspan class=\"nav-number\">01\u003c/span>Getting started\u003c/a>\u003ca href=\"tour.html\">\u003cspan class=\"nav-number\">02\u003c/span>A quick language tour\u003c/a>\u003c/div>\u003cdiv class=\"nav-group\">\u003ch2>The language\u003c/h2>\u003ca href=\"indices.html\">\u003cspan class=\"nav-number\">03\u003c/span>Index spaces &amp; bounds\u003c/a>\u003ca href=\"borrowing.html\" aria-current=\"page\">\u003cspan class=\"nav-number\">04\u003c/span>Ownership &amp; borrowing\u003c/a>\u003ca href=\"strings.html\">\u003cspan class=\"nav-number\">05\u003c/span>ASCII strings\u003c/a>\u003c/div>\u003cdiv class=\"nav-group\">\u003ch2>In practice\u003c/h2>\u003ca href=\"testing.html\">\u003cspan class=\"nav-number\">06\u003c/span>Memoization &amp; stress tests\u003c/a>\u003ca href=\"stdlib.html\">\u003cspan class=\"nav-number\">07\u003c/span>The standard library\u003c/a>\u003c/div>\u003c/nav>\n      \u003cdiv class=\"sidebar-footer\">CP Lang · Development\u003ca href=\"https://github.com/ryanbai1412/cp-lang/blob/main/decisions.md\">Design decisions ↗\u003c/a>\u003c/div>\n    \u003c/aside>\n    \u003cmain id=\"main\" tabindex=\"-1\">\n      \u003cdiv class=\"breadcrumb\">\u003cspan>The language\u003c/span>\u003cspan aria-hidden=\"true\">/\u003c/span>\u003cspan>Ownership &amp; borrowing\u003c/span>\u003c/div>\n      \u003cdiv class=\"page-meta\">\u003cspan>THE CP LANG GUIDE\u003c/span>\u003cspan>04 \u003cspan aria-hidden=\"true\">/\u003c/span> 9 min read\u003c/span>\u003c/div>\n      \u003cdiv class=\"chapter-title\">\u003ch1>Ownership &amp; borrowing\u003c/h1>\u003cp>Temporary access, without lifetime annotations.\u003c/p>\u003c/div>\n      \u003carticle>\u003cp>Variables own their values. Function parameters borrow them for the call. A projection lets a caller work on part of a value—a row, a slice, or an element—without allocating a copy or keeping a reference for later.\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>Approved design, partially prototyped.\u003c/strong> The Python prototype implements struct projections with \u003ccode>lends\u003c/code>, \u003ccode>lend\u003c/code>, and \u003ccode>law disjoint\u003c/code>, plus lexical checks for slices and rows. Generic library implementations and the full checker remain work in progress. The fragments below explain the design; \u003ca href=\"https://github.com/ryanbai1412/cp-lang/blob/main/proto/tests/lend/projection.cp\">runnable projection tests\u003c/a> show the supported subset and the \u003ca href=\"https://github.com/ryanbai1412/cp-lang/blob/main/plan/19-index-and-lends.md#11-what-the-prototype-does-today\">implementation notes\u003c/a> state its limits.\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"own-it-borrow-it-or-copy-it\">Own it, borrow it, or copy it\u003ca class=\"heading-link\" href=\"#own-it-borrow-it-or-copy-it\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cfigure class=\"code-block\">\u003cfigcaption>\u003cspan>CP Lang · design fragment\u003c/span>\u003cbutton class=\"copy-button\" type=\"button\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/figcaption>\u003cpre tabindex=\"0\">\u003ccode>\u003cspan class=\"tok-keyword\">fn\u003c/span> total(a: [\u003cspan class=\"tok-type\">V\u003c/span>]\u003cspan class=\"tok-type\">Int\u003c/span>) -&gt; \u003cspan class=\"tok-type\">Int\u003c/span>:\n    sum(a)\n\n\u003cspan class=\"tok-keyword\">fn\u003c/span> bump(\u003cspan class=\"tok-keyword\">mut\u003c/span> a: [\u003cspan class=\"tok-type\">V\u003c/span>]\u003cspan class=\"tok-type\">Int\u003c/span>, v: \u003cspan class=\"tok-type\">V\u003c/span>):\n    a[v] += \u003cspan class=\"tok-number\">1\u003c/span>\n\nprint(total(a))         \u003cspan class=\"tok-comment\">// read-only borrow, no array copy\u003c/span>\nbump(\u003cspan class=\"tok-keyword\">mut\u003c/span> a, \u003cspan class=\"tok-type\">V\u003c/span>.first)   \u003cspan class=\"tok-comment\">// mutable borrow, explicit at both ends\u003c/span>\n\u003cspan class=\"tok-keyword\">let\u003c/span> saved = a.copy()   \u003cspan class=\"tok-comment\">// an owned copy, explicit cost\u003c/span>\u003c/code>\u003c/pre>\u003c/figure>\n\u003cp>While a place is borrowed mutably, other code cannot read or write the same place. Multiple read-only borrows are fine. Separate struct fields can be borrowed separately; overlapping container accesses need more evidence.\u003c/p>\n\u003ch2 id=\"a-projection-lends-a-place\">A projection lends a place\u003ca class=\"heading-link\" href=\"#a-projection-lends-a-place\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cp>An ordinary function uses \u003ccode>-&gt;\u003c/code> to return an owned value. A projection uses \u003ccode>lends\u003c/code> to give temporary access to a place in its receiver, and \u003ccode>lend\u003c/code> in its body to identify that place.\u003c/p>\n\u003cfigure class=\"code-block\">\u003cfigcaption>\u003cspan>Library implementation · design fragment\u003c/span>\u003cbutton class=\"copy-button\" type=\"button\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/figcaption>\u003cpre tabindex=\"0\">\u003ccode>\u003cspan class=\"tok-keyword\">impl\u003c/span> \u003cspan class=\"tok-type\">Array\u003c/span>&lt;(\u003cspan class=\"tok-type\">A\u003c/span>, \u003cspan class=\"tok-type\">B\u003c/span>), \u003cspan class=\"tok-type\">T\u003c/span>&gt;:\n    pub \u003cspan class=\"tok-keyword\">fn\u003c/span> row(self, r: \u003cspan class=\"tok-type\">A\u003c/span>) \u003cspan class=\"tok-keyword\">lends\u003c/span> \u003cspan class=\"tok-keyword\">mut\u003c/span> [\u003cspan class=\"tok-type\">B\u003c/span>]\u003cspan class=\"tok-type\">T\u003c/span>:\n        \u003cspan class=\"tok-keyword\">law\u003c/span> disjoint(r, q) = r != q\n        lend \u003cspan class=\"tok-keyword\">mut\u003c/span> \u003cspan class=\"tok-type\">Array\u003c/span>&lt;\u003cspan class=\"tok-type\">B\u003c/span>, \u003cspan class=\"tok-type\">T\u003c/span>&gt;(buf.part(r.to_idx * \u003cspan class=\"tok-type\">B\u003c/span>.\u003cspan class=\"tok-type\">K\u003c/span>, \u003cspan class=\"tok-type\">B\u003c/span>.\u003cspan class=\"tok-type\">K\u003c/span>))\u003c/code>\u003c/pre>\u003c/figure>\n\u003cp>This library fragment assumes the array's private buffer \u003ccode>buf\u003c/code> and index types \u003ccode>A\u003c/code> and \u003ccode>B\u003c/code>. It lends a contiguous row; it does not copy the row's elements. \u003ccode>lends T\u003c/code> only permits reading. \u003ccode>lends mut T\u003c/code> permits mutation when the caller holds the receiver mutably and the use asks for mutation. It does not turn a read-only receiver into a mutable one.\u003c/p>\n\u003cfigure class=\"code-block\">\u003cfigcaption>\u003cspan>CP Lang · design fragment\u003c/span>\u003cbutton class=\"copy-button\" type=\"button\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/figcaption>\u003cpre tabindex=\"0\">\u003ccode>\u003cspan class=\"tok-keyword\">let\u003c/span> row = grid.row(r)\nprint(sum(row))\u003c/code>\u003c/pre>\u003c/figure>\n\u003cp>The local \u003ccode>row\u003c/code> is temporary access to \u003ccode>grid\u003c/code>, not an owner. A mutating use such as \u003ccode>grid.row(r).sort()\u003c/code> holds the corresponding mutable lend for that statement.\u003c/p>\n\u003ch2 id=\"why-there-are-no-lifetime-annotations\">Why there are no lifetime annotations\u003ca class=\"heading-link\" href=\"#why-there-are-no-lifetime-annotations\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cp>CP Lang does not ask you to name how long references live. It restricts where a borrow can go instead. A lent value may be a local \u003ccode>let\u003c/code>, an argument, an inline use, or a loop's temporary value. It cannot escape into an owning field, a container, a \u003ccode>var\u003c/code>, a stored non-inline closure, or an ordinary return value.\u003c/p>\n\u003cp>The implementation model is an \u003ccode>inline\u003c/code> callback: a projection runs the caller's use of the lent place while the owner is still available. Binding a lend to \u003ccode>let\u003c/code> puts the rest of that block inside the callback. The checker can see the whole use; there is no returned reference whose lifetime must be related to some other reference.\u003c/p>\n\u003cp>That is the tradeoff, not a promise that arbitrary Rust borrowing works without annotations. Structures that must remember identity use plain indices or pool handles. Functions that find a useful window return a \u003ccode>Range&lt;V&gt;\u003c/code>, then the caller reopens \u003ccode>a[window]\u003c/code> when needed. If you truly want independent storage, ask for \u003ccode>.copy()\u003c/code>.\u003c/p>\n\u003cfigure class=\"code-block\">\u003cfigcaption>\u003cspan>CP Lang · design fragment\u003c/span>\u003cbutton class=\"copy-button\" type=\"button\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/figcaption>\u003cpre tabindex=\"0\">\u003ccode>\u003cspan class=\"tok-keyword\">let\u003c/span> window: \u003cspan class=\"tok-type\">Range\u003c/span>&lt;\u003cspan class=\"tok-type\">V\u003c/span>&gt; = find_window(a)  \u003cspan class=\"tok-comment\">// plain data: two boundaries\u003c/span>\n\u003cspan class=\"tok-keyword\">let\u003c/span> part = a[window]                   \u003cspan class=\"tok-comment\">// a lexical lend, used here\u003c/span>\nprint(sum(part))\n\u003cspan class=\"tok-keyword\">let\u003c/span> saved = part.copy()               \u003cspan class=\"tok-comment\">// owned data may escape\u003c/span>\u003c/code>\u003c/pre>\u003c/figure>\n\u003cp>\u003ccode>find_window\u003c/code> above is an ordinary user helper returning a range. It must not return a borrowed slice. Returning the recipe for access is simpler than returning access itself.\u003c/p>\n\u003ch2 id=\"prove-two-accesses-do-not-overlap\">Prove two accesses do not overlap\u003ca class=\"heading-link\" href=\"#prove-two-accesses-do-not-overlap\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cp>The array's element projection declares this law:\u003c/p>\n\u003cfigure class=\"code-block\">\u003cfigcaption>\u003cspan>Library contract · design fragment\u003c/span>\u003cbutton class=\"copy-button\" type=\"button\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/figcaption>\u003cpre tabindex=\"0\">\u003ccode>\u003cspan class=\"tok-keyword\">fn\u003c/span> at(self, i: \u003cspan class=\"tok-type\">I\u003c/span>) \u003cspan class=\"tok-keyword\">lends\u003c/span> \u003cspan class=\"tok-keyword\">mut\u003c/span> \u003cspan class=\"tok-type\">T\u003c/span>:\n    \u003cspan class=\"tok-keyword\">law\u003c/span> disjoint(i, j) = i != j\n    \u003cspan class=\"tok-comment\">// implementation lends the element at i\u003c/span>\u003c/code>\u003c/pre>\u003c/figure>\n\u003cp>The law says when two lends through that same projection are separate. It does not assert that every call is safe. The checker must prove the condition at the call site.\u003c/p>\n\u003cfigure class=\"code-block\">\u003cfigcaption>\u003cspan>CP Lang · design fragment\u003c/span>\u003cbutton class=\"copy-button\" type=\"button\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/figcaption>\u003cpre tabindex=\"0\">\u003ccode>\u003cspan class=\"tok-keyword\">if\u003c/span> i != j:\n    merge_into(\u003cspan class=\"tok-keyword\">mut\u003c/span> counts[i], counts[j])\u003c/code>\u003c/pre>\u003c/figure>\n\u003cp>Without the guard or another proof of \u003ccode>i != j\u003c/code>, the two elements might alias, so a mutable access and a read cannot coexist. An explicit \u003ccode>assert i != j\u003c/code> is another way to establish the condition. Index arguments are evaluated before lending begins, so the proof is about fixed argument values, not indices that might change halfway through the call.\u003c/p>\n\u003cp>For two ranges, the law is that one ends before the other begins: \u003ccode>s.hi &lt;= t.lo or t.hi &lt;= s.lo\u003c/code>. Adjacent halves can therefore be lent separately:\u003c/p>\n\u003cfigure class=\"code-block\">\u003cfigcaption>\u003cspan>CP Lang · design fragment\u003c/span>\u003cbutton class=\"copy-button\" type=\"button\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/figcaption>\u003cpre tabindex=\"0\">\u003ccode>solve(\u003cspan class=\"tok-keyword\">mut\u003c/span> a[l.l..m.l], \u003cspan class=\"tok-keyword\">mut\u003c/span> a[m.l..r.r])\u003c/code>\u003c/pre>\u003c/figure>\n\u003cp>The law applies to two calls of the \u003cstrong>same projection\u003c/strong> on the \u003cstrong>same receiver\u003c/strong>. Different operations do not automatically become disjoint: a row and a column may cross even when their arguments look different.\u003c/p>\n\u003ch2 id=\"keep-the-owner-obvious\">Keep the owner obvious\u003ca class=\"heading-link\" href=\"#keep-the-owner-obvious\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cp>A lent row cannot be saved as the “best row so far” in a variable outside the loop. Save its index, then call \u003ccode>grid.row(best_r)\u003c/code> later, or keep a deliberate copy. A generator-lent value lasts for one iteration, not forever. These restrictions keep both mutation and performance visible at the use site.\u003c/p>\n\u003cp>There are no user-visible pointer arithmetic tricks here. The intended primitive is a checked \u003ccode>Buffer.part\u003c/code>; arrays, slices, grids, and strings build their projections from it. An ordinary library can provide the same borrowing behavior as the standard one.\u003c/p>\n\u003c/article>\n      \u003cnav class=\"pager\" aria-label=\"Adjacent chapters\">\u003ca class=\"pager-previous\" href=\"indices.html\">\u003cspan>Previous ←\u003c/span>Index spaces & bounds\u003c/a>\u003ca class=\"pager-next\" href=\"strings.html\">\u003cspan>Next →\u003c/span>ASCII strings\u003c/a>\u003c/nav>\n      \u003cfooter class=\"page-footer\">\u003cspan>CP Lang · A language for competitive programming.\u003c/span>\u003ca href=\"https://github.com/ryanbai1412/cp-lang/blob/main/site/content/borrowing.md\">Edit this page ↗\u003c/a>\u003c/footer>\n    \u003c/main>\n    \u003caside class=\"right-rail\" aria-label=\"On this page\">\u003cdiv class=\"toc\">\u003cp>On this page\u003c/p>\u003ca href=\"#own-it-borrow-it-or-copy-it\">Own it, borrow it, or copy it\u003c/a>\u003ca href=\"#a-projection-lends-a-place\">A projection lends a place\u003c/a>\u003ca href=\"#why-there-are-no-lifetime-annotations\">Why there are no lifetime annotations\u003c/a>\u003ca href=\"#prove-two-accesses-do-not-overlap\">Prove two accesses do not overlap\u003c/a>\u003ca href=\"#keep-the-owner-obvious\">Keep the owner obvious\u003c/a>\u003ca class=\"source-link\" href=\"https://github.com/ryanbai1412/cp-lang/tree/main/plan\">Language design ↗\u003c/a>\u003c/div>\u003c/aside>\n  \u003c/div>\n  \u003cdialog class=\"search-dialog\" aria-labelledby=\"search-title\">\n    \u003cform method=\"dialog\" class=\"search-header\">\u003clabel id=\"search-title\" for=\"search-input\">Search the guide\u003c/label>\u003cbutton type=\"submit\" aria-label=\"Close search\">Esc\u003c/button>\u003c/form>\n    \u003cinput id=\"search-input\" type=\"search\" autocomplete=\"off\" placeholder=\"Try “boundaries” or “lends mut”…\" aria-controls=\"search-results\">\n    \u003cp id=\"search-status\" role=\"status\">Type to find a chapter or a concept.\u003c/p>\n    \u003cdiv id=\"search-results\">\u003c/div>\n    \u003cdiv class=\"search-footer\">\u003cspan>↑ ↓ navigate\u003c/span>\u003cspan>Enter to open\u003c/span>\u003c/div>\n  \u003c/dialog>\n\u003c/body>\n\u003c/html>\n","getting-started.html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"description\" content=\"Install the CLI and run a prototype example. Learn CP Lang with concrete examples for competitive programmers.\">\n  \u003cmeta name=\"color-scheme\" content=\"light dark\">\n  \u003ctitle>Getting started — CP Lang\u003c/title>\n  \n  \u003clink rel=\"stylesheet\" href=\"assets/style.css\">\n  \u003cscript src=\"assets/theme.js\">\u003c/script>\n  \u003cscript src=\"assets/app.js\" defer>\u003c/script>\n\n\u003c/head>\n\u003cbody class=\"chapter\">\n  \u003ca href=\"#main\" class=\"skip-link\">Skip to content\u003c/a>\n  \u003cheader class=\"topbar\">\n    \u003ca class=\"brand\" href=\"index.html\" aria-label=\"CP Lang home\">\u003cspan class=\"brand-mark\" aria-hidden=\"true\">cp\u003c/span>\u003cspan>CP Lang\u003c/span>\u003c/a>\n    \u003cnav class=\"product-nav\" aria-label=\"Products\">\u003ca href=\"index.html\" aria-current=\"page\">Docs\u003c/a>\u003ca href=\"playground.html\" >Playground\u003c/a>\u003ca href=\"trace.html\">Trace\u003c/a>\u003c/nav>\n    \u003cdiv class=\"top-actions\">\n      \u003cbutton class=\"search-trigger\" type=\"button\" aria-label=\"Search the guide\" aria-haspopup=\"dialog\">\u003cspan class=\"search-icon\" aria-hidden=\"true\">\u003c/span>\u003cspan>Search documentation\u003c/span>\u003ckbd>/\u003c/kbd>\u003c/button>\n      \u003ca class=\"github-link\" href=\"https://github.com/ryanbai1412/cp-lang\">GitHub \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\n      \u003cbutton class=\"theme-toggle icon-button\" aria-label=\"Switch to dark theme\" type=\"button\">◐\u003c/button>\n      \u003cbutton class=\"menu-toggle icon-button\" aria-label=\"Open navigation\" aria-expanded=\"false\" aria-controls=\"sidebar\" type=\"button\">☰\u003c/button>\n    \u003c/div>\n  \u003c/header>\n  \u003cdiv class=\"layout\">\n    \u003caside class=\"sidebar\" id=\"sidebar\">\n      \u003ca class=\"edition\" href=\"getting-started.html#what-works-today\">\u003cspan class=\"status-dot\">\u003c/span> Development edition \u003cspan>0.0\u003c/span>\u003c/a>\n      \u003cnav aria-label=\"Guide chapters\">\u003cdiv class=\"nav-group\">\u003ch2>Start here\u003c/h2>\u003ca href=\"index.html\">\u003cspan class=\"nav-number\">00\u003c/span>Overview\u003c/a>\u003ca href=\"getting-started.html\" aria-current=\"page\">\u003cspan class=\"nav-number\">01\u003c/span>Getting started\u003c/a>\u003ca href=\"tour.html\">\u003cspan class=\"nav-number\">02\u003c/span>A quick language tour\u003c/a>\u003c/div>\u003cdiv class=\"nav-group\">\u003ch2>The language\u003c/h2>\u003ca href=\"indices.html\">\u003cspan class=\"nav-number\">03\u003c/span>Index spaces &amp; bounds\u003c/a>\u003ca href=\"borrowing.html\">\u003cspan class=\"nav-number\">04\u003c/span>Ownership &amp; borrowing\u003c/a>\u003ca href=\"strings.html\">\u003cspan class=\"nav-number\">05\u003c/span>ASCII strings\u003c/a>\u003c/div>\u003cdiv class=\"nav-group\">\u003ch2>In practice\u003c/h2>\u003ca href=\"testing.html\">\u003cspan class=\"nav-number\">06\u003c/span>Memoization &amp; stress tests\u003c/a>\u003ca href=\"stdlib.html\">\u003cspan class=\"nav-number\">07\u003c/span>The standard library\u003c/a>\u003c/div>\u003c/nav>\n      \u003cdiv class=\"sidebar-footer\">CP Lang · Development\u003ca href=\"https://github.com/ryanbai1412/cp-lang/blob/main/decisions.md\">Design decisions ↗\u003c/a>\u003c/div>\n    \u003c/aside>\n    \u003cmain id=\"main\" tabindex=\"-1\">\n      \u003cdiv class=\"breadcrumb\">\u003cspan>Start here\u003c/span>\u003cspan aria-hidden=\"true\">/\u003c/span>\u003cspan>Getting started\u003c/span>\u003c/div>\n      \u003cdiv class=\"page-meta\">\u003cspan>THE CP LANG GUIDE\u003c/span>\u003cspan>01 \u003cspan aria-hidden=\"true\">/\u003c/span> 5 min read\u003c/span>\u003c/div>\n      \u003cdiv class=\"chapter-title\">\u003ch1>Getting started\u003c/h1>\u003cp>Install the CLI and run a prototype example.\u003c/p>\u003c/div>\n      \u003carticle>\u003cp>You need Git, Python 3, a recent stable Rust toolchain, and a C++17 compiler (\u003ccode>g++\u003c/code> for the commands below). The repository is currently private, so cloning requires repository access. No packaged installer or stable release is available yet.\u003c/p>\n\u003ch2 id=\"install-the-development-cli\">Install the development CLI\u003ca class=\"heading-link\" href=\"#install-the-development-cli\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cfigure class=\"code-block\">\u003cfigcaption>\u003cspan>Terminal\u003c/span>\u003cbutton class=\"copy-button\" type=\"button\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/figcaption>\u003cpre tabindex=\"0\">\u003ccode>git clone https://github.com/ryanbai1412/cp-lang.git\ncd cp-lang\ncargo test\ncargo install --path crates/cpl-cli\ncpl --version\ncpl --help\u003c/code>\u003c/pre>\u003c/figure>\n\u003cp>The executable is \u003ccode>cpl\u003c/code>, not \u003ccode>cp\u003c/code>: \u003ccode>cp\u003c/code> already copies files on Unix. Source files use the \u003ccode>.cp\u003c/code> extension. Cargo normally installs the executable in \u003ccode>~/.cargo/bin\u003c/code>; make sure that directory is on your \u003ccode>PATH\u003c/code>.\u003c/p>\n\u003ch2 id=\"your-first-program\">Your first program\u003ca class=\"heading-link\" href=\"#your-first-program\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cp>Save this as \u003ccode>sum.cp\u003c/code>. A program is a function body: top-level statements run in order, with no \u003ccode>main\u003c/code> wrapper or include list.\u003c/p>\n\u003cfigure class=\"code-block\">\u003cfigcaption>\u003cspan>sum.cp · prototype tested\u003c/span>\u003cbutton class=\"copy-button\" type=\"button\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/figcaption>\u003cpre tabindex=\"0\">\u003ccode>\u003cspan class=\"tok-keyword\">let\u003c/span> n: \u003cspan class=\"tok-number\">1\u003c/span>..=\u003cspan class=\"tok-number\">2e5\u003c/span> = read()\n\u003cspan class=\"tok-keyword\">domain\u003c/span> \u003cspan class=\"tok-type\">V\u003c/span> = \u003cspan class=\"tok-number\">1\u003c/span>..=n\n\u003cspan class=\"tok-keyword\">let\u003c/span> a: [\u003cspan class=\"tok-type\">V\u003c/span>]\u003cspan class=\"tok-type\">Int\u003c/span> = read()\nprint(sum(a))\u003c/code>\u003c/pre>\u003c/figure>\n\u003cp>\u003ccode>let\u003c/code> binds a value you will not reassign. The type on \u003ccode>n\u003c/code> gives its permitted range. \u003ccode>domain V\u003c/code> makes a fresh type for the positions \u003ccode>1\u003c/code> through \u003ccode>n\u003c/code>; \u003ccode>[V]Int\u003c/code> has one integer per position. \u003ccode>sum\u003c/code> consumes the elements, not their labels.\u003c/p>\n\u003cp>Input:\u003c/p>\n\u003cfigure class=\"code-block\">\u003cfigcaption>\u003cspan>Output\u003c/span>\u003cbutton class=\"copy-button\" type=\"button\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/figcaption>\u003cpre tabindex=\"0\">\u003ccode>5\n3 1 4 1 5\u003c/code>\u003c/pre>\u003c/figure>\n\u003cp>Output:\u003c/p>\n\u003cfigure class=\"code-block\">\u003cfigcaption>\u003cspan>Output\u003c/span>\u003cbutton class=\"copy-button\" type=\"button\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/figcaption>\u003cpre tabindex=\"0\">\u003ccode>14\u003c/code>\u003c/pre>\u003c/figure>\n\u003ch2 id=\"run-it-today\">Run it today\u003ca class=\"heading-link\" href=\"#run-it-today\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cp>The Rust interpreter and C++ backend are not implemented yet. Use the Python prototype to produce a real C++17 program:\u003c/p>\n\u003cfigure class=\"code-block\">\u003cfigcaption>\u003cspan>Terminal\u003c/span>\u003cbutton class=\"copy-button\" type=\"button\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/figcaption>\u003cpre tabindex=\"0\">\u003ccode>python3 proto/cp.py build sum.cp\ng++ -std=c++17 -O2 sum.cpp -o sum\nprintf &#x27;5\\n3 1 4 1 5\\n&#x27; | ./sum\u003c/code>\u003c/pre>\u003c/figure>\n\u003cp>The prototype writes \u003ccode>sum.cpp\u003c/code> beside the source and adds a compiler stamp to \u003ccode>sum.cp\u003c/code>. Work on your own files, not a tracked corpus port. \u003ccode>sum.cpp\u003c/code> is the file you would submit, not the \u003ccode>.cp\u003c/code> source.\u003c/p>\n\u003ch2 id=\"what-works-today\">What works today\u003ca class=\"heading-link\" href=\"#what-works-today\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cp>\u003ccode>cpl check sum.cp\u003c/code> runs the shared Rust frontend and reports the subset of syntax and type errors it understands. A clean check is not proof that a design-only feature is implemented. \u003ccode>cpl lsp\u003c/code> speaks the language server protocol over stdio for editor integrations.\u003c/p>\n\u003cp>\u003ccode>cpl run sum.cp\u003c/code> and \u003ccode>cpl build sum.cp\u003c/code> currently check the input and then report that their backends are not built. They do not execute or emit C++ yet. The prototype implements more of the language, but is also partial; use the labeled examples in this guide as a starting point.\u003c/p>\n\u003ch2 id=\"the-intended-contest-loop\">The intended contest loop\u003ca class=\"heading-link\" href=\"#the-intended-contest-loop\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cp>These are \u003cstrong>planned Rust CLI workflows\u003c/strong>, not commands to rely on today:\u003c/p>\n\u003cfigure class=\"code-block\">\u003cfigcaption>\u003cspan>Planned workflow · not implemented in the Rust CLI\u003c/span>\u003cbutton class=\"copy-button\" type=\"button\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/figcaption>\u003cpre tabindex=\"0\">\u003ccode>cpl run d.cp i1\ncpl run d.cp --release\ncpl test d.cp\ncpl stress d.cp\ncpl build d.cp\ncpl doc std\u003c/code>\u003c/pre>\u003c/figure>\n\u003cp>The target is a fast debug interpreter, stress cases generated from typed input, and one bundled C++17 file with a 64 KB submission-size gate. Local library code should be tested and documented with the same \u003ccode>test\u003c/code> and \u003ccode>doc\u003c/code> commands as the standard library. Until those commands land, follow the \u003ca href=\"testing.html#stress-a-real-port-today\">working prototype stress recipe\u003c/a>.\u003c/p>\n\u003c/article>\n      \u003cnav class=\"pager\" aria-label=\"Adjacent chapters\">\u003ca class=\"pager-previous\" href=\"index.html\">\u003cspan>Previous ←\u003c/span>Overview\u003c/a>\u003ca class=\"pager-next\" href=\"tour.html\">\u003cspan>Next →\u003c/span>A quick language tour\u003c/a>\u003c/nav>\n      \u003cfooter class=\"page-footer\">\u003cspan>CP Lang · A language for competitive programming.\u003c/span>\u003ca href=\"https://github.com/ryanbai1412/cp-lang/blob/main/site/content/getting-started.md\">Edit this page ↗\u003c/a>\u003c/footer>\n    \u003c/main>\n    \u003caside class=\"right-rail\" aria-label=\"On this page\">\u003cdiv class=\"toc\">\u003cp>On this page\u003c/p>\u003ca href=\"#install-the-development-cli\">Install the development CLI\u003c/a>\u003ca href=\"#your-first-program\">Your first program\u003c/a>\u003ca href=\"#run-it-today\">Run it today\u003c/a>\u003ca href=\"#what-works-today\">What works today\u003c/a>\u003ca href=\"#the-intended-contest-loop\">The intended contest loop\u003c/a>\u003ca class=\"source-link\" href=\"https://github.com/ryanbai1412/cp-lang/tree/main/plan\">Language design ↗\u003c/a>\u003c/div>\u003c/aside>\n  \u003c/div>\n  \u003cdialog class=\"search-dialog\" aria-labelledby=\"search-title\">\n    \u003cform method=\"dialog\" class=\"search-header\">\u003clabel id=\"search-title\" for=\"search-input\">Search the guide\u003c/label>\u003cbutton type=\"submit\" aria-label=\"Close search\">Esc\u003c/button>\u003c/form>\n    \u003cinput id=\"search-input\" type=\"search\" autocomplete=\"off\" placeholder=\"Try “boundaries” or “lends mut”…\" aria-controls=\"search-results\">\n    \u003cp id=\"search-status\" role=\"status\">Type to find a chapter or a concept.\u003c/p>\n    \u003cdiv id=\"search-results\">\u003c/div>\n    \u003cdiv class=\"search-footer\">\u003cspan>↑ ↓ navigate\u003c/span>\u003cspan>Enter to open\u003c/span>\u003c/div>\n  \u003c/dialog>\n\u003c/body>\n\u003c/html>\n","index.html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"description\" content=\"A competitive-programming language targeting C++17. Learn CP Lang with concrete examples for competitive programmers.\">\n  \u003cmeta name=\"color-scheme\" content=\"light dark\">\n  \u003ctitle>Overview — CP Lang\u003c/title>\n  \n  \u003clink rel=\"stylesheet\" href=\"assets/style.css\">\n  \u003cscript src=\"assets/theme.js\">\u003c/script>\n  \u003cscript src=\"assets/app.js\" defer>\u003c/script>\n\n\u003c/head>\n\u003cbody class=\"overview\">\n  \u003ca href=\"#main\" class=\"skip-link\">Skip to content\u003c/a>\n  \u003cheader class=\"topbar\">\n    \u003ca class=\"brand\" href=\"index.html\" aria-label=\"CP Lang home\">\u003cspan class=\"brand-mark\" aria-hidden=\"true\">cp\u003c/span>\u003cspan>CP Lang\u003c/span>\u003c/a>\n    \u003cnav class=\"product-nav\" aria-label=\"Products\">\u003ca href=\"index.html\" aria-current=\"page\">Docs\u003c/a>\u003ca href=\"playground.html\" >Playground\u003c/a>\u003ca href=\"trace.html\">Trace\u003c/a>\u003c/nav>\n    \u003cdiv class=\"top-actions\">\n      \u003cbutton class=\"search-trigger\" type=\"button\" aria-label=\"Search the guide\" aria-haspopup=\"dialog\">\u003cspan class=\"search-icon\" aria-hidden=\"true\">\u003c/span>\u003cspan>Search documentation\u003c/span>\u003ckbd>/\u003c/kbd>\u003c/button>\n      \u003ca class=\"github-link\" href=\"https://github.com/ryanbai1412/cp-lang\">GitHub \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\n      \u003cbutton class=\"theme-toggle icon-button\" aria-label=\"Switch to dark theme\" type=\"button\">◐\u003c/button>\n      \u003cbutton class=\"menu-toggle icon-button\" aria-label=\"Open navigation\" aria-expanded=\"false\" aria-controls=\"sidebar\" type=\"button\">☰\u003c/button>\n    \u003c/div>\n  \u003c/header>\n  \u003cdiv class=\"layout\">\n    \u003caside class=\"sidebar\" id=\"sidebar\">\n      \u003ca class=\"edition\" href=\"getting-started.html#what-works-today\">\u003cspan class=\"status-dot\">\u003c/span> Development edition \u003cspan>0.0\u003c/span>\u003c/a>\n      \u003cnav aria-label=\"Guide chapters\">\u003cdiv class=\"nav-group\">\u003ch2>Start here\u003c/h2>\u003ca href=\"index.html\" aria-current=\"page\">\u003cspan class=\"nav-number\">00\u003c/span>Overview\u003c/a>\u003ca href=\"getting-started.html\">\u003cspan class=\"nav-number\">01\u003c/span>Getting started\u003c/a>\u003ca href=\"tour.html\">\u003cspan class=\"nav-number\">02\u003c/span>A quick language tour\u003c/a>\u003c/div>\u003cdiv class=\"nav-group\">\u003ch2>The language\u003c/h2>\u003ca href=\"indices.html\">\u003cspan class=\"nav-number\">03\u003c/span>Index spaces &amp; bounds\u003c/a>\u003ca href=\"borrowing.html\">\u003cspan class=\"nav-number\">04\u003c/span>Ownership &amp; borrowing\u003c/a>\u003ca href=\"strings.html\">\u003cspan class=\"nav-number\">05\u003c/span>ASCII strings\u003c/a>\u003c/div>\u003cdiv class=\"nav-group\">\u003ch2>In practice\u003c/h2>\u003ca href=\"testing.html\">\u003cspan class=\"nav-number\">06\u003c/span>Memoization &amp; stress tests\u003c/a>\u003ca href=\"stdlib.html\">\u003cspan class=\"nav-number\">07\u003c/span>The standard library\u003c/a>\u003c/div>\u003c/nav>\n      \u003cdiv class=\"sidebar-footer\">CP Lang · Development\u003ca href=\"https://github.com/ryanbai1412/cp-lang/blob/main/decisions.md\">Design decisions ↗\u003c/a>\u003c/div>\n    \u003c/aside>\n    \u003cmain id=\"main\" tabindex=\"-1\">\n      \u003cdiv class=\"breadcrumb\">\u003cspan>Start here\u003c/span>\u003cspan aria-hidden=\"true\">/\u003c/span>\u003cspan>Overview\u003c/span>\u003c/div>\n      \u003cdiv class=\"page-meta\">\u003cspan>THE CP LANG GUIDE\u003c/span>\u003cspan>00 \u003cspan aria-hidden=\"true\">/\u003c/span> 6 min read\u003c/span>\u003c/div>\n      \u003cdiv class=\"chapter-title\">\u003ch1>CP Lang documentation\u003c/h1>\u003cp>A competitive-programming language targeting C++17.\u003c/p>\u003c/div>\n      \u003carticle>\u003cp>CP Lang is a language for competitive programming that targets C++17. Keep the algorithms you know. Replace index arithmetic, sentinel values, and repeated bookkeeping with types that say what you mean.\u003c/p>\n\u003cp>Start with \u003ca href=\"getting-started.html\">your first program\u003c/a>, take the \u003ca href=\"tour.html\">language tour\u003c/a>, or go straight to \u003ca href=\"indices.html\">index spaces\u003c/a>.\u003c/p>\n\u003cfigure class=\"code-block\">\u003cfigcaption>\u003cspan>Prefix sums · the approved design\u003c/span>\u003cbutton class=\"copy-button\" type=\"button\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/figcaption>\u003cpre tabindex=\"0\">\u003ccode>\u003cspan class=\"tok-keyword\">let\u003c/span> n: \u003cspan class=\"tok-number\">1\u003c/span>..=\u003cspan class=\"tok-number\">2e5\u003c/span> = read()\n\u003cspan class=\"tok-keyword\">domain\u003c/span> \u003cspan class=\"tok-type\">V\u003c/span> = \u003cspan class=\"tok-number\">1\u003c/span>..=n\n\u003cspan class=\"tok-keyword\">let\u003c/span> a: [\u003cspan class=\"tok-type\">V\u003c/span>]\u003cspan class=\"tok-type\">Int\u003c/span> = read()\n\n\u003cspan class=\"tok-keyword\">var\u003c/span> pre: [\u003cspan class=\"tok-type\">V\u003c/span>.bounds]\u003cspan class=\"tok-type\">Int\u003c/span> = \u003cspan class=\"tok-number\">0\u003c/span>\n\u003cspan class=\"tok-keyword\">for\u003c/span> v \u003cspan class=\"tok-keyword\">in\u003c/span> \u003cspan class=\"tok-type\">V\u003c/span>:\n    pre[v.r] = pre[v.l] + a[v]\n\n\u003cspan class=\"tok-keyword\">fn\u003c/span> range_sum(l: \u003cspan class=\"tok-type\">V\u003c/span>, r: \u003cspan class=\"tok-type\">V\u003c/span>) -&gt; \u003cspan class=\"tok-type\">Int\u003c/span>:\n    pre[r.r] - pre[l.l]\u003c/code>\u003c/pre>\u003c/figure>\n\u003cp>An element has a boundary on its left, \u003ccode>.l\u003c/code>, and on its right, \u003ccode>.r\u003c/code>. Prefix sums live on those boundaries. There is no question of whether to allocate \u003ccode>n\u003c/code> or \u003ccode>n + 1\u003c/code>, or whether to subtract at \u003ccode>l - 1\u003c/code>.\u003c/p>\n\u003ch2 id=\"one-idea-fewer-special-cases\">One idea, fewer special cases\u003ca class=\"heading-link\" href=\"#one-idea-fewer-special-cases\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cp>A vertex, an edge, and a character position are all bounded indices. Arrays, grids, and strings use the same indexing mechanism. A row or a slice is temporary access to existing storage, not a hidden copy.\u003c/p>\n\u003cp>The language core stays small. Domains expand to sealed structs implementing \u003ccode>Index\u003c/code>. Containers and their projections are library code. You can understand the rules once, then use them in your own library.\u003c/p>\n\u003ch2 id=\"a-path-through-the-language\">A path through the language\u003ca class=\"heading-link\" href=\"#a-path-through-the-language\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003col>\n\u003cli>\u003ca href=\"getting-started.html\">Getting started\u003c/a> — install the development CLI and run a prototype example.\u003c/li>\n\u003cli>\u003ca href=\"tour.html\">A quick tour\u003c/a> — values, optional results, loops, functions, and program structure.\u003c/li>\n\u003cli>\u003ca href=\"indices.html\">Index spaces &amp; bounds\u003c/a> — put positions and the gaps between them in different types.\u003c/li>\n\u003cli>\u003ca href=\"borrowing.html\">Ownership &amp; borrowing\u003c/a> — use \u003ccode>lends\u003c/code>, not lifetime annotations.\u003c/li>\n\u003cli>\u003ca href=\"strings.html\">ASCII strings\u003c/a> — flat character arrays with their own index spaces.\u003c/li>\n\u003cli>\u003ca href=\"testing.html\">Memoization &amp; stress tests\u003c/a> — cache recurrences and compare fast code with a brute.\u003c/li>\n\u003cli>\u003ca href=\"stdlib.html\">The standard library\u003c/a> — reuse the familiar tools, or write your own.\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"know-what-you-can-run\">Know what you can run\u003ca class=\"heading-link\" href=\"#know-what-you-can-run\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cblockquote>\n\u003cp>\u003cstrong>Development edition.\u003c/strong> This guide describes the approved language design, not a finished release. Blocks marked \u003cstrong>prototype tested\u003c/strong> compile and run in the Python prototype. Blocks marked \u003cstrong>design\u003c/strong> explain the intended language and are not advertised as runnable. The Rust CLI currently checks a subset and serves the LSP; its run/build backends are not built yet.\u003c/p>\n\u003c/blockquote>\n\u003cp>The \u003ca href=\"getting-started.html#what-works-today\">getting-started chapter\u003c/a> separates working commands from the target workflow. There is no pretend Run button: examples run locally against the actual prototype. The \u003ca href=\"https://github.com/ryanbai1412/cp-lang/blob/main/decisions.md\">design decisions\u003c/a> and \u003ca href=\"https://github.com/ryanbai1412/cp-lang/tree/main/plan\">plan\u003c/a> explain the rationale and remaining work.\u003c/p>\n\u003c/article>\n      \u003cnav class=\"pager\" aria-label=\"Adjacent chapters\">\u003ca class=\"pager-next\" href=\"getting-started.html\">\u003cspan>Next →\u003c/span>Getting started\u003c/a>\u003c/nav>\n      \u003cfooter class=\"page-footer\">\u003cspan>CP Lang · A language for competitive programming.\u003c/span>\u003ca href=\"https://github.com/ryanbai1412/cp-lang/blob/main/site/content/index.md\">Edit this page ↗\u003c/a>\u003c/footer>\n    \u003c/main>\n    \u003caside class=\"right-rail\" aria-label=\"On this page\">\u003cdiv class=\"toc\">\u003cp>On this page\u003c/p>\u003ca href=\"#one-idea-fewer-special-cases\">One idea, fewer special cases\u003c/a>\u003ca href=\"#a-path-through-the-language\">A path through the language\u003c/a>\u003ca href=\"#know-what-you-can-run\">Know what you can run\u003c/a>\u003ca class=\"source-link\" href=\"https://github.com/ryanbai1412/cp-lang/tree/main/plan\">Language design ↗\u003c/a>\u003c/div>\u003c/aside>\n  \u003c/div>\n  \u003cdialog class=\"search-dialog\" aria-labelledby=\"search-title\">\n    \u003cform method=\"dialog\" class=\"search-header\">\u003clabel id=\"search-title\" for=\"search-input\">Search the guide\u003c/label>\u003cbutton type=\"submit\" aria-label=\"Close search\">Esc\u003c/button>\u003c/form>\n    \u003cinput id=\"search-input\" type=\"search\" autocomplete=\"off\" placeholder=\"Try “boundaries” or “lends mut”…\" aria-controls=\"search-results\">\n    \u003cp id=\"search-status\" role=\"status\">Type to find a chapter or a concept.\u003c/p>\n    \u003cdiv id=\"search-results\">\u003c/div>\n    \u003cdiv class=\"search-footer\">\u003cspan>↑ ↓ navigate\u003c/span>\u003cspan>Enter to open\u003c/span>\u003c/div>\n  \u003c/dialog>\n\u003c/body>\n\u003c/html>\n","indices.html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"description\" content=\"Typed positions, boundaries, and indexed containers. Learn CP Lang with concrete examples for competitive programmers.\">\n  \u003cmeta name=\"color-scheme\" content=\"light dark\">\n  \u003ctitle>Index spaces &amp; bounds — CP Lang\u003c/title>\n  \n  \u003clink rel=\"stylesheet\" href=\"assets/style.css\">\n  \u003cscript src=\"assets/theme.js\">\u003c/script>\n  \u003cscript src=\"assets/app.js\" defer>\u003c/script>\n\n\u003c/head>\n\u003cbody class=\"chapter\">\n  \u003ca href=\"#main\" class=\"skip-link\">Skip to content\u003c/a>\n  \u003cheader class=\"topbar\">\n    \u003ca class=\"brand\" href=\"index.html\" aria-label=\"CP Lang home\">\u003cspan class=\"brand-mark\" aria-hidden=\"true\">cp\u003c/span>\u003cspan>CP Lang\u003c/span>\u003c/a>\n    \u003cnav class=\"product-nav\" aria-label=\"Products\">\u003ca href=\"index.html\" aria-current=\"page\">Docs\u003c/a>\u003ca href=\"playground.html\" >Playground\u003c/a>\u003ca href=\"trace.html\">Trace\u003c/a>\u003c/nav>\n    \u003cdiv class=\"top-actions\">\n      \u003cbutton class=\"search-trigger\" type=\"button\" aria-label=\"Search the guide\" aria-haspopup=\"dialog\">\u003cspan class=\"search-icon\" aria-hidden=\"true\">\u003c/span>\u003cspan>Search documentation\u003c/span>\u003ckbd>/\u003c/kbd>\u003c/button>\n      \u003ca class=\"github-link\" href=\"https://github.com/ryanbai1412/cp-lang\">GitHub \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\n      \u003cbutton class=\"theme-toggle icon-button\" aria-label=\"Switch to dark theme\" type=\"button\">◐\u003c/button>\n      \u003cbutton class=\"menu-toggle icon-button\" aria-label=\"Open navigation\" aria-expanded=\"false\" aria-controls=\"sidebar\" type=\"button\">☰\u003c/button>\n    \u003c/div>\n  \u003c/header>\n  \u003cdiv class=\"layout\">\n    \u003caside class=\"sidebar\" id=\"sidebar\">\n      \u003ca class=\"edition\" href=\"getting-started.html#what-works-today\">\u003cspan class=\"status-dot\">\u003c/span> Development edition \u003cspan>0.0\u003c/span>\u003c/a>\n      \u003cnav aria-label=\"Guide chapters\">\u003cdiv class=\"nav-group\">\u003ch2>Start here\u003c/h2>\u003ca href=\"index.html\">\u003cspan class=\"nav-number\">00\u003c/span>Overview\u003c/a>\u003ca href=\"getting-started.html\">\u003cspan class=\"nav-number\">01\u003c/span>Getting started\u003c/a>\u003ca href=\"tour.html\">\u003cspan class=\"nav-number\">02\u003c/span>A quick language tour\u003c/a>\u003c/div>\u003cdiv class=\"nav-group\">\u003ch2>The language\u003c/h2>\u003ca href=\"indices.html\" aria-current=\"page\">\u003cspan class=\"nav-number\">03\u003c/span>Index spaces &amp; bounds\u003c/a>\u003ca href=\"borrowing.html\">\u003cspan class=\"nav-number\">04\u003c/span>Ownership &amp; borrowing\u003c/a>\u003ca href=\"strings.html\">\u003cspan class=\"nav-number\">05\u003c/span>ASCII strings\u003c/a>\u003c/div>\u003cdiv class=\"nav-group\">\u003ch2>In practice\u003c/h2>\u003ca href=\"testing.html\">\u003cspan class=\"nav-number\">06\u003c/span>Memoization &amp; stress tests\u003c/a>\u003ca href=\"stdlib.html\">\u003cspan class=\"nav-number\">07\u003c/span>The standard library\u003c/a>\u003c/div>\u003c/nav>\n      \u003cdiv class=\"sidebar-footer\">CP Lang · Development\u003ca href=\"https://github.com/ryanbai1412/cp-lang/blob/main/decisions.md\">Design decisions ↗\u003c/a>\u003c/div>\n    \u003c/aside>\n    \u003cmain id=\"main\" tabindex=\"-1\">\n      \u003cdiv class=\"breadcrumb\">\u003cspan>The language\u003c/span>\u003cspan aria-hidden=\"true\">/\u003c/span>\u003cspan>Index spaces &amp; bounds\u003c/span>\u003c/div>\n      \u003cdiv class=\"page-meta\">\u003cspan>THE CP LANG GUIDE\u003c/span>\u003cspan>03 \u003cspan aria-hidden=\"true\">/\u003c/span> 10 min read\u003c/span>\u003c/div>\n      \u003cdiv class=\"chapter-title\">\u003ch1>Index spaces &amp; bounds\u003c/h1>\u003cp>Typed positions, boundaries, and indexed containers.\u003c/p>\u003c/div>\n      \u003carticle>\u003cp>An integer tells you a number. An index also tells you what that number belongs to. Vertex \u003ccode>3\u003c/code> and edge \u003ccode>3\u003c/code> may print alike, but they should not be interchangeable when indexing arrays.\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>Approved design, partially prototyped.\u003c/strong> The Python prototype supports user \u003ccode>Index\u003c/code> types, \u003ccode>.l\u003c/code>/\u003ccode>.r\u003c/code> boundaries, and parent-indexed slices. The Rust checker does not yet implement this model. Library-level fragments remain design examples; see the \u003ca href=\"https://github.com/ryanbai1412/cp-lang/blob/main/plan/19-index-and-lends.md#11-what-the-prototype-does-today\">implementation limits\u003c/a>.\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"a-domain-is-a-fresh-type\">A domain is a fresh type\u003ca class=\"heading-link\" href=\"#a-domain-is-a-fresh-type\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cfigure class=\"code-block\">\u003cfigcaption>\u003cspan>CP Lang · design\u003c/span>\u003cbutton class=\"copy-button\" type=\"button\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/figcaption>\u003cpre tabindex=\"0\">\u003ccode>\u003cspan class=\"tok-keyword\">let\u003c/span> n: \u003cspan class=\"tok-number\">1\u003c/span>..=\u003cspan class=\"tok-number\">2e5\u003c/span> = read()\n\u003cspan class=\"tok-keyword\">let\u003c/span> m: \u003cspan class=\"tok-number\">1\u003c/span>..=\u003cspan class=\"tok-number\">2e5\u003c/span> = read()\n\u003cspan class=\"tok-keyword\">domain\u003c/span> \u003cspan class=\"tok-type\">V\u003c/span> = \u003cspan class=\"tok-number\">1\u003c/span>..=n\n\u003cspan class=\"tok-keyword\">domain\u003c/span> \u003cspan class=\"tok-type\">E\u003c/span> = \u003cspan class=\"tok-number\">1\u003c/span>..=m\n\u003cspan class=\"tok-keyword\">let\u003c/span> weights: [\u003cspan class=\"tok-type\">E\u003c/span>]\u003cspan class=\"tok-type\">Int\u003c/span> = read()\n\u003cspan class=\"tok-keyword\">var\u003c/span> degree: [\u003cspan class=\"tok-type\">V\u003c/span>]\u003cspan class=\"tok-type\">Int\u003c/span> = \u003cspan class=\"tok-number\">0\u003c/span>\u003c/code>\u003c/pre>\u003c/figure>\n\u003cp>\u003ccode>V\u003c/code> and \u003ccode>E\u003c/code> are different types even if \u003ccode>n == m\u003c/code>. You can index \u003ccode>degree\u003c/code> with a \u003ccode>V\u003c/code>, not an \u003ccode>E\u003c/code> or an arbitrary \u003ccode>Int\u003c/code>. Check or refine a number when it enters the domain; do not repeat that check at every array access.\u003c/p>\n\u003cfigure class=\"code-block\">\u003cfigcaption>\u003cspan>CP Lang · design fragment\u003c/span>\u003cbutton class=\"copy-button\" type=\"button\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/figcaption>\u003cpre tabindex=\"0\">\u003ccode>\u003cspan class=\"tok-keyword\">let\u003c/span> v = \u003cspan class=\"tok-type\">V\u003c/span>(x)             \u003cspan class=\"tok-comment\">// checked conversion; rejects an invalid label\u003c/span>\n\u003cspan class=\"tok-keyword\">if\u003c/span> x \u003cspan class=\"tok-keyword\">in\u003c/span> \u003cspan class=\"tok-type\">V\u003c/span>:              \u003cspan class=\"tok-comment\">// x is rebound to a V in this branch\u003c/span>\n    degree[x] += \u003cspan class=\"tok-number\">1\u003c/span>\u003c/code>\u003c/pre>\u003c/figure>\n\u003cp>Domain labels are for input and output. Internally, an index maps densely to an ordinal. Avoid assuming every domain starts at zero or one: a character domain can use labels such as \u003ccode>'a'..='z'\u003c/code>.\u003c/p>\n\u003ch2 id=\"the-mechanism-is-index\">The mechanism is Index\u003ca class=\"heading-link\" href=\"#the-mechanism-is-index\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cp>\u003ccode>domain V = 1..=n\u003c/code> expands to a nominal struct with a sealed constructor and an \u003ccode>Index\u003c/code> implementation. The sealed constructor prevents arbitrary invalid indices. The trait supplies a size \u003ccode>K\u003c/code>, conversion to \u003ccode>0..K\u003c/code>, and conversion back from a valid ordinal.\u003c/p>\n\u003cp>The associated size uses a runtime-frozen \u003ccode>let\u003c/code>, not compile-time-only \u003ccode>const\u003c/code>:\u003c/p>\n\u003cfigure class=\"code-block\">\u003cfigcaption>\u003cspan>Index implementation · explanatory fragment\u003c/span>\u003cbutton class=\"copy-button\" type=\"button\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/figcaption>\u003cpre tabindex=\"0\">\u003ccode>\u003cspan class=\"tok-keyword\">impl\u003c/span> \u003cspan class=\"tok-type\">Index\u003c/span> \u003cspan class=\"tok-keyword\">for\u003c/span> \u003cspan class=\"tok-type\">V\u003c/span>:\n    \u003cspan class=\"tok-keyword\">let\u003c/span> \u003cspan class=\"tok-type\">K\u003c/span> = n\n    \u003cspan class=\"tok-keyword\">fn\u003c/span> to_idx(self) -&gt; \u003cspan class=\"tok-number\">0\u003c/span>..\u003cspan class=\"tok-type\">K\u003c/span> = self.ord\n    \u003cspan class=\"tok-keyword\">fn\u003c/span> from_idx(i: \u003cspan class=\"tok-number\">0\u003c/span>..\u003cspan class=\"tok-type\">K\u003c/span>) -&gt; \u003cspan class=\"tok-type\">V\u003c/span> = \u003cspan class=\"tok-type\">V\u003c/span>(i)\u003c/code>\u003c/pre>\u003c/figure>\n\u003cp>Here \u003ccode>V\u003c/code> is the sealed wrapper generated by the domain declaration; its private constructor and \u003ccode>ord\u003c/code> field are part of that expansion. \u003ccode>n\u003c/code> may come from input, but it is immutable and fixed when the index type is declared. A changing \u003ccode>var\u003c/code> cannot size the same index type differently later.\u003c/p>\n\u003cp>\u003ccode>[V]T\u003c/code> means \u003ccode>Array&lt;V, T&gt;\u003c/code>. Tuples of index types are indices too, so \u003ccode>[Row, Col]T\u003c/code> is an array indexed by \u003ccode>(Row, Col)\u003c/code>. Grids need no separate indexing rules. \u003ccode>Seq\u003c/code> adds order and neighbor operations on top of \u003ccode>Index\u003c/code>; not every bounded index needs to be a sequence.\u003c/p>\n\u003ch2 id=\"elements-and-boundaries\">Elements and boundaries\u003ca class=\"heading-link\" href=\"#elements-and-boundaries\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cp>For three elements, there are four gaps: before everything, between each pair, and after everything. \u003ccode>V.bounds\u003c/code> names the type of those gaps. An element \u003ccode>v\u003c/code> has \u003ccode>.l\u003c/code> immediately to its left and \u003ccode>.r\u003c/code> immediately to its right.\u003c/p>\n\u003cfigure class=\"code-block\">\u003cfigcaption>\u003cspan>Output\u003c/span>\u003cbutton class=\"copy-button\" type=\"button\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/figcaption>\u003cpre tabindex=\"0\">\u003ccode>elements           a       b       c\nboundaries      |       |       |       |\n                a.l     a.r\n                        b.l     b.r\n                                c.l     c.r\u003c/code>\u003c/pre>\u003c/figure>\n\u003cp>\u003ccode>a.r\u003c/code> and \u003ccode>b.l\u003c/code> above are the same boundary. \u003ccode>v.l(k)\u003c/code> is the left edge of the \u003ccode>k\u003c/code>-element window ending at \u003ccode>v\u003c/code>; \u003ccode>v.r(k)\u003c/code> is the right edge of the \u003ccode>k\u003c/code>-element window starting at \u003ccode>v\u003c/code>. Both windows count \u003ccode>v\u003c/code>. Thus \u003ccode>.l(1)\u003c/code> is \u003ccode>.l\u003c/code>, and \u003ccode>.r(1)\u003c/code> is \u003ccode>.r\u003c/code>. Use these instead of inventing numeric \u003ccode>+1\u003c/code> shifts. A requested window still has to satisfy the boundary range.\u003c/p>\n\u003ch2 id=\"prefix-sums-without-shifts\">Prefix sums without shifts\u003ca class=\"heading-link\" href=\"#prefix-sums-without-shifts\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cp>This complete example runs in the Python prototype:\u003c/p>\n\u003cfigure class=\"code-block\">\u003cfigcaption>\u003cspan>bounds.cp · prototype tested\u003c/span>\u003cbutton class=\"copy-button\" type=\"button\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/figcaption>\u003cpre tabindex=\"0\">\u003ccode>\u003cspan class=\"tok-keyword\">let\u003c/span> n: \u003cspan class=\"tok-number\">1\u003c/span>..=\u003cspan class=\"tok-number\">100\u003c/span> = read()\n\u003cspan class=\"tok-keyword\">domain\u003c/span> \u003cspan class=\"tok-type\">V\u003c/span> = \u003cspan class=\"tok-number\">1\u003c/span>..=n\n\u003cspan class=\"tok-keyword\">let\u003c/span> a: [\u003cspan class=\"tok-type\">V\u003c/span>]\u003cspan class=\"tok-type\">Int\u003c/span> = read()\n\n\u003cspan class=\"tok-keyword\">var\u003c/span> pre: [\u003cspan class=\"tok-type\">V\u003c/span>.bounds]\u003cspan class=\"tok-type\">Int\u003c/span> = \u003cspan class=\"tok-number\">0\u003c/span>\n\u003cspan class=\"tok-keyword\">for\u003c/span> v \u003cspan class=\"tok-keyword\">in\u003c/span> \u003cspan class=\"tok-type\">V\u003c/span>:\n    pre[v.r] = pre[v.l] + a[v]\nprint(pre[\u003cspan class=\"tok-type\">V\u003c/span>.last.r])\u003c/code>\u003c/pre>\u003c/figure>\n\u003cp>For an inclusive query, subtract its two outer boundaries:\u003c/p>\n\u003cfigure class=\"code-block\">\u003cfigcaption>\u003cspan>CP Lang · design fragment\u003c/span>\u003cbutton class=\"copy-button\" type=\"button\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/figcaption>\u003cpre tabindex=\"0\">\u003ccode>\u003cspan class=\"tok-keyword\">fn\u003c/span> range_sum(l: \u003cspan class=\"tok-type\">V\u003c/span>, r: \u003cspan class=\"tok-type\">V\u003c/span>) -&gt; \u003cspan class=\"tok-type\">Int\u003c/span>:\n    pre[r.r] - pre[l.l]\u003c/code>\u003c/pre>\u003c/figure>\n\u003cp>This helper assumes the prefix array above and an ordered nonempty query \u003ccode>l..=r\u003c/code>. The zero at the initial boundary represents the empty prefix. \u003ccode>pre[v]\u003c/code> is a type error: \u003ccode>v\u003c/code> is an element, not a gap. \u003ccode>a[v.r]\u003c/code> is wrong for the opposite reason. The two arrays express different jobs in their types.\u003c/p>\n\u003ch2 id=\"a-range-is-a-value-a-slice-is-a-lend\">A range is a value; a slice is a lend\u003ca class=\"heading-link\" href=\"#a-range-is-a-value-a-slice-is-a-lend\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cp>A \u003ccode>Range&lt;V&gt;\u003c/code> stores two boundaries. An inclusive expression \u003ccode>l..=r\u003c/code> describes the window from \u003ccode>l.l\u003c/code> through \u003ccode>r.r\u003c/code>. You can return that range from a function or store it for later: it holds no reference to an array.\u003c/p>\n\u003cp>Applying it to an array, \u003ccode>a[window]\u003c/code>, temporarily lends the storage in that window. A slice keeps the parent's index type, not a fresh \u003ccode>Sub&lt;V&gt;\u003c/code> type.\u003c/p>\n\u003cfigure class=\"code-block\">\u003cfigcaption>\u003cspan>CP Lang · design fragment\u003c/span>\u003cbutton class=\"copy-button\" type=\"button\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/figcaption>\u003cpre tabindex=\"0\">\u003ccode>\u003cspan class=\"tok-keyword\">let\u003c/span> part = a[window]\n\u003cspan class=\"tok-keyword\">for\u003c/span> v \u003cspan class=\"tok-keyword\">in\u003c/span> part.positions:\n    print(part[v])\u003c/code>\u003c/pre>\u003c/figure>\n\u003cp>An arbitrary \u003ccode>v: V\u003c/code> is valid for \u003ccode>a\u003c/code>, but might not belong to \u003ccode>part\u003c/code>. \u003ccode>part[v]\u003c/code> therefore checks membership unless the checker already knows it, as it does when iterating \u003ccode>part.positions\u003c/code>. It must not become unchecked merely because another slice uses the same parent index type.\u003c/p>\n\u003ch2 id=\"when-an-integer-is-the-right-tool\">When an integer is the right tool\u003ca class=\"heading-link\" href=\"#when-an-integer-is-the-right-tool\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cp>Keep large coordinates as \u003ccode>Int\u003c/code>; use a fresh compressed index space when you actually need an array over them. Use \u003ccode>.raw\u003c/code> when numeric indexing really is clearer: \u003ccode>a.raw[i]\u003c/code> explicitly opts out of nominal domain matching, but it is still checked for bounds unless proven safe. \u003ccode>unchecked\u003c/code> is not the default way to make code compile.\u003c/p>\n\u003cp>For a full algorithm with separate row and column types, read the \u003ca href=\"https://github.com/ryanbai1412/cp-lang/blob/main/proto/ports/ccc21s2.cp\">Modern Art port\u003c/a>. For the rules behind temporary views, continue to \u003ca href=\"borrowing.html\">ownership &amp; borrowing\u003c/a>.\u003c/p>\n\u003c/article>\n      \u003cnav class=\"pager\" aria-label=\"Adjacent chapters\">\u003ca class=\"pager-previous\" href=\"tour.html\">\u003cspan>Previous ←\u003c/span>A quick language tour\u003c/a>\u003ca class=\"pager-next\" href=\"borrowing.html\">\u003cspan>Next →\u003c/span>Ownership & borrowing\u003c/a>\u003c/nav>\n      \u003cfooter class=\"page-footer\">\u003cspan>CP Lang · A language for competitive programming.\u003c/span>\u003ca href=\"https://github.com/ryanbai1412/cp-lang/blob/main/site/content/indices.md\">Edit this page ↗\u003c/a>\u003c/footer>\n    \u003c/main>\n    \u003caside class=\"right-rail\" aria-label=\"On this page\">\u003cdiv class=\"toc\">\u003cp>On this page\u003c/p>\u003ca href=\"#a-domain-is-a-fresh-type\">A domain is a fresh type\u003c/a>\u003ca href=\"#the-mechanism-is-index\">The mechanism is Index\u003c/a>\u003ca href=\"#elements-and-boundaries\">Elements and boundaries\u003c/a>\u003ca href=\"#prefix-sums-without-shifts\">Prefix sums without shifts\u003c/a>\u003ca href=\"#a-range-is-a-value-a-slice-is-a-lend\">A range is a value; a slice is a lend\u003c/a>\u003ca href=\"#when-an-integer-is-the-right-tool\">When an integer is the right tool\u003c/a>\u003ca class=\"source-link\" href=\"https://github.com/ryanbai1412/cp-lang/tree/main/plan\">Language design ↗\u003c/a>\u003c/div>\u003c/aside>\n  \u003c/div>\n  \u003cdialog class=\"search-dialog\" aria-labelledby=\"search-title\">\n    \u003cform method=\"dialog\" class=\"search-header\">\u003clabel id=\"search-title\" for=\"search-input\">Search the guide\u003c/label>\u003cbutton type=\"submit\" aria-label=\"Close search\">Esc\u003c/button>\u003c/form>\n    \u003cinput id=\"search-input\" type=\"search\" autocomplete=\"off\" placeholder=\"Try “boundaries” or “lends mut”…\" aria-controls=\"search-results\">\n    \u003cp id=\"search-status\" role=\"status\">Type to find a chapter or a concept.\u003c/p>\n    \u003cdiv id=\"search-results\">\u003c/div>\n    \u003cdiv class=\"search-footer\">\u003cspan>↑ ↓ navigate\u003c/span>\u003cspan>Enter to open\u003c/span>\u003c/div>\n  \u003c/dialog>\n\u003c/body>\n\u003c/html>\n","playground.html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"description\" content=\"Run documented examples with your own input, entirely offline. Learn CP Lang with concrete examples for competitive programmers.\">\n  \u003cmeta name=\"color-scheme\" content=\"light dark\">\n  \u003ctitle>Playground — CP Lang\u003c/title>\n  \n  \u003clink rel=\"stylesheet\" href=\"assets/style.css\">\n  \u003cscript src=\"assets/theme.js\">\u003c/script>\n  \u003cscript src=\"assets/app.js\" defer>\u003c/script>\n\n\u003c/head>\n\u003cbody class=\"playground\">\n  \u003ca href=\"#main\" class=\"skip-link\">Skip to content\u003c/a>\n  \u003cheader class=\"topbar\">\n    \u003ca class=\"brand\" href=\"index.html\" aria-label=\"CP Lang home\">\u003cspan class=\"brand-mark\" aria-hidden=\"true\">cp\u003c/span>\u003cspan>CP Lang\u003c/span>\u003c/a>\n    \u003cnav class=\"product-nav\" aria-label=\"Products\">\u003ca href=\"index.html\" >Docs\u003c/a>\u003ca href=\"playground.html\" aria-current=\"page\">Playground\u003c/a>\u003ca href=\"trace.html\">Trace\u003c/a>\u003c/nav>\n    \u003cdiv class=\"top-actions\">\n      \u003cbutton class=\"search-trigger\" type=\"button\" aria-label=\"Search the guide\" aria-haspopup=\"dialog\">\u003cspan class=\"search-icon\" aria-hidden=\"true\">\u003c/span>\u003cspan>Search documentation\u003c/span>\u003ckbd>/\u003c/kbd>\u003c/button>\n      \u003ca class=\"github-link\" href=\"https://github.com/ryanbai1412/cp-lang\">GitHub \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\n      \u003cbutton class=\"theme-toggle icon-button\" aria-label=\"Switch to dark theme\" type=\"button\">◐\u003c/button>\n      \u003cbutton class=\"menu-toggle icon-button\" aria-label=\"Open navigation\" aria-expanded=\"false\" aria-controls=\"sidebar\" type=\"button\">☰\u003c/button>\n    \u003c/div>\n  \u003c/header>\n  \u003cdiv class=\"layout\">\n    \u003caside class=\"sidebar\" id=\"sidebar\">\n      \u003ca class=\"edition\" href=\"getting-started.html#what-works-today\">\u003cspan class=\"status-dot\">\u003c/span> Development edition \u003cspan>0.0\u003c/span>\u003c/a>\n      \u003cnav aria-label=\"Guide chapters\">\u003cdiv class=\"nav-group\">\u003ch2>Start here\u003c/h2>\u003ca href=\"index.html\">\u003cspan class=\"nav-number\">00\u003c/span>Overview\u003c/a>\u003ca href=\"getting-started.html\">\u003cspan class=\"nav-number\">01\u003c/span>Getting started\u003c/a>\u003ca href=\"tour.html\">\u003cspan class=\"nav-number\">02\u003c/span>A quick language tour\u003c/a>\u003c/div>\u003cdiv class=\"nav-group\">\u003ch2>The language\u003c/h2>\u003ca href=\"indices.html\">\u003cspan class=\"nav-number\">03\u003c/span>Index spaces &amp; bounds\u003c/a>\u003ca href=\"borrowing.html\">\u003cspan class=\"nav-number\">04\u003c/span>Ownership &amp; borrowing\u003c/a>\u003ca href=\"strings.html\">\u003cspan class=\"nav-number\">05\u003c/span>ASCII strings\u003c/a>\u003c/div>\u003cdiv class=\"nav-group\">\u003ch2>In practice\u003c/h2>\u003ca href=\"testing.html\">\u003cspan class=\"nav-number\">06\u003c/span>Memoization &amp; stress tests\u003c/a>\u003ca href=\"stdlib.html\">\u003cspan class=\"nav-number\">07\u003c/span>The standard library\u003c/a>\u003c/div>\u003c/nav>\n      \u003cdiv class=\"sidebar-footer\">CP Lang · Development\u003ca href=\"https://github.com/ryanbai1412/cp-lang/blob/main/decisions.md\">Design decisions ↗\u003c/a>\u003c/div>\n    \u003c/aside>\n    \u003cmain id=\"main\" tabindex=\"-1\">\n      \u003cdiv class=\"breadcrumb\">\u003cspan>Tools\u003c/span>\u003cspan aria-hidden=\"true\">/\u003c/span>\u003cspan>Playground\u003c/span>\u003c/div>\n      \u003cdiv class=\"page-meta\">\u003cspan>THE CP LANG GUIDE\u003c/span>\u003cspan> \u003cspan aria-hidden=\"true\">/\u003c/span>  read\u003c/span>\u003c/div>\n      \u003cdiv class=\"chapter-title\">\u003ch1>Example playground\u003c/h1>\u003cp>Run documented examples with your own input, entirely offline.\u003c/p>\u003c/div>\n      \u003carticle>\u003cdiv class=\"playground-toolbar\">\n  \u003clabel for=\"example-picker\">\u003cspan class=\"runner-label\">Example \u003c/span>\u003cselect id=\"example-picker\">\n    \u003coption value=\"sum\">Array sum\u003c/option>\u003coption value=\"bounds\">Prefix boundaries\u003c/option>\n    \u003coption value=\"accumulation\">Accumulation\u003c/option>\u003coption value=\"ascii\">ASCII character count\u003c/option>\n    \u003coption value=\"optional\">Optional predecessor\u003c/option>\u003coption value=\"memo\">Memoized recurrence\u003c/option>\n  \u003c/select>\u003c/label>\n  \u003cbutton class=\"primary-button\" id=\"run-example\" type=\"button\">Run example\u003c/button>\n\u003c/div>\n\u003cdiv class=\"runner-grid\">\n  \u003cfigure class=\"code-block\">\u003cfigcaption>\u003cspan id=\"example-file\">sum.cp · read only\u003c/span>\u003cspan>CP Lang\u003c/span>\u003c/figcaption>\u003cpre tabindex=\"0\">\u003ccode id=\"example-source\">\u003c/code>\u003c/pre>\u003c/figure>\n  \u003cdiv class=\"runner-io\">\n    \u003clabel for=\"example-input\">Standard input\u003c/label>\u003ctextarea id=\"example-input\" spellcheck=\"false\" aria-describedby=\"runner-note\">5\n3 1 4 1 5\u003c/textarea>\n    \u003ch2 id=\"output-label\">Standard output\u003c/h2>\u003cpre class=\"runner-output\" id=\"example-output\" role=\"status\" aria-labelledby=\"output-label\">Run an example to see its output\u003c/pre>\n  \u003c/div>\n\u003c/div>\n\u003cp class=\"runner-status\" id=\"runner-status\" role=\"status\">Ready · Ctrl / ⌘ + Enter to run\u003c/p>\n\u003ch2 id=\"execution\">What runs here\u003c/h2>\n\u003cp id=\"runner-note\">This lightweight runner executes JavaScript implementations of the six documented examples, not a CP Lang compiler. The source is read only; inputs are editable and validated against the example’s constraints. The examples are separately compiled and tested with the Python prototype. For arbitrary CP Lang programs, \u003ca href=\"getting-started.html\">run the local toolchain\u003c/a>.\u003c/p>\n\u003cp>Inspect captured algorithm states in the \u003ca href=\"trace.html\">trace debugger\u003c/a>, including a fast-versus-spec comparison.\u003c/p>\n\u003c/article>\n      \u003cnav class=\"pager\" aria-label=\"Adjacent chapters\">\u003c/nav>\n      \u003cfooter class=\"page-footer\">\u003cspan>CP Lang · A language for competitive programming.\u003c/span>\u003ca href=\"https://github.com/ryanbai1412/cp-lang/blob/main/site/content/playground.md\">Edit this page ↗\u003c/a>\u003c/footer>\n    \u003c/main>\n    \u003caside class=\"right-rail\" aria-label=\"On this page\">\u003cdiv class=\"toc\">\u003cp>On this page\u003c/p>\u003ca class=\"source-link\" href=\"https://github.com/ryanbai1412/cp-lang/tree/main/plan\">Language design ↗\u003c/a>\u003c/div>\u003c/aside>\n  \u003c/div>\n  \u003cdialog class=\"search-dialog\" aria-labelledby=\"search-title\">\n    \u003cform method=\"dialog\" class=\"search-header\">\u003clabel id=\"search-title\" for=\"search-input\">Search the guide\u003c/label>\u003cbutton type=\"submit\" aria-label=\"Close search\">Esc\u003c/button>\u003c/form>\n    \u003cinput id=\"search-input\" type=\"search\" autocomplete=\"off\" placeholder=\"Try “boundaries” or “lends mut”…\" aria-controls=\"search-results\">\n    \u003cp id=\"search-status\" role=\"status\">Type to find a chapter or a concept.\u003c/p>\n    \u003cdiv id=\"search-results\">\u003c/div>\n    \u003cdiv class=\"search-footer\">\u003cspan>↑ ↓ navigate\u003c/span>\u003cspan>Enter to open\u003c/span>\u003c/div>\n  \u003c/dialog>\n\u003cscript id=\"playground-examples\" type=\"application/json\">[{\"id\":\"sum\",\"source\":\"let n: 1..=2e5 = read()\\ndomain V = 1..=n\\nlet a: [V]Int = read()\\nprint(sum(a))\\n\"},{\"id\":\"bounds\",\"source\":\"let n: 1..=100 = read()\\ndomain V = 1..=n\\nlet a: [V]Int = read()\\n\\nvar pre: [V.bounds]Int = 0\\nfor v in V:\\n    pre[v.r] = pre[v.l] + a[v]\\nprint(pre[V.last.r])\\n\"},{\"id\":\"accumulation\",\"source\":\"let n: 1..=100 = read()\\ndomain V = 1..=n\\nlet a: [V]0..=1000 = read()\\nvar total = 0\\nfor v in V:\\n    total += a[v]\\nprint(total)\\n\"},{\"id\":\"ascii\",\"source\":\"let n: 1..=100 = read()\\ndomain S = 1..=n\\nlet word: [S]Char = read()\\nprint(count(word[i] == 'a' for i in S))\\n\"},{\"id\":\"optional\",\"source\":\"domain V = 1..=3\\nlet a: [V]Int = [V] v => v.idx * 10\\nfor v in V:\\n    if let p = v.prev:\\n        print(a[v] - a[p])\\n    else:\\n        print(0)\\n\"},{\"id\":\"memo\",\"source\":\"let n: 1..=20 = read()\\ndomain I = 0..n\\n\\n@memo\\nfn f(i: I) -> Int:\\n    if let p = i.prev:\\n        return f(p) * 3 + i.idx\\n    1\\n\\nprint(f(I.last))\\n\"}]\u003c/script>\u003cscript src=\"assets/playground.js\">\u003c/script>\u003c/body>\n\u003c/html>\n","stdlib.html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"description\" content=\"Containers, algorithms, and local libraries. Learn CP Lang with concrete examples for competitive programmers.\">\n  \u003cmeta name=\"color-scheme\" content=\"light dark\">\n  \u003ctitle>The standard library — CP Lang\u003c/title>\n  \n  \u003clink rel=\"stylesheet\" href=\"assets/style.css\">\n  \u003cscript src=\"assets/theme.js\">\u003c/script>\n  \u003cscript src=\"assets/app.js\" defer>\u003c/script>\n\n\u003c/head>\n\u003cbody class=\"chapter\">\n  \u003ca href=\"#main\" class=\"skip-link\">Skip to content\u003c/a>\n  \u003cheader class=\"topbar\">\n    \u003ca class=\"brand\" href=\"index.html\" aria-label=\"CP Lang home\">\u003cspan class=\"brand-mark\" aria-hidden=\"true\">cp\u003c/span>\u003cspan>CP Lang\u003c/span>\u003c/a>\n    \u003cnav class=\"product-nav\" aria-label=\"Products\">\u003ca href=\"index.html\" aria-current=\"page\">Docs\u003c/a>\u003ca href=\"playground.html\" >Playground\u003c/a>\u003ca href=\"trace.html\">Trace\u003c/a>\u003c/nav>\n    \u003cdiv class=\"top-actions\">\n      \u003cbutton class=\"search-trigger\" type=\"button\" aria-label=\"Search the guide\" aria-haspopup=\"dialog\">\u003cspan class=\"search-icon\" aria-hidden=\"true\">\u003c/span>\u003cspan>Search documentation\u003c/span>\u003ckbd>/\u003c/kbd>\u003c/button>\n      \u003ca class=\"github-link\" href=\"https://github.com/ryanbai1412/cp-lang\">GitHub \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\n      \u003cbutton class=\"theme-toggle icon-button\" aria-label=\"Switch to dark theme\" type=\"button\">◐\u003c/button>\n      \u003cbutton class=\"menu-toggle icon-button\" aria-label=\"Open navigation\" aria-expanded=\"false\" aria-controls=\"sidebar\" type=\"button\">☰\u003c/button>\n    \u003c/div>\n  \u003c/header>\n  \u003cdiv class=\"layout\">\n    \u003caside class=\"sidebar\" id=\"sidebar\">\n      \u003ca class=\"edition\" href=\"getting-started.html#what-works-today\">\u003cspan class=\"status-dot\">\u003c/span> Development edition \u003cspan>0.0\u003c/span>\u003c/a>\n      \u003cnav aria-label=\"Guide chapters\">\u003cdiv class=\"nav-group\">\u003ch2>Start here\u003c/h2>\u003ca href=\"index.html\">\u003cspan class=\"nav-number\">00\u003c/span>Overview\u003c/a>\u003ca href=\"getting-started.html\">\u003cspan class=\"nav-number\">01\u003c/span>Getting started\u003c/a>\u003ca href=\"tour.html\">\u003cspan class=\"nav-number\">02\u003c/span>A quick language tour\u003c/a>\u003c/div>\u003cdiv class=\"nav-group\">\u003ch2>The language\u003c/h2>\u003ca href=\"indices.html\">\u003cspan class=\"nav-number\">03\u003c/span>Index spaces &amp; bounds\u003c/a>\u003ca href=\"borrowing.html\">\u003cspan class=\"nav-number\">04\u003c/span>Ownership &amp; borrowing\u003c/a>\u003ca href=\"strings.html\">\u003cspan class=\"nav-number\">05\u003c/span>ASCII strings\u003c/a>\u003c/div>\u003cdiv class=\"nav-group\">\u003ch2>In practice\u003c/h2>\u003ca href=\"testing.html\">\u003cspan class=\"nav-number\">06\u003c/span>Memoization &amp; stress tests\u003c/a>\u003ca href=\"stdlib.html\" aria-current=\"page\">\u003cspan class=\"nav-number\">07\u003c/span>The standard library\u003c/a>\u003c/div>\u003c/nav>\n      \u003cdiv class=\"sidebar-footer\">CP Lang · Development\u003ca href=\"https://github.com/ryanbai1412/cp-lang/blob/main/decisions.md\">Design decisions ↗\u003c/a>\u003c/div>\n    \u003c/aside>\n    \u003cmain id=\"main\" tabindex=\"-1\">\n      \u003cdiv class=\"breadcrumb\">\u003cspan>In practice\u003c/span>\u003cspan aria-hidden=\"true\">/\u003c/span>\u003cspan>The standard library\u003c/span>\u003c/div>\n      \u003cdiv class=\"page-meta\">\u003cspan>THE CP LANG GUIDE\u003c/span>\u003cspan>07 \u003cspan aria-hidden=\"true\">/\u003c/span> 7 min read\u003c/span>\u003c/div>\n      \u003cdiv class=\"chapter-title\">\u003ch1>The standard library\u003c/h1>\u003cp>Containers, algorithms, and local libraries.\u003c/p>\u003c/div>\n      \u003carticle>\u003cp>The standard library is meant to feel like a good contest library, not a list of compiler exceptions. The language provides bounded indices, traits, generic code, lexical borrows, and a small intrinsic layer. Most containers and algorithms should be ordinary CP Lang you could write yourself.\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>Status.\u003c/strong> This is a guide to the library design and selected prototype facilities, not a generated API reference for a released standard library. Exact module paths and signatures remain in progress. Follow the linked ports for implementations that actually run today.\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"sequences-and-collections\">Sequences and collections\u003ca class=\"heading-link\" href=\"#sequences-and-collections\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cp>\u003ccode>[V]T\u003c/code> has a fixed index space; \u003ccode>List&lt;T&gt;\u003c/code> grows. \u003ccode>Map\u003c/code> and \u003ccode>Set\u003c/code> are ordered collections; \u003ccode>HashMap\u003c/code> and \u003ccode>HashSet\u003c/code> make hashing explicit. \u003ccode>Heap\u003c/code> takes an ordering instead of assuming every priority queue is a max-heap.\u003c/p>\n\u003cp>\u003ccode>[D]Bool\u003c/code> is an ordinary byte-per-element array. The approved packed alternative is an explicit, drop-in \u003ccode>Bitset&lt;D&gt;\u003c/code>, not a silent \u003ccode>vector&lt;bool&gt;\u003c/code>-style specialization with proxy-reference surprises. Choose it when packed storage or word-level operations are what you want.\u003c/p>\n\u003cp>Sequences share tools such as \u003ccode>pairs\u003c/code>, \u003ccode>windows\u003c/code>, \u003ccode>runs\u003c/code>, \u003ccode>scan\u003c/code>, and \u003ccode>rev\u003c/code>. Use a helper when it makes the actual algorithm clearer; there is no requirement to wrap a straightforward loop in a clever pipeline.\u003c/p>\n\u003cp>The \u003ca href=\"https://github.com/ryanbai1412/cp-lang/blob/main/proto/ports/ccc21s2.cp\">Modern Art port\u003c/a> uses domain-indexed Boolean arrays for row and column parity. The \u003ca href=\"https://github.com/ryanbai1412/cp-lang/blob/main/proto/ports/noi01p5.cp\">Meet-in-the-middle port\u003c/a> uses a \u003ccode>HashMap&lt;Int, Int&gt;\u003c/code> to count sums.\u003c/p>\n\u003ch2 id=\"range-data-structures\">Range data structures\u003ca class=\"heading-link\" href=\"#range-data-structures\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cp>The planned core set is Fenwick trees, segment trees with lazy variants, sparse tables, and DSU with a rollback variant. Operation values choose behavior explicitly. A maximum segment tree and a sum segment tree share a data structure, not an implicit compiler guess about the operation.\u003c/p>\n\u003cfigure class=\"code-block\">\u003cfigcaption>\u003cspan>Library API shape · design fragment\u003c/span>\u003cbutton class=\"copy-button\" type=\"button\" aria-label=\"Copy code\">Copy\u003c/button>\u003c/figcaption>\u003cpre tabindex=\"0\">\u003ccode>\u003cspan class=\"tok-keyword\">use\u003c/span> std.segtree.*\n\n\u003cspan class=\"tok-keyword\">var\u003c/span> best = \u003cspan class=\"tok-type\">SegTree\u003c/span>&lt;\u003cspan class=\"tok-type\">V\u003c/span>, \u003cspan class=\"tok-type\">Int\u003c/span>&gt;(\u003cspan class=\"tok-type\">Max\u003c/span>&lt;\u003cspan class=\"tok-type\">Int\u003c/span>&gt;)\nbest.update(v, score)\n\u003cspan class=\"tok-keyword\">let\u003c/span> answer = best.fold(window)\u003c/code>\u003c/pre>\u003c/figure>\n\u003cp>This fragment assumes \u003ccode>V\u003c/code>, \u003ccode>v\u003c/code>, \u003ccode>score\u003c/code>, and \u003ccode>window\u003c/code> have been defined. Specialization should make the operation as direct as hand-written code. That is a performance target to verify, not a benchmark result claimed by this page.\u003c/p>\n\u003ch2 id=\"graphs-and-trees\">Graphs and trees\u003ca class=\"heading-link\" href=\"#graphs-and-trees\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cp>Graph APIs carry vertex and edge index types separately. Shortest-path results can use \u003ccode>[V]?Int\u003c/code> so an unreachable vertex is \u003ccode>none\u003c/code>, not a magic distance. The plan includes BFS, DFS orders, Dijkstra, topological sort, SCC, LCA, and Euler tours.\u003c/p>\n\u003cp>Typed handles from \u003ccode>Pool&lt;Node&gt;\u003c/code> support identity in trees and tries without storing borrows. A persistent data structure holds handles to owned storage; it does not smuggle an escaping slice through the borrow checker.\u003c/p>\n\u003cp>The \u003ca href=\"https://github.com/ryanbai1412/cp-lang/blob/main/proto/ports/ccc23s4.cp\">Minimum-spanning-tree port\u003c/a> and \u003ca href=\"https://github.com/ryanbai1412/cp-lang/blob/main/proto/ports/ioi05p6.cp\">Rivers tree DP\u003c/a> are useful concrete reading alongside the catalogue.\u003c/p>\n\u003ch2 id=\"strings-and-mathematics\">Strings and mathematics\u003ca class=\"heading-link\" href=\"#strings-and-mathematics\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cp>Strings reuse array indexing and slices. The library plan covers hashing, prefix and Z functions, and suffix arrays without changing the ASCII-only text model.\u003c/p>\n\u003cp>For modular arithmetic, the approved design separates \u003ccode>Mod&lt;P&gt;\u003c/code> for a compile-time modulus from \u003ccode>ModR\u003c/code> for a runtime modulus. Neither is a new arithmetic rule hidden inside \u003ccode>Int\u003c/code>. Other planned essentials include \u003ccode>gcd\u003c/code>, \u003ccode>lcm\u003c/code>, sieve utilities, factorial tables, binomials, and explicit \u003ccode>I128\u003c/code> helpers.\u003c/p>\n\u003ch2 id=\"write-a-local-library\">Write a local library\u003ca class=\"heading-link\" href=\"#write-a-local-library\" aria-label=\"Link to this section\">#\u003c/a>\u003c/h2>\n\u003cp>A module is a \u003ccode>.cp\u003c/code> file. A library is a folder with \u003ccode>lib.toml\u003c/code>; project configuration maps a short import name to its locati
