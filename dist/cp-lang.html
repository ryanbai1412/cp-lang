e();\n  results.replaceChildren();\n  selected = -1;\n  if (!query) {\n    status.textContent = \"Type to find a chapter or a concept.\";\n    return;\n  }\n  status.textContent = \"Searching…\";\n  try {\n    indexPromise ||= document.getElementById(\"search-index\")\n      ? Promise.resolve(JSON.parse(document.getElementById(\"search-index\").textContent))\n      : fetch(\"search.json\")\n      .then((response) => {\n        if (!response.ok) throw new Error(\"Search index unavailable\");\n        return response.json();\n      })\n      .catch((error) => {\n        indexPromise = null;\n        throw error;\n      });\n    const pages = await indexPromise;\n    if (version !== queryVersion) return;\n    const words = query.split(/\\s+/);\n    const hits = pages\n      .filter((page) =>\n        words.every((word) =>\n          `${page.title} ${page.text}`.toLowerCase().includes(word),\n        ),\n      )\n      .sort(\n        (a, b) =>\n          Number(b.title.toLowerCase().includes(query)) -\n          Number(a.title.toLowerCase().includes(query)),\n      );\n    status.textContent = hits.length\n      ? `${hits.length} chapter${hits.length === 1 ? \"\" : \"s\"} found`\n      : \"No matches. Try “Index”, “ASCII”, or “memo”.\";\n    hits.forEach((page) => {\n      const link = document.createElement(\"a\");\n      link.href = page.url;\n      const title = document.createElement(\"strong\");\n      title.textContent = page.title;\n      const excerpt = document.createElement(\"span\");\n      const at = Math.max(0, page.text.toLowerCase().indexOf(words[0]) - 45);\n      excerpt.textContent =\n        (at ? \"…\" : \"\") + page.text.slice(at, at + 155) + \"…\";\n      link.append(title, excerpt);\n      results.append(link);\n    });\n  } catch (_) {\n    if (version === queryVersion)\n      status.textContent =\n        \"Search could not load. Browse the chapters in the sidebar, or try again.\";\n  }\n});\ndialog.addEventListener(\"keydown\", (event) => {\n  if (event.key === \"Escape\") {\n    event.preventDefault();\n    dialog.close();\n    return;\n  }\n  const links = [...results.querySelectorAll(\"a\")];\n  if (!links.length) return;\n  if (event.key === \"ArrowDown\" || event.key === \"ArrowUp\") {\n    event.preventDefault();\n    selected =\n      event.key === \"ArrowDown\"\n        ? (selected + 1) % links.length\n        : selected \u003c= 0\n          ? links.length - 1\n          : selected - 1;\n    links.forEach((link, i) =>\n      link.classList.toggle(\"selected\", i === selected),\n    );\n    links[selected].focus();\n  } else if (event.key === \"Enter\" && event.target === input) {\n    event.preventDefault();\n    links[Math.max(selected, 0)].click();\n  }\n});\n\nconst tocLinks = [...document.querySelectorAll('.toc a[href^=\"#\"]')];\nif (\"IntersectionObserver\" in window) {\n  const observer = new IntersectionObserver(\n    (entries) => {\n      for (const entry of entries) {\n        if (entry.isIntersecting)\n          tocLinks.forEach((link) =>\n            link.classList.toggle(\n              \"active\",\n              link.hash === `#${entry.target.id}`,\n            ),\n          );\n      }\n    },\n    { rootMargin: \"-10% 0px -65% 0px\" },\n  );\n  document\n    .querySelectorAll(\"article h2\")\n    .forEach((heading) => observer.observe(heading));\n}\n","playground":"/* Explicit example implementations, never eval or a pretend compiler. BigInt\n   preserves Int results beyond JavaScript's safe-number range. */\nconst ExampleRunner = (() => {\n  const defaults = {sum:\"5\\n3 1 4 1 5\", bounds:\"5\\n3 1 4 1 5\", accumulation:\"4\\n0 1 2 3\", ascii:\"5\\nabaca\", optional:\"\", memo:\"4\"};\n  function run(name, input) {\n    const tokens = input.trim() ? input.trim().split(/\\s+/) : [];\n    let position = 0;\n    const take = () => {\n      if (position >= tokens.length) throw new Error(\"Not enough input values\");\n      return tokens[position++];\n    };\n    const integer = () => {\n      const token = take();\n      if (!/^[+-]?\\d+$/.test(token)) throw new Error(\"Expected an integer\");\n      const n = BigInt(token);\n      if (n \u003c -(2n ** 63n) || n > 2n ** 63n - 1n) throw new Error(\"Integer is outside the signed 64-bit range\");\n      return n;\n    };\n    const size = max => {\n      const n = integer();\n      if (n \u003c 1n || n > BigInt(max)) throw new Error(\"Size must be between 1 and \" + max);\n      return Number(n);\n    };\n    let output;\n    if (name === \"optional\") {\n      output = \"0\\n10\\n10\";\n    } else if (name === \"memo\") {\n      const n = size(20);\n      let value = 1n;\n      for (let i = 1; i \u003c n; i++) value = value * 3n + BigInt(i);\n      output = String(value);\n    } else if (name === \"ascii\") {\n      const n = size(100), word = take();\n      if (word.length !== n || !/^[\\x00-\\x7f]+$/.test(word)) throw new Error(\"Expected exactly n ASCII characters\");\n      output = String([...word].filter(c => c === \"a\").length);\n    } else if ([\"sum\", \"bounds\", \"accumulation\"].includes(name)) {\n      const n = size(name === \"sum\" ? 200000 : 100);\n      const a = Array.from({length:n}, () => integer());\n      if (name === \"accumulation\" && a.some(v => v \u003c 0n || v > 1000n)) throw new Error(\"Array values must be between 0 and 1000\");\n      let total = 0n;\n      for (const value of a) {\n        total += value;\n        if (total \u003c -(2n ** 63n) || total > 2n ** 63n - 1n) throw new Error(\"Sum overflows signed 64-bit Int\");\n      }\n      output = String(total);\n    } else throw new Error(\"Unknown example\");\n    if (position !== tokens.length) throw new Error(\"Unexpected extra input\");\n    return output + \"\\n\";\n  }\n  return {run, defaults};\n})();\nif (typeof document !== \"undefined\") {\n  const examples = JSON.parse(document.getElementById(\"playground-examples\").textContent);\n  const picker = document.getElementById(\"example-picker\");\n  const input = document.getElementById(\"example-input\");\n  const output = document.getElementById(\"example-output\");\n  const status = document.getElementById(\"runner-status\");\n  function select() {\n    const example = examples.find(e => e.id === picker.value);\n    document.getElementById(\"example-source\").textContent = example.source;\n    document.getElementById(\"example-file\").textContent = example.id + \".cp · read only\";\n    input.value = ExampleRunner.defaults[example.id];\n    input.disabled = example.id === \"optional\";\n    output.textContent = \"Run an example to see its output\";\n    status.textContent = \"Ready · Ctrl / ⌘ + Enter to run\";\n    status.dataset.error = \"false\";\n  }\n  function run() {\n    try {\n      output.textContent = ExampleRunner.run(picker.value, input.value);\n      status.textContent = \"Completed locally · JavaScript example runner\";\n      status.dataset.error = \"false\";\n    } catch (error) {\n      output.textContent = \"\";\n      status.textContent = error.message;\n      status.dataset.error = \"true\";\n    }\n  }\n  picker.addEventListener(\"change\", select);\n  document.getElementById(\"run-example\").addEventListener(\"click\", run);\n  document.addEventListener(\"keydown\", event => {\n    if ((event.ctrlKey || event.metaKey) && event.key === \"Enter\") {\n      event.preventDefault(); run();\n    }\n  });\n  select();\n}\n","search":"[{\"title\": \"Overview\", \"section\": \"Start here\", \"url\": \"index.html\", \"text\": \" CP Lang is a language for competitive programming that targets C++17. Keep the algorithms you know. Replace index arithmetic, sentinel values, and repeated bookkeeping with types that say what you mean. Start with your first program , take the language tour , or go straight to index spaces . Prefix sums \\u00b7 the approved design Copy let n: 1 ..= 2e5 = read() domain V = 1 ..=n let a: [ V ] Int = read() var pre: [ V .bounds] Int = 0 for v in V : pre[v.r] = pre[v.l] + a[v] fn range_sum(l: V , r: V ) -> Int : pre[r.r] - pre[l.l] An element has a boundary on its left, .l , and on its right, .r . Prefix sums live on those boundaries. There is no question of whether to allocate n or n + 1 , or whether to subtract at l - 1 . One idea, fewer special cases # A vertex, an edge, and a character position are all bounded indices. Arrays, grids, and strings use the same indexing mechanism. A row or a slice is temporary access to existing storage, not a hidden copy. The language core stays small. Domains expand to sealed structs implementing Index . Containers and their projections are library code. You can understand the rules once, then use them in your own library. A path through the language # Getting started \\u2014 install the development CLI and run a prototype example. A quick tour \\u2014 values, optional results, loops, functions, and program structure. Index spaces & bounds \\u2014 put positions and the gaps between them in different types. Ownership & borrowing \\u2014 use lends , not lifetime annotations. ASCII strings \\u2014 flat character arrays with their own index spaces. Memoization & stress tests \\u2014 cache recurrences and compare fast code with a brute. The standard library \\u2014 reuse the familiar tools, or write your own. Know what you can run # Development edition. This guide describes the approved language design, not a finished release. Blocks marked prototype tested compile and run in the Python prototype. Blocks marked design explain the intended language and are not advertised as runnable. The Rust CLI currently checks a subset and serves the LSP; its run/build backends are not built yet. The getting-started chapter separates working commands from the target workflow. There is no pretend Run button: examples run locally against the actual prototype. The design decisions and plan explain the rationale and remaining work. \"}, {\"title\": \"Getting started\", \"section\": \"Start here\", \"url\": \"getting-started.html\", \"text\": \" You need Git, Python 3, a recent stable Rust toolchain, and a C++17 compiler ( g++ for the commands below). The repository is currently private, so cloning requires repository access. No packaged installer or stable release is available yet. Install the development CLI # Terminal Copy git clone https://github.com/ryanbai1412/cp-lang.git cd cp-lang cargo test cargo install --path crates/cpl-cli cpl --version cpl --help The executable is cpl , not cp : cp already copies files on Unix. Source files use the .cp extension. Cargo normally installs the executable in ~/.cargo/bin ; make sure that directory is on your PATH . Your first program # Save this as sum.cp . A program is a function body: top-level statements run in order, with no main wrapper or include list. sum.cp \\u00b7 prototype tested Copy let n: 1 ..= 2e5 = read() domain V = 1 ..=n let a: [ V ] Int = read() print(sum(a)) let binds a value you will not reassign. The type on n gives its permitted range. domain V makes a fresh type for the positions 1 through n ; [V]Int has one integer per position. sum consumes the elements, not their labels. Input: Output Copy 5 3 1 4 1 5 Output: Output Copy 14 Run it today # The Rust interpreter and C++ backend are not implemented yet. Use the Python prototype to produce a real C++17 program: Terminal Copy python3 proto/cp.py build sum.cp g++ -std=c++17 -O2 sum.cpp -o sum printf '5\\\\n3 1 4 1 5\\\\n' | ./sum The prototype writes sum.cpp beside the source and adds a compiler stamp to sum.cp . Work on your own files, not a tracked corpus port. sum.cpp is the file you would submit, not the .cp source. What works today # cpl check sum.cp runs the shared Rust frontend and reports the subset of syntax and type errors it understands. A clean check is not proof that a design-only feature is implemented. cpl lsp speaks the language server protocol over stdio for editor integrations. cpl run sum.cp and cpl build sum.cp currently check the input and then report that their backends are not built. They do not execute or emit C++ yet. The prototype implements more of the language, but is also partial; use the labeled examples in this guide as a starting point. The intended contest loop # These are planned Rust CLI workflows , not commands to rely on today: Planned workflow \\u00b7 not implemented in the Rust CLI Copy cpl run d.cp i1 cpl run d.cp --release cpl test d.cp cpl stress d.cp cpl build d.cp cpl doc std The target is a fast debug interpreter, stress cases generated from typed input, and one bundled C++17 file with a 64 KB submission-size gate. Local library code should be tested and documented with the same test and doc commands as the standard library. Until those commands land, follow the working prototype stress recipe . \"}, {\"title\": \"A quick language tour\", \"section\": \"Start here\", \"url\": \"tour.html\", \"text\": \" You already know how to solve the problem. This chapter is about expressing the solution: indentation instead of braces, values instead of sentinels, and a file that reads like the main flow of your algorithm. Values and mutation # Use let by default, and var for a binding that changes. Int is the default 64-bit integer. A range type states a constraint, rather than asking you to remember which width is enough. accumulation.cp \\u00b7 prototype tested Copy let n: 1 ..= 100 = read() domain V = 1 ..=n let a: [ V ] 0 ..= 1000 = read() var total = 0 for v in V : total += a[v] print(total) Range-typed storage is intended to use the smallest fitting width, while arithmetic uses Int . Int reserves the most-negative 64-bit bit pattern for none , so ?Int fits in the same eight bytes. Use the explicit fixed-width types for bit-level work. Missing is a value # ?T means \\u201ca T , or none \\u201d. ?? supplies a fallback; if let uses the value only when it exists. A missing predecessor is not -1 , and an unreachable distance is not a suspiciously large integer. optional.cp \\u00b7 prototype tested Copy domain V = 1 ..= 3 let a: [ V ] Int = [ V ] v => v.idx * 10 for v in V : if let p = v.prev: print(a[v] - a[p]) else : print( 0 ) v.prev returns none at the first position. You cannot silently step outside the domain. The same pattern handles v.next , an empty minimum, and a lookup that finds nothing. Functions and explicit changes # A parameter borrows by default. A function that changes its argument marks it mut , and its caller agrees by writing mut too. There is no implicit deep copy of an array. CP Lang \\u00b7 design Copy fn add_to( mut a: [ V ] Int , v: V , delta: Int ): a[v] += delta add_to( mut a, V .first, 3 ) let snapshot = a.copy() An ordinary helper can see immutable values in the surrounding program. A nested mut fn can mutate captured variables but cannot escape as a stored function value. Read ownership & borrowing before writing helpers that keep views into containers. Records and choices # Name the pieces of an edge instead of remembering what first.second means. Use an enum when the input describes one of several shapes, and match to handle each shape. CP Lang \\u00b7 design Copy let edges: [ E ](u: V , v: V , w: 1 ..= 1e9 ) = read() enum Move : Add (v: V , delta: Int ) Ask (l: V , r: V ) match move: Add (v, delta) => add_to( mut a, v, delta) Ask (l, r) => print(range_sum(l, r)) This is a fragment: it assumes domains V and E , an array a , and the two helpers are already defined. The Modern Art corpus port uses this pattern for row and column strokes. A few C++ habits to leave behind # Write and , or , and not for logical operators. .. excludes the end; ..= includes it. A position plus an integer is deliberately ambiguous: choose .next , .offset(k) , or .cyc(k) depending on the edge behavior you want. In the approved design, integer division is / and remainder is % , with Euclidean semantics. The remainder is always non-negative and smaller than the absolute divisor: -7 / 3 is -3 , -7 % 3 is 2 , and 7 / -3 is -2 with remainder 1 . Division by zero is an error. When operands are proven non-negative, the backend can use native C++ operations. // starts a line comment, not a division expression. Program structure # Use top-level code for the solution's flow and functions for parts you want to test alone. A top-level return ends the program, or the current case under @multitest . The decorator is library-level contest behavior, not a special kind of program body. CP Lang \\u00b7 design Copy @multitest (sum: n \u003c= 2e5 ) let n: 1 ..= 2e5 = read() domain V = 1 ..=n let a: [ V ] Int = read() print(sum(a)) Each case gets fresh ordinary state. Expensive immutable precomputation can use static let . Library modules contain declarations rather than hidden top-level actions; importing a helper should not secretly read input or change state. \"}, {\"title\": \"Index spaces & bounds\", \"section\": \"The language\", \"url\": \"indices.html\", \"text\": \" An integer tells you a number. An index also tells you what that number belongs to. Vertex 3 and edge 3 may print alike, but they should not be interchangeable when indexing arrays. Approved design, partially prototyped. The Python prototype supports user Index types, .l / .r boundaries, and parent-indexed slices. The Rust checker does not yet implement this model. Library-level fragments remain design examples; see the implementation limits . A domain is a fresh type # CP Lang \\u00b7 design Copy let n: 1 ..= 2e5 = read() let m: 1 ..= 2e5 = read() domain V = 1 ..=n domain E = 1 ..=m let weights: [ E ] Int = read() var degree: [ V ] Int = 0 V and E are different types even if n == m . You can index degree with a V , not an E or an arbitrary Int . Check or refine a number when it enters the domain; do not repeat that check at every array access. CP Lang \\u00b7 design fragment Copy let v = V (x) // checked conversion; rejects an invalid label if x in V : // x is rebound to a V in this branch degree[x] += 1 Domain labels are for input and output. Internally, an index maps densely to an ordinal. Avoid assuming every domain starts at zero or one: a character domain can use labels such as 'a'..='z' . The mechanism is Index # domain V = 1..=n expands to a nominal struct with a sealed constructor and an Index implementation. The sealed constructor prevents arbitrary invalid indices. The trait supplies a size K , conversion to 0..K , and conversion back from a valid ordinal. The associated size uses a runtime-frozen let , not compile-time-only const : Index implementation \\u00b7 explanatory fragment Copy impl Index for V : let K = n fn to_idx(self) -> 0 .. K = self.ord fn from_idx(i: 0 .. K ) -> V = V (i) Here V is the sealed wrapper generated by the domain declaration; its private constructor and ord field are part of that expansion. n may come from input, but it is immutable and fixed when the index type is declared. A changing var cannot size the same index type differently later. [V]T means Array\u003cV, T> . Tuples of index types are indices too, so [Row, Col]T is an array indexed by (Row, Col) . Grids need no separate indexing rules. Seq adds order and neighbor operations on top of Index ; not every bounded index needs to be a sequence. Elements and boundaries # For three elements, there are four gaps: before everything, between each pair, and after everything. V.bounds names the type of those gaps. An element v has .l immediately to its left and .r immediately to its right. Output Copy elements a b c boundaries | | | | a.l a.r b.l b.r c.l c.r a.r and b.l above are the same boundary. v.l(k) is the left edge of the k -element window ending at v ; v.r(k) is the right edge of the k -element window starting at v . Both windows count v . Thus .l(1) is .l , and .r(1) is .r . Use these instead of inventing numeric +1 shifts. A requested window still has to satisfy the boundary range. Prefix sums without shifts # This complete example runs in the Python prototype: bounds.cp \\u00b7 prototype tested Copy let n: 1 ..= 100 = read() domain V = 1 ..=n let a: [ V ] Int = read() var pre: [ V .bounds] Int = 0 for v in V : pre[v.r] = pre[v.l] + a[v] print(pre[ V .last.r]) For an inclusive query, subtract its two outer boundaries: CP Lang \\u00b7 design fragment Copy fn range_sum(l: V , r: V ) -> Int : pre[r.r] - pre[l.l] This helper assumes the prefix array above and an ordered nonempty query l..=r . The zero at the initial boundary represents the empty prefix. pre[v] is a type error: v is an element, not a gap. a[v.r] is wrong for the opposite reason. The two arrays express different jobs in their types. A range is a value; a slice is a lend # A Range\u003cV> stores two boundaries. An inclusive expression l..=r describes the window from l.l through r.r . You can return that range from a function or store it for later: it holds no reference to an array. Applying it to an array, a[window] , temporarily lends the storage in that window. A slice keeps the parent's index type, not a fresh Sub\u003cV> type. CP Lang \\u00b7 design fragment Copy let part = a[window] for v in part.positions: print(part[v]) An arbitrary v: V is valid for a , but might not belong to part . part[v] therefore checks membership unless the checker already knows it, as it does when iterating part.positions . It must not become unchecked merely because another slice uses the same parent index type. When an integer is the right tool # Keep large coordinates as Int ; use a fresh compressed index space when you actually need an array over them. Use .raw when numeric indexing really is clearer: a.raw[i] explicitly opts out of nominal domain matching, but it is still checked for bounds unless proven safe. unchecked is not the default way to make code compile. For a full algorithm with separate row and column types, read the Modern Art port . For the rules behind temporary views, continue to ownership & borrowing . \"}, {\"title\": \"Ownership & borrowing\", \"section\": \"The language\", \"url\": \"borrowing.html\", \"text\": \" Variables own their values. Function parameters borrow them for the call. A projection lets a caller work on part of a value\\u2014a row, a slice, or an element\\u2014without allocating a copy or keeping a reference for later. Approved design, partially prototyped. The Python prototype implements struct projections with lends , lend , and law disjoint , plus lexical checks for slices and rows. Generic library implementations and the full checker remain work in progress. The fragments below explain the design; runnable projection tests show the supported subset and the implementation notes state its limits. Own it, borrow it, or copy it # CP Lang \\u00b7 design fragment Copy fn total(a: [ V ] Int ) -> Int : sum(a) fn bump( mut a: [ V ] Int , v: V ): a[v] += 1 print(total(a)) // read-only borrow, no array copy bump( mut a, V .first) // mutable borrow, explicit at both ends let saved = a.copy() // an owned copy, explicit cost While a place is borrowed mutably, other code cannot read or write the same place. Multiple read-only borrows are fine. Separate struct fields can be borrowed separately; overlapping container accesses need more evidence. A projection lends a place # An ordinary function uses -> to return an owned value. A projection uses lends to give temporary access to a place in its receiver, and lend in its body to identify that place. Library implementation \\u00b7 design fragment Copy impl Array \u003c( A , B ), T >: pub fn row(self, r: A ) lends mut [ B ] T : law disjoint(r, q) = r != q lend mut Array \u003c B , T >(buf.part(r.to_idx * B . K , B . K )) This library fragment assumes the array's private buffer buf and index types A and B . It lends a contiguous row; it does not copy the row's elements. lends T only permits reading. lends mut T permits mutation when the caller holds the receiver mutably and the use asks for mutation. It does not turn a read-only receiver into a mutable one. CP Lang \\u00b7 design fragment Copy let row = grid.row(r) print(sum(row)) The local row is temporary access to grid , not an owner. A mutating use such as grid.row(r).sort() holds the corresponding mutable lend for that statement. Why there are no lifetime annotations # CP Lang does not ask you to name how long references live. It restricts where a borrow can go instead. A lent value may be a local let , an argument, an inline use, or a loop's temporary value. It cannot escape into an owning field, a container, a var , a stored non-inline closure, or an ordinary return value. The implementation model is an inline callback: a projection runs the caller's use of the lent place while the owner is still available. Binding a lend to let puts the rest of that block inside the callback. The checker can see the whole use; there is no returned reference whose lifetime must be related to some other reference. That is the tradeoff, not a promise that arbitrary Rust borrowing works without annotations. Structures that must remember identity use plain indices or pool handles. Functions that find a useful window return a Range\u003cV> , then the caller reopens a[window] when needed. If you truly want independent storage, ask for .copy() . CP Lang \\u00b7 design fragment Copy let window: Range \u003c V > = find_window(a) // plain data: two boundaries let part = a[window] // a lexical lend, used here print(sum(part)) let saved = part.copy() // owned data may escape find_window above is an ordinary user helper returning a range. It must not return a borrowed slice. Returning the recipe for access is simpler than returning access itself. Prove two accesses do not overlap # The array's element projection declares this law: Library contract \\u00b7 design fragment Copy fn at(self, i: I ) lends mut T : law disjoint(i, j) = i != j // implementation lends the element at i The law says when two lends through that same projection are separate. It does not assert that every call is safe. The checker must prove the condition at the call site. CP Lang \\u00b7 design fragment Copy if i != j: merge_into( mut counts[i], counts[j]) Without the guard or another proof of i != j , the two elements might alias, so a mutable access and a read cannot coexist. An explicit assert i != j is another way to establish the condition. Index arguments are evaluated before lending begins, so the proof is about fixed argument values, not indices that might change halfway through the call. For two ranges, the law is that one ends before the other begins: s.hi \u003c= t.lo or t.hi \u003c= s.lo . Adjacent halves can therefore be lent separately: CP Lang \\u00b7 design fragment Copy solve( mut a[l.l..m.l], mut a[m.l..r.r]) The law applies to two calls of the same projection on the same receiver . Different operations do not automatically become disjoint: a row and a column may cross even when their arguments look different. Keep the owner obvious # A lent row cannot be saved as the \\u201cbest row so far\\u201d in a variable outside the loop. Save its index, then call grid.row(best_r) later, or keep a deliberate copy. A generator-lent value lasts for one iteration, not forever. These restrictions keep both mutation and performance visible at the use site. There are no user-visible pointer arithmetic tricks here. The intended primitive is a checked Buffer.part ; arrays, slices, grids, and strings build their projections from it. An ordinary library can provide the same borrowing behavior as the standard one. \"}, {\"title\": \"ASCII strings\", \"section\": \"The language\", \"url\": \"strings.html\", \"text\": \" Char is one ASCII byte. Str is a flat array of those bytes. There is no UTF-8 decoding, variable-width character indexing, Unicode normalization, or separate code-point iterator hiding underneath a subscript. Deliberate scope. Non-ASCII text is outside the Char / Str contract. A character or string literal must be ASCII, and input for those types must satisfy that constraint. Arbitrary binary data belongs in an explicit byte container, not in a string that silently changes encoding. The familiar array model # When the input gives a length, use a domain-indexed character array. This example counts occurrences of a character in a single ASCII token. ascii.cp \\u00b7 prototype tested Copy let n: 1 ..= 100 = read() domain S = 1 ..=n let word: [ S ] Char = read() print(count(word[i] == 'a' for i in S )) For input 5 abaca , the result is 3 . Each access selects exactly one byte. The stored character array is contiguous and supports O(1) indexing; there is no walk to the nth UTF-8 code point. A string carries its own index space # In the approved unified design, Str is an alias for [domain]Char : an owned array packaged with a fresh index type. Opening the package as s exposes that type as s.Idx . Two independent strings have different position types, even when they have the same length. The ASCII restriction is implemented in the prototype. The [domain]Char package and s.Idx interface are still design-only. CP Lang \\u00b7 design Copy let s: Str = read() let t: Str = read() for i in s. Idx : print(s[i]) t[s.Idx.first!] is not a shortcut for the first character of t ; it mixes two index spaces. The ! would also require that s is nonempty. Use positions belonging to the string you actually want. Slices and boundaries are shared tools # s[l..=r] lends a character slice just as a[l..=r] lends an integer slice. It does not allocate a substring. .copy() explicitly makes independent storage. Whole-slice operations and iteration can prove membership; an arbitrary parent position needs a window check. For a two-string DP, put the empty prefix on a boundary rather than inventing an extra numeric row and column: CP Lang \\u00b7 design fragment Copy var dp: [s. Idx .bounds, t. Idx .bounds] Int = 0 for i in s. Idx : for j in t. Idx : dp[i.r, j.r] = if s[i] == t[j]: dp[i.l, j.l] + 1 else : max(dp[i.l, j.r], dp[i.r, j.l]) This is the LCS recurrence expressed over the two strings' own indices. Swapping an s boundary with a t boundary is a type error. .l and .r have the same meaning here as they do in integer prefix sums . Owning collections of strings # List\u003cStr> can hold strings of different lengths because each element owns its own package. A string opened while iterating is lent for that iteration. Keep .copy() if the result needs independent ownership, rather than storing a borrowed window. String equality, ordering, and hashing compare contents; sharing an index type is not required to compare two strings. Build growing text with List\u003cChar> , then freeze/package it as a Str . The library is responsible for these operations, not a second string-only type system. String algorithms, not string magic # The standard-library plan includes prefix functions, Z-functions, hashing, and suffix arrays. They should accept the same bounded character arrays as ordinary sequence code. The Searching for Strings port is a concrete prototype example: character domains for letter counts, a moving window, and substring hashes. \"}, {\"title\": \"Memoization & stress tests\", \"section\": \"In practice\", \"url\": \"testing.html\", \"text\": \" Keep the fast solution, a simple trusted alternative, and the input constraints close together. A randomized mismatch is useful only if you can turn it into a small input and understand which part disagreed. Memoize the recurrence # @memo caches a function by its arguments. Here the domain bounds the state space; the recurrence asks for the previous state only when it exists. memo.cp \\u00b7 prototype tested Copy let n: 1 ..= 20 = read() domain I = 0 ..n @memo fn f(i: I ) -> Int : if let p = i.prev: return f(p) * 3 + i.idx 1 print(f( I .last)) With input 4 , the states are 1 , 4 , 14 , 45 , so the program prints 45 . The prototype's i.idx is a zero-based ordinal helper, not a conversion from an unrelated integer domain. The cache is not magic algorithm selection. Sparse scalar keys can use a hash-backed cache; finite indexed keys permit dense tables. The prototype also supports @memo(into: dp) to name the table and @memo(order: ascending) for an explicit ascending evaluation order. Choose an order only when it matches the recurrence's dependencies. Do not read \\u201cmemoized\\u201d as \\u201csafe for cycles\\u201d or \\u201csafe for arbitrarily deep recursion\\u201d. For a real tree DP, read IOI 2005 Rivers . It memoizes depth and the cost of serving a subtree from a selected mill. Turn input into a specification # The input spec is the type-and-constraint description of valid cases. In the current prototype that description is written as typed read() declarations, not a separate spec keyword or block. Input specification \\u00b7 prototype syntax Copy let n: 1 ..= 2e5 = read() domain V = 1 ..=n let a: [ V ] 0 ..= 1e9 = read() These declarations say how to read input, how much storage to allocate, and what values a generator is allowed to produce. A where condition adds a relation between values. For structured inputs that are expensive to generate by rejection, the prototype accepts a custom gen: helper; Rivers generates a tree directly and checks its drainage invariant. The approved tooling direction extends this to typed generators and structure-aware shrinkers: a failing tree should shrink by removing leaves, not by deleting arbitrary bytes until it stops being a tree. The full automatic shrinking workflow is still planned, not a feature of the Rust CLI today. Keep a brute for one part # The prototype attaches @brute(fast_name) to the slow function. This direction matters: name the function being checked, not the brute itself. CP Lang \\u00b7 prototype syntax fragment Copy fn fast(a: [ V ] Int ) -> Int : sum(a) @brute (fast) fn slow(a: [ V ] Int ) -> Int : var result = 0 for v in V : result += a[v] result This tiny pair assumes the input and domain from the preceding specification. Real brutes are deliberately slower and simpler. A brute for one stage is often more informative than a second implementation of the whole program: it narrows the disagreement to that stage. Stress a real port today # Run the prototype against an original C++ solution. The following recipe copies a port out of the tracked directory because prototype build commands stamp the source and write generated files next to it. Terminal Copy mkdir -p scratch/docs-stress cp proto/ports/dmopc21c2p1.cp scratch/docs-stress/solution.cp python3 proto/cp.py stress scratch/docs-stress/solution.cp \\\\ proto/ports/dmopc21c2p1_orig.cpp 100 8 The last two arguments are the number of seeds and the small size bound. The tool compiles the solution, generator, and reference with g++ , compares tokenized outputs, and prints the seed and input on a mismatch. This is a real local native run, not a simulated example. It does not by itself prove correctness over the full input range. python3 proto/cp.py fntest file.cp 20 8 checks the file's @brute(fast) and invariant functions on generated calls. locate can search small generated inputs and swap a part for its brute to help identify the source of a disagreement. Those prototype tools are separate from the planned polished cpl stress command. The finished workflow # An input spec describes legal inputs . The approved design also calls for co-located spec checks that describe correct behavior : keep a small trusted implementation beside the fast one, compare intermediate states, and show the first divergence in the trace debugger. That integrated state-diffing experience is planned; today's prototype @brute tools are the working starting point, not a claim that the finished spec workflow already ships. The intended cpl stress d.cp uses the input spec, checks fast and brute implementations, shrinks a failure while preserving validity, and saves a regression input beside the problem. Tests, brutes, and specification-only machinery must not inflate the submitted C++. The same testing model is intended for standard-library modules and local libraries, not just single solutions. \"}, {\"title\": \"The standard library\", \"section\": \"In practice\", \"url\": \"stdlib.html\", \"text\": \" The standard library is meant to feel like a good contest library, not a list of compiler exceptions. The language provides bounded indices, traits, generic code, lexical borrows, and a small intrinsic layer. Most containers and algorithms should be ordinary CP Lang you could write yourself. Status. This is a guide to the library design and selected prototype facilities, not a generated API reference for a released standard library. Exact module paths and signatures remain in progress. Follow the linked ports for implementations that actually run today. Sequences and collections # [V]T has a fixed index space; List\u003cT> grows. Map and Set are ordered collections; HashMap and HashSet make hashing explicit. Heap takes an ordering instead of assuming every priority queue is a max-heap. [D]Bool is an ordinary byte-per-element array. The approved packed alternative is an explicit, drop-in Bitset\u003cD> , not a silent vector\u003cbool> -style specialization with proxy-reference surprises. Choose it when packed storage or word-level operations are what you want. Sequences share tools such as pairs , windows , runs , scan , and rev . Use a helper when it makes the actual algorithm clearer; there is no requirement to wrap a straightforward loop in a clever pipeline. The Modern Art port uses domain-indexed Boolean arrays for row and column parity. The Meet-in-the-middle port uses a HashMap\u003cInt, Int> to count sums. Range data structures # The planned core set is Fenwick trees, segment trees with lazy variants, sparse tables, and DSU with a rollback variant. Operation values choose behavior explicitly. A maximum segment tree and a sum segment tree share a data structure, not an implicit compiler guess about the operation. Library API shape \\u00b7 design fragment Copy use std.segtree.* var best = SegTree \u003c V , Int >( Max \u003c Int >) best.update(v, score) let answer = best.fold(window) This fragment assumes V , v , score , and window have been defined. Specialization should make the operation as direct as hand-written code. That is a performance target to verify, not a benchmark result claimed by this page. Graphs and trees # Graph APIs carry vertex and edge index types separately. Shortest-path results can use [V]?Int so an unreachable vertex is none , not a magic distance. The plan includes BFS, DFS orders, Dijkstra, topological sort, SCC, LCA, and Euler tours. Typed handles from Pool\u003cNode> support identity in trees and tries without storing borrows. A persistent data structure holds handles to owned storage; it does not smuggle an escaping slice through the borrow checker. The Minimum-spanning-tree port and Rivers tree DP are useful concrete reading alongside the catalogue. Strings and mathematics # Strings reuse array indexing and slices. The library plan covers hashing, prefix and Z functions, and suffix arrays without changing the ASCII-only text model. For modular arithmetic, the approved design separates Mod\u003cP> for a compile-time modulus from ModR for a runtime modulus. Neither is a new arithmetic rule hidden inside Int . Other planned essentials include gcd , lcm , sieve utilities, factorial tables, binomials, and explicit I128 helpers. Write a local library # A module is a .cp file. A library is a folder with lib.toml ; project configuration maps a short import name to its location. cp.toml \\u00b7 planned library configuration Copy [libs] lib = { path = \\\"../contest-lib\\\" } CP Lang \\u00b7 design fragment Copy use lib.graph.flow as flow use lib.treap.{ Treap } Export declarations with pub , and document them with /// comments. Library modules contain declarations, not surprise input reads or mutable top-level state. The intended bundler follows imports, specializes generics, and includes only reachable code in the one-file C++17 submission. Local libraries change during contests. The planned content-addressed store records exactly the sources used by a build, with explicit pinning and upgrades so old solutions remain reproducible. The cpl test and cpl doc workflows should work equally for your library and for std ; neither is implemented in the current Rust CLI. Go to the source # Read the standard-library plan for scope, abstractions for traits and operation values, and the prototype ports for full solutions. When older plan text disagrees with a later approved design, the approved Index , lends , ASCII strings, Bitset\u003cD> , and .l / .r model is what this guide teaches. \"}]"}</script>
<script>
(() => {
  "use strict";
  const data = JSON.parse(document.getElementById("offline-data").textContent);
  const frame = document.getElementById("workspace");
  let activePage;
  function script(source) {
    // Escape closing tags even if future example strings contain HTML.
    return "<script>" + source.replace(/<\/script/gi, "<\\/script") + "<" + "/script>";
  }
  function route() {
    const parts = location.hash.slice(1).split("#");
    const name = Object.hasOwn(data.pages, parts[0]) ? parts[0] : "index.html";
    return {name, anchor:parts.slice(1).join("#")};
  }
  function scrollToAnchor() {
    const doc = frame.contentDocument, {anchor} = route();
    let id;
    try { id = decodeURIComponent(anchor); } catch (_) { return; }
    if (id) doc.getElementById(id)?.scrollIntoView();
    else frame.contentWindow.scrollTo(0, 0);
  }
  frame.addEventListener("load", () => {
    const doc = frame.contentDocument;
    document.title = doc.title + " · Offline";
    doc.addEventListener("click", event => {
      const link = event.target.closest("a[href]");
      if (!link || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey || link.download) return;
      const href = link.getAttribute("href");
      if (/^https?:/.test(href)) {
        link.target = "_blank"; link.rel = "noopener";
        return;
      }
      const [path, anchor] = href.split("#");
      const name = path ? path.split("/").pop() : activePage;
      if (!Object.hasOwn(data.pages, name)) return;
      event.preventDefault();
      doc.querySelector("dialog[open]")?.close();
      const next = name + (anchor ? "#" + anchor : "");
      if (location.hash.slice(1) === next) scrollToAnchor();
      else location.hash = next;
    });
    scrollToAnchor();
    frame.contentWindow.focus();
  });
  function render() {
    const {name} = route();
    if (name === activePage) { scrollToAnchor(); return; }
    activePage = name;
    let page = data.pages[name];
    page = page.replace('<link rel="stylesheet" href="assets/style.css">', () => "<style>" + data.css + "</style>");
    page = page.replace('<script src="assets/theme.js"><' + '/script>', () => script(data.theme));
    page = page.replace('<script src="assets/app.js" defer><' + '/script>', "");
    page = page.replace('<script src="assets/playground.js"><' + '/script>', () => script(data.playground));
    if (name !== "trace.html") {
      const index = '<script id="search-index" type="application/json">' + data.search.replace(/</g, "\\u003c") + "<" + "/script>";
      page = page.replace("</body>", () => index + script(data.app) + "</body>");
    }
    frame.srcdoc = page;
  }
  window.addEventListener("hashchange", render);
  render();
})();
</script>
</body>
