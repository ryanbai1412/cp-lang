# site metrics. Every command was run on 2026-11-22 against main 4b8f504f.
# browser_smoke needs a built web/out and a Playwright Chromium (or CDP=<url>);
# docs_only_eval_pass needs corpus/statements/ and a model key.

[[metric]]
name = "snippets_spec"
command = "node web/scripts/gate.mjs"
today = "197 snippets: runs 190, spec 7"
target = "spec 0, checks 0"

[[metric]]
name = "site_build"
command = "pnpm --filter cp-lang-web build"
today = "pass, 28.9 s, 239 html pages"
target = "pass"

[[metric]]
name = "typecheck_unit"
command = "pnpm --dir web typecheck && pnpm --dir web test"
today = "pass, 4/4 tests"
target = "pass"

[[metric]]
name = "browser_smoke"
command = "pnpm --dir web smoke"
today = "pass, 0 page errors"
target = "pass, run in CI"

[[metric]]
name = "broken_internal_links"
command = "pnpm --dir web links"
today = 0
target = 0

[[metric]]
name = "wasm_gzip_bytes"
command = "node web/scripts/wasm-size.mjs"
today = 1913207
target = "<= 2000000 (enforced in prebuild; shrink-only, lowered to size + ~5% after each cut)"

[[metric]]
name = "search_index_gzip_bytes"
command = "gzip -9c web/out/api/search | wc -c"
today = 538189
target = "<= 600000"

[[metric]]
name = "docs_only_eval_pass"
command = "python3 scripts/writable-from-docs.py --manifest research/writable-from-docs-set.json"
today = "not runnable: corpus/statements/ absent, scripts/fetch-statement.py deleted; last recorded 49/55 (research/writable-from-docs.json)"
target = ">= 52/55"

[[metric]]
name = "live_routes_up"
command = "for p in / /docs/ /learn/ /play/ /corpus/ /tools/ /performance/ /setup/; do curl -so /dev/null -w '%{http_code}\\n' https://cp-lang.org$p; done"
today = "8/8 200"
target = "8/8 200"

[[metric]]
name = "learn_content"
command = "ls web/content/learn/read/*.mdx | wc -l; ls web/content/practice | wc -l"
today = "11 chapters, 21 problems"
target = "11 chapters, 21 problems"

[[metric]]
name = "page_weight_gzip_bytes"
command = "pnpm --dir web page-weight  # set CDP=<devtools url> to drive a running Chrome"
today = "/ 783,489 in 64 requests (0 of it cpl.wasm), LCP 152 ms; /play 2,483,166 (1,774,735 of it cpl.wasm), LCP 64 ms; /docs/guides/tour 829,726, LCP 104 ms (local static server, no network throttling; / was 2,560,698 before the wasm loaded lazily)"
target = "/ <= 800000 with 0 of it cpl.wasm; /docs/guides/tour <= 900000"

[[metric]]
name = "phone_routes_fit"
command = "pnpm --dir web phone  # set CDP=<devtools url> to drive a running Chrome"
today = "18/18 routes fit 390 px, nothing past the right edge"
target = "every route in web/tests/phone.mjs"
