# diagnostics metrics. Every `today` was measured by running `command` on
# main (packet at 4b8f504f; rows marked 80a47142 re-measured there,
# 2026-11-22); never hand-typed. The scoreboard numbers come from one run of
#   cargo test -p cpl-cli --test recovery -- --nocapture
# (both scoreboards gate again since 2bb28653).

[[metric]]
name = "broken ports: first error on the broken line"
command = "cargo test -p cpl-cli --test recovery recovery_scoreboard -- --ignored --nocapture | grep '^  all'"
today = "100.0% of 414 copies (80a47142)"
target = ">= 99.5%"
milestone = "M1"

[[metric]]
name = "broken ports: cascaded errors"
command = "cargo test -p cpl-cli --test recovery recovery_scoreboard -- --ignored --nocapture | grep '^  all'"
today = "1 per 414 files (0.2%) (80a47142)"
target = "<= 2% (M1: <= 5%)"
milestone = "M1"

[[metric]]
name = "broken ports: silent (a broken copy checks clean)"
command = "cargo test -p cpl-cli --test recovery recovery_scoreboard -- --ignored --nocapture | grep '^  all'"
today = "0"
target = "0"
milestone = "M1"

[[metric]]
name = "broken ports: errors carrying a fix-it"
command = "cargo test -p cpl-cli --test recovery recovery_scoreboard -- --ignored --nocapture | grep '^  all'"
today = "76.6%; 78.6% counted 8 `==` fixes that left `== *=`"
target = ">= 80% (cut-the-value rows have no right fix and stay 0%)"
milestone = "M2"

[[metric]]
name = "common mistakes: errors carrying a fix-it"
command = "cargo test -p cpl-cli --test recovery fix_it_scoreboard -- --ignored --nocapture | grep '^  all'"
today = "100.0% (106/106) (80a47142)"
target = ">= 95%"
milestone = "M1 (>= 88%), M2 (>= 95%)"

[[metric]]
name = "common mistakes: fixes restore the program"
command = "cargo test -p cpl-cli --test recovery fix_it_scoreboard -- --ignored --nocapture | grep '^  all'"
today = "97.2% (80a47142)"
target = ">= 95%"
milestone = "M1"

[[metric]]
name = "common mistakes: cascaded errors"
command = "cargo test -p cpl-cli --test recovery fix_it_scoreboard -- --ignored --nocapture | grep '^  all'"
today = "1 per 107 files (80a47142)"
target = "<= 3"
milestone = "M2"

[[metric]]
name = "spec code blocks: first error a generic `expected ...`"
# Signature-only blocks (API synopses, never programs) are skipped since decision 224.
command = "cargo test -p cpl-cli --test recovery recovery_scoreboard -- --nocapture | grep 'spec/{core,lib}'"
today = "11 of 68 failing blocks (84 blocks, 1154 errors, 92 cascaded); was 75 of 137 counting 70 API synopses"
target = "<= 20"
milestone = "M2"

[[metric]]
name = "scoreboards gated (not #[ignore]d)"
command = "grep -c '^#\\[ignore' crates/cpl-cli/tests/recovery.rs"
today = "2 of 2 gated (80a47142)"
target = "2 of 2"
milestone = "M1"

[[metric]]
name = "benchmark size: spec.cp ports that check clean (the broken-ports base)"
command = "for f in corpus/problems/*/spec.cp; do (cd $(dirname $f) && ../../../target/release/cpl check spec.cp >/dev/null 2>&1) && echo ok; done | wc -l"
today = "37 of 100"
target = "every clean spec.cp is in the benchmark automatically"
milestone = "M1"

[[metric]]
name = "catalogue: emitted codes with an exact trigger and a clean fix"
command = "cargo test -p cpl-cli --test catalogue -- --nocapture | grep '^catalogue:'"
today = "83 of 84 (80a47142)"
target = "all"
milestone = "M1"

[[metric]]
name = "catalogue: compile-time codes whose trigger carries a fix-it"
command = "cargo test -p cpl-cli --test catalogue -- --nocapture | grep '^catalogue:'"
today = "25 of 84 emitted (E0704 row-field rename)"
target = ">= 45"
milestone = "M2"

[[metric]]
name = "catalogue rows with no example message"
command = "awk -F'|' '/^\\| [EWR][0-9]/ && $4 ~ /^ *$/' spec/diagnostics.md | wc -l"
today = "0 (was 33 of 93: 21 errors, 12 traps)"
target = "0"
milestone = "M2"

[[metric]]
name = "codes emitted through raw cpl_diag::Code literals (bypassing codes::)"
command = "grep -rn 'cpl_diag::Code(\"' crates --include=*.rs | grep -v '^crates/cpl-diag/' | wc -l"
today = "2 sites: lint L0609 in cpl-check/src/check/stmt.rs and the non-code `Code(\"overflow\")` in cpl-lsp (was 12; the 10 E-code sites use codes::)"
target = "0"
milestone = "M1"

[[metric]]
name = "catalogued codes with no conformance case"
command = "awk '/^## Diagnostics/,/^## Core cases/' spec/conformance/COVERAGE.md | grep -c 'no case'"
today = "2 (E0504, E0903)"
target = "0 emitted codes"
milestone = "M2"

[[metric]]
name = "golden errors with a help line"
command = "echo $(grep -h '= help:' crates/cpl-cli/tests/diagnostics/*.err | wc -l) help / $(grep -h '^error\\[' crates/cpl-cli/tests/diagnostics/*.err | wc -l) errors"
today = "40 help lines / 58 errors (38 of 58 errors, 66%)"
target = ">= 90%"
milestone = "M2"

[[metric]]
name = "front end: cold check of a 5002-line file (release)"
command = "cargo test --release -p cpl-lsp --test latency front_end_check_is_under_50_ms -- --nocapture"
today = "34 ms median, 48 ms max (5002 lines); keystroke 4 ms"
target = "< 50 ms (the test's budget)"
milestone = "guard"

[[metric]]
name = "budget: cpl run answers < 200 ms, cpl build < 1 s and fits 64 KB (release)"
command = "cargo test -p cpl-cli --test budget -- --nocapture"
today = "2 of 2 pass"
target = "2 of 2"
milestone = "guard"
