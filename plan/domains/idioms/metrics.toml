# idioms metrics. Every `value` is from running `command` on main at
# 2026-11-22 (release build of that tip), from the repo root with target/release on PATH.
# `manual = true`: needs a cold agent, so status runs cannot refresh it; `note` says how.

[[metric]]
name = "dryrun_v03"
command = "for n in $(ls research/dryrun/v03/p[0-9][0-9]_*.cp | xargs -n1 basename | sed 's/\\.cp$//' | grep -v '_w$'); do research/dryrun/v03/loop.sh $n 20; done  # p19 (interactive): cpl check + cpl test"
today = "20/20 pass check, test, stress (20 cases) and the codeforces C++ build"
target = "20/20 at 200 cases, 0 `_w` workaround variants needed (15 exist today)"
note = "These solutions were written with the compiler in the loop, not blind; they prove v0.3 can express the set, not that the skill teaches it."

[[metric]]
name = "blind_skill_eval"
manual = true
command = "for n in <the 20 cold-agent solutions>; do research/dryrun/v03/loop.sh $n 200; done"
today = "20/20 pass, 12/20 first attempt (16/20 without compile fixes), 0 workarounds, 3 lint kept (research/skill-eval/v3/REPORT.md)"
target = "20/20 first-attempt pass, 0 workarounds, 0 non-idiomatic lint flags; then 20/20 on an unseen set"
note = "Known-20 regression baseline: round 3, a cold agent given only skills/cp-lang/ on main. Round 1 (research/skill-eval/REPORT.md): 20/20 with 4 workarounds. The unseen-20 gate waits on plan/QUESTIONS.md."

[[metric]]
name = "skill_check"
command = "uv run python scripts/skill-gen.py --check --cpl target/debug/cpl  # in the fast gate (scripts/check.sh)"
today = "ok on main, 50 files, 76 cp blocks verified"
target = "on main, in the fast gate, 0 drift, every cp block checks"

[[metric]]
name = "ports_check_v03"
command = "for p in $(cat corpus/sets/ecnerwala.txt); do cpl check corpus/problems/$p/port.cp; done"
today = "275/305 (corpus/sets/v03.txt has 277: the 275 plus noi08p5 and noi15p1)"
target = "305/305 v0.3 re-ports (as spec.cp or migrated port.cp)"

[[metric]]
name = "dreams_check_v03"
command = "for p in $(cat corpus/sets/ecnerwala.txt); do cpl check corpus/problems/$p/dream.cp; done"
today = "145/305"
target = "tracked, not a gate: each failing dream is a logged gap in spec/delta/hillclimb.md"

[[metric]]
name = "ports_judge_proven"
command = "cargo test --release -p cpl-cli --test judges -- --include-ignored every_ --nocapture  # every_v03_port_checks + the judges matrix"
today = "275/305 tracked ports (277 entries in corpus/sets/v03.txt) pass every_v03_port_checks; 276 of the 277 were also validated against orig.cpp on samples and/or 30 generated cases (interactive ones through interactor.py); ucup5s02f has no statement, gen or tests yet"
target = "305/305 tracked ports compile with every judge's flags and pass their tests under the profile"

[[metric]]
name = "corpus_suite"
command = "target/release/cpl-conform corpus"
today = "29/100 pass (36 error, 2 trap, 32 untested, 1 wrong); research/scoreboard.json rewritten from this run"
target = "100/100 hill-climb spec.cp pass; untested 0 (every problem has tests)"

[[metric]]
name = "port_lint_warnings"
command = "for p in $(cat corpus/sets/ecnerwala.txt); do f=corpus/problems/$p/port.cp; cpl check $f >/dev/null 2>&1 && cpl lint $f 2>&1; done | grep -o 'warning\\[L[0-9]*\\]' | sort | uniq -c"
today = "21 warnings over the 275 v0.3 ports after cpl lint --fix (L0414 13, L0101 4, L0203 3, L0412 1); 5 are false positives, filed with lint-fmt"
target = "0 false positives on the re-ported corpus (lint-fmt's FP gate)"

[[metric]]
name = "taste_reviews"
command = "python3 scripts/review-check.py"
today = "305/305 scored, median 4, 18 under 4; dreams median 4, 0 sent back"
target = "median >= 4 and 0 under 3 on v0.3 re-ports (today's scores are for pre-0.3 ports)"

[[metric]]
name = "token_ratio"
command = "uv run python scripts/ports-page.py --tokens"
today = "port.cp median 0.52x, max 1.10x, 1 over 1.0x (n=294, 11 originals strip to nothing); dream.cp median 0.49x, max 0.97x, 0 over"
target = "contestant tokens median <= 0.6x C++, none > 1.0x (AGENTS.md goal 1)"

[[metric]]
name = "writable_from_docs"
manual = true
command = "python3 -c \"import json; print(json.load(open('research/writable-from-docs.json'))['latest'])\""
today = "49/55 passed (52 compiled), run of 2026-11-21; read, not re-run"
target = "55/55; re-run with each skill release"
note = "Re-running needs a cold model; site shares this eval."
