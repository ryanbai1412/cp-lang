# One entry per metric; scripts/status.py runs each command hourly.
# Commands run from the repo root. measure.py uses $CPL, else target/release/cpl
# (cargo build --release -p cpl-cli first). Measured 2026-11-22 at 4e2de3cd, 2-core VM.

[[metric]]
name = "spec/CLI command mismatches"
command = "python3 plan/domains/tools/measure.py spec-sync"
target = "0"
today = "14 (spec-only: debug fetch interact locate migrate selftest trace; cli-only: check dap fix judge replay report self)"

[[metric]]
name = "end-to-end tests per command"
command = "python3 plan/domains/tools/measure.py golden"
target = "every command >= 4 (help, one success, one usage error, one exit code); 23/23 with a test"
today = "23/23 with a test; help and unknown-option usage error tested for all 23 (every_command_has_help_and_rejects_an_unknown_option); check 26 fix 1 run 68 judge 1 build 54 judges 1 submit 2 fmt 1 lint 1 explain 1 doc 1 new 1 test 4 stress 14 bench 3 profile 4 cover 2 watch 1 report 2 lsp 5 dap 5 replay 1 self 3 (#[test] fns in crates/*/tests/*.rs that run the cpl binary with the command first in a call, directly or through a helper fn in the same file)"

[[metric]]
name = "commands with --help"
command = "python3 plan/domains/tools/measure.py help"
target = "23/23"
today = "23/23"

[[metric]]
name = "commands offering --json"
command = "python3 plan/domains/tools/measure.py json"
target = "every command that prints results (all but dap, lsp, self, watch)"
today = "9/23"

[[metric]]
