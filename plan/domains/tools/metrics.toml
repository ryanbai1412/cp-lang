# One entry per metric; scripts/status.py runs each command hourly.
# Commands run from the repo root. measure.py uses $CPL, else target/release/cpl
# (cargo build --release -p cpl-cli first). Measured 2026-11-22 at 4e2de3cd, 2-core VM.

[[metric]]
name = "spec/CLI command mismatches"
command = "python3 plan/domains/tools/measure.py spec-sync"
target = "0"
today = "0 (locate built)"

[[metric]]
name = "end-to-end tests per command"
command = "python3 plan/domains/tools/measure.py golden"
target = "every command >= 4 (help, one success, one usage error, one exit code); 26/26 with a test"
today = "26/26: help, usage error, success and failing exit asserted (judges has no failing outcome, only misuse)"

[[metric]]
name = "commands with --help"
command = "python3 plan/domains/tools/measure.py help"
target = "26/26"
today = "26/26"

[[metric]]
name = "commands offering --json"
command = "python3 plan/domains/tools/measure.py json"
target = "every command that prints results (all but dap, lsp, self, watch)"
today = "22/26 (without: dap lsp self watch)"

[[metric]]
name = "cpl check wall time over corpus ports, p95"
command = "python3 plan/domains/tools/measure.py corpus"
target = "< 100 ms (spec bound 500 ms)"
today = "84.5 ms (p50 29.8 ms, max 141.5 ms; 877 ports, 498 check clean, 497 build; a run just before on the loaded VM gave p95 100.0 ms)"

[[metric]]
name = "corpus C++ files over 32 KB"
command = "python3 plan/domains/tools/measure.py corpus"
target = "0"
today = "5 of 497 (max 48686 B cf2255f, 39803 B cf2066e, 37661 B cf2089e, 36429 B cf2262b, 33677 B cf2150f); 0 over 64 KB"

[[metric]]
name = "LSP latency, 500-line file, median"
command = "cargo test --release -p cpl-lsp --test latency -- --nocapture"
target = "check < 50 ms; every request < 100 ms"
today = "check 5 ms; open-to-diagnostics 5 ms; hover 3 ms; completion 2 ms; rename 2 ms"

[[metric]]
name = "LSP latency, 5,000-line file, median"
command = "cargo test --release -p cpl-lsp --test latency -- --nocapture"
target = "check < 50 ms; open-to-diagnostics < 100 ms; test green"
today = "check 39-48 ms (p90 43-63); open-to-diagnostics 37-43 ms; hover in the edited fn 17 ms; passes on c8b9333e4, little room on the cold check (next hot spots filed in compiler's worklog)"

[[metric]]
name = "LSP latency, 5,000-line cold check on Windows, median"
command = "cargo test --release -p cpl-lsp --test latency -- --nocapture (CI job `lsp latency (windows-latest)`)"
target = "< 50 ms, the budget every other OS and size meets; the test enforces < 100 ms on Windows until then"
today = "61-81 ms (p90 73-84) on hosted windows-latest, against 24-39 ms on macOS at the same commits (runs 45155418174, 45165344430, 45166273112, 45169744238); not a regression: 0f82470ab and ff09d6219 measure the same on Linux"

[[metric]]
name = "LSP unit tests"
command = "cargo test --release -p cpl-lsp --lib"
target = "all pass"
today = "77/77"

[[metric]]
name = "VS Code unit and grammar tests"
command = "cd editors/vscode && npm test"
target = "all pass"
today = "37/37"

[[metric]]
name = "editor smoke tests run on this VM"
command = "CPL=target/release/cpl editors/smoke.sh"
target = "tier 1 (VS Code, Neovim) pass in the gate; JetBrains in CI"
