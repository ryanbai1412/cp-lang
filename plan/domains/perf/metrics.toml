# perf metrics. `today` measured 2026-11-22 on main 4b8f504fc, 8-core VM,
# g++ 11.4 -O2, release `cpl` (`cargo build --release -p cpl-cli`).
# E = env -u CPL_SPEC -u CPL_STD -u CPL_EDITION (run outside any edition override).
# Commands marked `branch` need a file that is only on an in-flight branch
# today (bench/v03_perf_bench.py on devin/wip-codegen-perf, scripts/sizes.py on
# devin/wip-cpp-size-main); they land in phase 2 step 1-2.

[[metric]]
name = "zero-cost pairs passing (both bars)"
command = "E ./target/release/cpl bench --zero-cost bench/zero-cost --reps 11 --format json"
target = "7/7"
today = "3/7 (domains, op_values, slices_views); modular and segtree_prefix do not build on v0.3; exit 1"
milestone = "M2"

