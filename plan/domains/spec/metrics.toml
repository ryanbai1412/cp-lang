# spec metrics. Every command runs from the repo root after
# `cargo build --release -p cpl-cli -p cpl-conform`. `today` is the value the
# command printed on 2026-11-22 (matrix landing). Read-only: the coverage commands
# print COVERAGE.md to stdout instead of rewriting it; never hand-edit it without a run.
# conformance-coverage.py rewrites spec/conformance/COVERAGE.md as a side effect.

[[metric]]
name = "conformance cases passing"
command = "target/release/cpl-conform conformance | head -1"
today = "2130/2297"
target = "1711/1711 (pass count owned by compiler; the suite is spec's)"

[[metric]]
name = "conformance cases (ratchet up only)"
command = "find spec/conformance -name '*.cp' | wc -l"
today = "2286"
target = "never decreases"

[[metric]]
name = "rules cited by at least one case"
command = "target/release/cpl-conform --rules 2>&1 | tail -1"
today = "528 of 528 covered"
target = "100%"

[[metric]]
name = "forbidding rules with no reject case (happy-path only; permits.txt rules excluded)"
command = "python3 -c 'import pathlib,runpy,sys; pathlib.Path.write_text=lambda p,t: sys.stdout.write(t); sys.argv=[sys.argv[0]]; runpy.run_path(\"scripts/conformance-coverage.py\", run_name=\"__main__\")' 2>/dev/null | grep -c '\\] \\*happy-path only\\*'"
today = "1"
target = "0"

[[metric]]
name = "case cites to rules no chapter defines"
command = "target/release/cpl-conform --rules 2>&1 | grep -c 'which no chapter defines'"
today = "0"
target = "0"

[[metric]]
name = "core cases with no rule line"
command = "python3 -c 'import pathlib,runpy,sys; pathlib.Path.write_text=lambda p,t: sys.stdout.write(t); sys.argv=[sys.argv[0]]; runpy.run_path(\"scripts/conformance-coverage.py\", run_name=\"__main__\")' 2>/dev/null | awk '/^## Core cases without/{f=1;next} /^## /{f=0} f&&/^- /{n++} END{print n+0}'"
today = "10"
target = "0"

[[metric]]
name = "diagnostic codes with no reject case"
command = "python3 -c 'import pathlib,runpy,sys; pathlib.Path.write_text=lambda p,t: sys.stdout.write(t); sys.argv=[sys.argv[0]]; runpy.run_path(\"scripts/conformance-coverage.py\", run_name=\"__main__\")' 2>/dev/null | grep 'testable codes have no negative case'"
today = "1 of 136"
target = "0"

[[metric]]
name = "std items named by a case"
command = "python3 -c 'import pathlib,runpy,sys; pathlib.Path.write_text=lambda p,t: sys.stdout.write(t); sys.argv=[sys.argv[0]]; runpy.run_path(\"scripts/conformance-coverage.py\", run_name=\"__main__\")' 2>/dev/null | grep 'std items are named by a case'"
today = "2037 of 2245"
target = "2245 of 2245"

[[metric]]
name = "spec code blocks passing"
command = "target/release/cpl-conform spec-blocks | head -1"
today = "80/185 (32 error, 73 skip; given/rejects/spec-only markers)"
target = "every block a case or marked spec-only"

[[metric]]
name = "untagged code blocks in spec/core and spec/lib (spec-blocks skips them)"
command = "awk 'FNR==1{inb=0} /^ *```/{if(!inb){if($0 ~ /^ *```$/)n++; inb=1} else inb=0} END{print n}' spec/core/*.md spec/lib/*.md"
today = "27"
target = "0 (tag each block cp, or mark it spec-only)"

[[metric]]
name = "matrix empty cells"
command = "python3 scripts/conformance-matrix.py --check; echo exit $?"
today = "exit 0 (0 empty cells)"
target = "0"

[[metric]]
name = "trait methods without a case"
command = "uv run scripts/conformance-traits.py --check"
today = "3 gaps of 118 (std and core claimers; the 3 wait on a range's keys in QUESTIONS.md)"
target = "0, over std and core claimers"

[[metric]]
name = "named args in spec/core and spec/lib that no spec/std fn takes"
command = "uv run scripts/conformance-sigs.py --check"
today = "5 (sig-gaps.txt: convolve(concave:), dijkstra(step:), each(sum:, hi:), pow(op:))"
target = "0"

[[metric]]
name = "rebuild holes (probe P1, cold agent, spec/ only)"
command = "grep -m1 'There are' spec/delta/rebuild-5/HOLES.md"
today = "31 (round 5: 9 silent, 18 contradiction, 4 missing-stdlib; round 4: 20)"
target = "< 5"

[[metric]]
name = "reverted compiler fixes caught (probe P2)"
command = "uv run scripts/conformance-bugcatch.py  # writes the table in plan/domains/spec/bugcatch.md"
today = "11/13 revertible fixes (84%) at aa48a8055, suite timeout counts as caught; 15 of 28 candidates no longer revert or build; misses ae43f536 (trace text) and 701193ef (IR lowering, C++ path only)"
target = ">= 90%"

[[metric]]
name = "banned spellings in spec"
command = "python3 scripts/spec-vocab.py | tail -1"
today = "0"
target = "0"

[[metric]]
name = "suite wall time, 2 cores"
command = "/usr/bin/time -f '%e s' target/release/cpl-conform conformance spec-blocks 2>&1 | tail -1"
today = "8.7 s"
target = "< 20 s"

[[metric]]
name = "chapter-table fns missing from the prelude (R11.3.2)"
command = "uv run scripts/conformance-prelude.py --check"
today = "106 (geometry 36, math 31, flows 11, graphs-trees 11, strings 8, search-dp 7, ops-ranges 1, sequence-patterns 1)"
target = "0"
