# lint-fmt metrics. Every command was run on main (4b8f504f) on 2026-11-22
# with a release build (`cargo build --release -p cpl-cli`), from the repo root,
# so `cpl` is target/release/cpl.

[[metric]]
name = "lints_implemented"
command = "target/release/cpl lint --list | wc -l"
today = 38
target = "47 or more (adds L0601-L0609 from spec/diagnostics.md)"

[[metric]]
name = "lints_with_records"
command = "ls -d spec/lints/*/ 2>/dev/null | wc -l"
today = 0
target = "equal to lints_implemented"
note = "38 on devin/wip-idioms-lint (git ls-tree -d --name-only origin/devin/wip-idioms-lint spec/lints/ | wc -l)"

