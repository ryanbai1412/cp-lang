# lint-fmt metrics. Every command was run on main (98618e1b5) on 2026-11-22
# with a release build (`cargo build --release -p cpl-cli`), from the repo root,
# so `cpl` is target/release/cpl.

[[metric]]
name = "lints_implemented"
command = "target/release/cpl lint --list | wc -l"
today = 38
target = "38 plus the catalog lints v0.3 adds (Q1)"
note = "L0601-L0609 are emitted by cpl-check (they need types), not cpl-lint; `cpl lint --list` lists them once lints read checker facts (M3)"

[[metric]]
name = "lints_with_records"
command = "ls -d spec/lints/*/ 2>/dev/null | wc -l"
today = 38
target = "equal to lints_implemented"
note = "record_tests.rs checks each record: before fires, after and near_miss do not, the fix parses and clears it"

[[metric]]
name = "spec_lint_codes_not_in_cpl_lint"
command = "comm -13 <(target/release/cpl lint --list | awk '{print $1}' | sort -u) <(grep -oE 'L0[0-9]{3}' spec/diagnostics.md | sort -u) | wc -l"
today = 9
target = 0
note = "all 9 (L0601-L0609) are emitted by cpl-check: `grep -rn codes::<CONST> crates/cpl-check` finds an emitter for each; spec codes emitted by nothing = 0"

[[metric]]
