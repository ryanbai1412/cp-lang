# The end state of the migration to the new architecture: the suites that say it is done.
# The source of plan/END-STATE.md (scripts/end-state.py writes it; never edit that file).
#
# A suite is done when every number it names is at its target in scripts/debt-ratchet.json.
# `numbers` name debt-ratchet counters, which the gate measures and only lets move toward
# the target. A suite with `missing` has no number yet: `missing` says what would count it,
# and the ratchet's `end_state_unmeasured` counts such suites and only goes down.
#
# Changing a suite's name, target, size, property, numbers or `missing` is a design decision:
# add or rewrite `changed = "<date>: <why>"` on it, or the ratchet's `end_state_broken` fails.

[[suite]]
id = 1
group = "A. The language is implemented, once"
name = "Spec conformance"
decides = "Every spec rule is implemented"
size = "Every rule has at least one accepting and, where it forbids something, one rejecting case; at least 6,000 cases"
properties = "100% pass on every engine and the C++; 0 wrong; 0 refused; error cases match code and line"
level = "3"
numbers = [{ counter = "next_not_passing", target = 0 }, { counter = "conformance_failing", target = 0 }]
missing = "cases short of 6,000; cases the other engines of the new pipeline do not pass"

