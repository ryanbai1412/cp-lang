[case."Show/PotentialDsu/show"]
rule = "std.dsu PotentialDsu prints each position's root:offset in V order, without changing the tree"
code = """
use std.dsu.*
domain V = 0..4
var d = PotentialDsu<V, Int>(op: ^)
d.unite(V(0), V(1), diff: 6)
d.unite(V(1), V(2), diff: 3)
let before = d.diff(V(0), V(2))
print(d)
assert d.diff(V(0), V(2)) == before
"""
out = "0:0 0:6 0:5 3:0"

[case."Show/Dsu/show"]
rule = "std.dsu Dsu prints each vertex's root in V order, without compressing paths"
code = """
domain V = 0..4
var d = Dsu<V>()
let _ = d.unite(V(0), V(1))
let _ = d.unite(V(1), V(3))
print(d)
print(d)
"""
out = "0 0 2 0\n0 0 2 0"

[case."Show/DsuOf/show"]
rule = "std.dsu DsuOf prints each vertex's root in V order, without compressing paths"
code = """
domain V = 0..4
var d = DsuOf<V, Int>(init: v => v.ord, join: (x, y) => x + y)
let _ = d.unite(V(0), V(1))
let _ = d.unite(V(1), V(3))
print(d)
print(d)
"""
out = "0 0 2 0\n0 0 2 0"

