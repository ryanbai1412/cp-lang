[case."Track/Window/push"]
code = """
use std.window.{Window}
fn add<S: Track<Int>>(mut s: S, x: Int) = s.push(x)
var w = Window<Int, (Int, Int) -> Int>.new((a: Int, b: Int) => a + b)
add(mut w, 2)
add(mut w, 3)
print(w.all!, w.len)
"""
out = "5 2"

# Window's own `pop()` takes no argument and wins method lookup (R08), so the
# trait method is reached through a bound.
[case."Track/Window/pop"]
code = """
use std.window.{Window}
fn evict<S: Track<Int>>(mut s: S, x: Int) = s.pop(x)
var w = Window<Int, (Int, Int) -> Int>.new((a: Int, b: Int) => a + b)
w.push(2)
w.push(3)
evict(mut w, 2)
print(w.all!, w.len)
"""
out = "3 1"

