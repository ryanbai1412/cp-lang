# Trait x claimer x method table; scripts/conformance-traits.py writes one
# case per [case."Trait/Type/method"] to spec/conformance/traits/<Trait>/.
# A claimed method with no case must be listed in trait-gaps.txt, which only
# shrinks. Traits declared in spec/std/*.cp are read from there; the core
# traits std types claim are declared here, with the method the impl writes.

[trait.Add]
methods = ["add"]
[trait.Sub]
methods = ["sub"]
[trait.Mul]
methods = ["mul"]
[trait.Div]
methods = ["div"]
[trait.Neg]
methods = ["neg"]
[trait.Pow]
methods = ["pow"]
[trait.BitAnd]
methods = ["bitand"]
[trait.BitOr]
methods = ["bitor"]
[trait.BitXor]
methods = ["bitxor"]
[trait.Ord]
methods = ["lt"]
[trait.Show]
methods = ["show"]
[trait.Read]
methods = ["read"]

[case."Add/Pt/add"]
code = """
use std.geometry.{Pt}
print(Pt(1, 2) + Pt(3, 4))
"""
out = "4 6"

[case."Sub/Pt/sub"]
code = """
use std.geometry.{Pt}
print(Pt(5, 7) - Pt(1, 2))
"""
out = "4 5"

[case."Neg/Pt/neg"]
code = """
use std.geometry.{Pt}
print(-Pt(1, -2))
"""
out = "-1 2"

[case."Mul/Pt/mul"]
code = """
use std.geometry.{Pt}
print(Pt(1, -2) * 3)
"""
out = "3 -6"

[case."Show/Pt/show"]
code = """
use std.geometry.{Pt}
print(Pt(3, -4), "{Pt(0, 5)}")
"""
out = "3 -4 0 5"

