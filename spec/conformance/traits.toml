# Trait x claimer x method table; scripts/conformance-traits.py writes one
# case per [case."Trait/Type/method"] to spec/conformance/traits/<Trait>/.
# Every claimed method needs a case; the gate fails on one without. Traits declared in std/*.cp are read from there; the core
# traits std types claim are declared here, with the method the impl writes.

[trait.Add]
methods = ["add"]
[trait.Sub]
methods = ["sub"]
[trait.Mul]
methods = ["mul"]
[trait.Div]
methods = ["div"]
[trait.Neg]
methods = ["neg"]
[trait.Pow]
methods = ["pow"]
[trait.BitAnd]
methods = ["bitand"]
[trait.BitOr]
methods = ["bitor"]
[trait.BitXor]
methods = ["bitxor"]
[trait.Ord]
methods = ["lt"]
[trait.Eq]
methods = ["eq"]
[trait.Show]
methods = ["show"]
[trait.Read]
methods = ["read"]
[trait.Into]
methods = ["into"]
[trait.Index]
methods = ["ord", "nth"]


# The core types that claim the std/seq.cp sequence traits (spec/core/12-powers.md W4)
# (spec/core/07-sequences.md, capabilities table). Array is `[D]T`.
[trait.IndexedMut]
methods = ["at"]
[trait.Contains]
methods = ["contains"]
