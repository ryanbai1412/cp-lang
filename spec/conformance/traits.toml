[case."Undo/Dsu/mark"]
code = """
use std.dsu.{Dsu}
domain V = 0..3
var d = Dsu<V>()
d.unite(V(0), V(1))
let m = d.mark()
d.unite(V(1), V(2))
d.undo_to(m)
print(yes(d.same(V(0), V(1))), yes(d.same(V(1), V(2))))
"""
out = "YES NO"

[case."Undo/Dsu/undo_to"]
code = """
use std.dsu.{Dsu}
domain V = 0..3
var d = Dsu<V>()
let m = d.mark()
d.unite(V(0), V(2))
d.undo_to(m)
d.undo_to(m)
print(yes(d.same(V(0), V(2))))
"""
out = "NO"

