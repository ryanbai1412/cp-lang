print(x)
"""
out = "2"
input = "9\\n"

[case."Ord/Desc/lt"]
code = """
print(yes(desc(5) < desc(3)), yes(desc(3) < desc(5)))
"""
out = "YES NO"

[case."Show/Desc/show"]
code = """
