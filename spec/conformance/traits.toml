print(c.ord, yes(c == (1).r))
"""
out = "2 YES"

[case."Indexed/List/cut_before"]
code = """
let a = [5, 6, 7, 8]
let c = a.cut_before(1)
print(c.ord, yes(c == (1).l))
"""
out = "1 YES"

[case."Seq/AugSortedBag/each"]
code = """
use std.bag.{AugSortedBag}
var b: AugSortedBag<Int, Int> = AugSortedBag((x, y) => x + y, 0, k => k)
for x in [3, 1, 3]: b.add(x)
for x in b.each(): print(x)
"""
out = "1\n3\n3"
