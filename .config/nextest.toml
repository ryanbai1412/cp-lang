experimental = ["setup-scripts"]

# Start the longest tests first so none of them begins near the end of the
# run and becomes its tail. Ordered by measured wall time on the fast gate.
[[profile.default.overrides]]
filter = 'test(every_port_is_written_for_every_judge_within_its_limit) | test(formats_the_whole_corpus)'
priority = 100

[[profile.default.overrides]]
filter = 'test(/^native_profile_counts_what_the_interpreter_counts_/) | test(=run_matches_cpl_run) | test(golden_runaway_recursion_summarizes_deep_call_stack) | test(the_libraries_ports_and_passing_tests_check_clean)'
priority = 50

[[profile.default.overrides]]
filter = 'test(every_generated_input_is_one_the_programs_reader_accepts) | test(every_row_of_the_catalog_runs_with_the_type_it_names) | test(stress_finds_every_seeded_bug_and_shrinks_it_to_the_minimal_input) | test(=build_matches_cpl_build) | test(deep_recursion_runs_on_the_stack_each_judge_gives) | test(every_runtime_error_of_cpl_run_stops_the_judge_build_too) | test(swaps_truncations_fills_and_repeats_at_the_edges)'
priority = 20

# These time every LSP request against a budget and run one server per core;
# beside the rest of the suite on a 4-core CI runner a request took 1.006 s
# against its 1 s budget (CI run 45082394843). Give them the machine.
[[profile.default.overrides]]
filter = 'binary_id(cpl-lsp::ports) | binary_id(cpl-lsp::latency)'
threads-required = 'num-cpus'

# std's @test fns each fail past the judge's 2 s limit; beside the rest of
# the suite three went past it on a 4-core runner (CI run 45311869328).
[[profile.default.overrides]]
filter = 'test(=std_own_tests_pass)'
threads-required = 'num-cpus'

# Each shard of these runs one thread per core over its files; beside the
# rest of the suite one slow file's thread got a fraction of a core and its
# shard took 68 s against 16 s alone. Give them the machine.
[[profile.default.overrides]]
filter = 'binary_id(cpl-cli::fix_actions) | binary_id(cpl-cli::lsp_parity)'
threads-required = 'num-cpus'

# Each of these runs one LSP server or checker session per core over all of
# std or the corpus; beside the rest of the suite a personal-library shard of
# std_items took 41 s against 9 s alone. Give them the machine.
[[profile.default.overrides]]
filter = 'binary_id(cpl-lsp::std_items) | binary_id(cpl-lsp::completion_replay) | binary_id(cpl-cli::front_end_fuzz)'
threads-required = 'num-cpus'

# The commit tier (scripts/check.sh --commit) skips the end-to-end suites:
# they drive whole programs through the CLI, LSP and conformance corpus, and
# take most of the fast gate's time. The land tier (--fast) runs them all.
[profile.commit]
default-filter = 'not (kind(test) & (package(cpl-cli) | package(cpl-lsp) | package(cpl-conform))) | binary_id(cpl-cli::trace_goldens)'

# The fast gate's partitions (scripts/check.sh). A hung test fails by name
# after 5 min (the slowest hosted fast-gate test took 147 s, CI run
# 45316077004) instead of holding its shard to the job's 20-min timeout, and
# with it every newer main commit queued behind the run.
[profile.gate]
slow-timeout = { period = "60s", terminate-after = 5 }

# scripts/test-times.py --write: every test's time, for the tools lane's
# tests-over-30-s record (research/perf/tools-test-times.json).
[profile.times]
junit = { path = "junit.xml" }

# The budget tests time the release cpl. Built once before they start, the
# build is no shard's time, and no shard waits on the others' cargo lock.
[scripts.setup.release-cpl]
command = 'cargo build --release -p cpl-cli --bin cpl'

[[profile.default.scripts]]
filter = 'binary_id(cpl-cli::budget)'
setup = 'release-cpl'
