name = "cplang-site"
main = "index.ts"
compatibility_date = "2026-11-01"
# Served on cp-lang.org through a Worker custom domain, provisioned with the
# rest of the infrastructure; no routes here.
workers_dev = false

[assets]
directory = "../out"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/p/*", "/api/*"]

[[r2_buckets]]
binding = "SHARES"
bucket_name = "cplang-shares"

# Anonymous share uploads, per client IP.
[[ratelimits]]
name = "SHARE_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
