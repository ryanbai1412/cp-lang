[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
cpl-config = { path = "crates/cpl-config" }
cpl-conform = { path = "crates/cpl-conform" }
cpl-contract = { path = "crates/cpl-contract" }
cpl-diag = { path = "crates/cpl-diag" }
cpl-env = { path = "crates/cpl-env" }
cpl-json = { path = "crates/cpl-json" }
cpl-corpus = { path = "crates/cpl-corpus" }
cpl-wait = { path = "crates/cpl-wait" }
cpl-next-ir = { path = "crates/cpl-next-ir" }
cpl-next-db = { path = "crates/cpl-next-db" }
cpl-next-syntax = { path = "crates/cpl-next-syntax" }
cpl-next-decls = { path = "crates/cpl-next-decls" }
cpl-next-check = { path = "crates/cpl-next-check" }
cpl-next-own = { path = "crates/cpl-next-own" }
cpl-next-lower = { path = "crates/cpl-next-lower" }
cpl-next-link = { path = "crates/cpl-next-link" }
cpl-next-cpp = { path = "crates/cpl-next-cpp" }
cpl-next-interp = { path = "crates/cpl-next-interp" }
cpl-next-engine = { path = "crates/cpl-next-engine" }
cpl-syntax = { path = "crates/cpl-syntax" }
cpl-check = { path = "crates/cpl-check" }
cpl-codegen = { path = "crates/cpl-codegen" }
cpl-interp = { path = "crates/cpl-interp" }
cpl-ir = { path = "crates/cpl-ir" }
cpl-fmt = { path = "crates/cpl-fmt" }
cpl-lint = { path = "crates/cpl-lint" }
cpl-doc = { path = "crates/cpl-doc" }
cpl-facade = { path = "crates/cpl-facade" }
cpl-stress = { path = "crates/cpl-stress" }
cpl-contest = { path = "crates/cpl-contest" }
cpl-lsp = { path = "crates/cpl-lsp" }
cpl-judge = { path = "crates/cpl-judge" }
cpl-prover = { path = "crates/cpl-prover" }
cpl-prim = { path = "crates/cpl-prim" }
cpl-rt = { path = "crates/cpl-rt" }
mimalloc = "0.1.52"
stacker = "=0.1.25"

[profile.release]
lto = "thin"
codegen-units = 1

# The interpreter's frames are its programs' recursion: unoptimized, a call
# takes about seven times the stack, and a test of deep recursion would
# measure the build profile instead of the interpreter.
[profile.dev.package.cpl-interp]
opt-level = 1

# The same holds for the new pipeline's reference interpreter, which the commit
# gate runs on every conformance case: unoptimized, two cases took 7 GB and 7 s
# each and timed out when the rest of the gate ran beside them.
[profile.dev.package.cpl-next]
opt-level = 1
[profile.dev.package.cpl-next-ir]
opt-level = 1
[profile.dev.package.cpl-next-decls]
opt-level = 1
[profile.dev.package.cpl-next-check]
opt-level = 1
[profile.dev.package.cpl-next-own]
opt-level = 1
[profile.dev.package.cpl-next-lower]
opt-level = 1
[profile.dev.package.cpl-next-link]
opt-level = 1
[profile.dev.package.cpl-next-cpp]
opt-level = 1
[profile.dev.package.cpl-next-interp]
opt-level = 1
[profile.dev.package.cpl-next-engine]
opt-level = 1
# The allocator the `cpl-next` and `cpl` binaries use is C; at opt-level 0 its malloc
# costs more than the system one it replaces.
[profile.dev.package.libmimalloc-sys]
opt-level = 3

# Front-end, IR and codegen run thousands of times across the port, differential
# and recovery test suites; opt-level = 1 keeps incremental builds fast while
# cutting `scripts/check.sh --fast` wall time well under the 3-minute budget.
[profile.dev.package.cpl-syntax]
opt-level = 1

[profile.dev.package.cpl-next-syntax]
opt-level = 1

[profile.dev.package.cpl-check]
opt-level = 1

[profile.dev.package.cpl-ir]
opt-level = 1

[profile.dev.package.cpl-codegen]
opt-level = 1

[profile.dev.package.cpl-conform]
opt-level = 1

# Every editor request maps spans to lines and walks the outline; the
# std-item suite asks thousands of them.
[profile.dev.package.cpl-diag]
opt-level = 1

[profile.dev.package.cpl-lsp]
opt-level = 1

# Traces render every step's values as JSON; unoptimized, the checks in its
# string building take most of a traced test's time.
[profile.dev.package.cpl-json]
opt-level = 1

# A `cpl run` proves its ranges, reads its config and env, and judges its
# output; unoptimized, those take most of each run the trace and vm-fallback
# suites make (hundreds of runs per suite).
[profile.dev.package.cpl-prover]
opt-level = 1

[profile.dev.package.cpl-env]
opt-level = 1

[profile.dev.package.cpl-rt]
opt-level = 1

[profile.dev.package.cpl-judge]
opt-level = 1

[profile.dev.package.cpl-config]
opt-level = 1

# read_only_copies builds every shipped program in-process: its `cpl build`
# lints, and walks the corpus to find them.
[profile.dev.package.cpl-lint]
opt-level = 1

[profile.dev.package.cpl-cli]
opt-level = 1

[profile.dev.package.cpl-corpus]
opt-level = 1

# CI's optimized cpl (site, acceptance): what users run is `release`; this
# builds in about two thirds of the time with the same opt-level.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
