[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
cpl-diag = { path = "crates/cpl-diag" }
cpl-json = { path = "crates/cpl-json" }
cpl-syntax = { path = "crates/cpl-syntax" }
cpl-check = { path = "crates/cpl-check" }
cpl-codegen = { path = "crates/cpl-codegen" }
cpl-interp = { path = "crates/cpl-interp" }
cpl-ir = { path = "crates/cpl-ir" }
cpl-fmt = { path = "crates/cpl-fmt" }
cpl-lint = { path = "crates/cpl-lint" }
cpl-doc = { path = "crates/cpl-doc" }
cpl-stress = { path = "crates/cpl-stress" }
cpl-contest = { path = "crates/cpl-contest" }
cpl-lsp = { path = "crates/cpl-lsp" }
cpl-judge = { path = "crates/cpl-judge" }
cpl-prover = { path = "crates/cpl-prover" }

[profile.release]
lto = "thin"
codegen-units = 1

# The interpreter's frames are its programs' recursion: unoptimized, a call
# takes about seven times the stack, and a test of deep recursion would
# measure the build profile instead of the interpreter.
[profile.dev.package.cpl-interp]
opt-level = 1

# Front-end, IR and codegen run thousands of times across the port, differential
# and recovery test suites; opt-level = 1 keeps incremental builds fast while
# cutting `scripts/check.sh --fast` wall time well under the 3-minute budget.
[profile.dev.package.cpl-syntax]
opt-level = 1

[profile.dev.package.cpl-check]
opt-level = 1

[profile.dev.package.cpl-ir]
opt-level = 1

[profile.dev.package.cpl-codegen]
opt-level = 1

[profile.dev.package.cpl-conform]
opt-level = 1
